apply plugin: 'com.android.application'

// Release signing — credentials live in android/keystore.properties (git-ignored).
// Conditional so debug builds / CI without the keystore still work.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) { keystoreProps.load(new FileInputStream(keystorePropsFile)) }

android {
    namespace = "app.rdbk"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.rdbk"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionName + versionCode come from public/version.json — the one source of truth, read
        // here so every build (CI or local) gets the same numbers. versionCode encodes the semver
        // as MAJOR·1 000 000 + MINOR·1 000 + PATCH: strictly increasing with the version and
        // collision-free while MINOR and PATCH stay ≤ 999 (the stamp refuses more, and so does this).
        // Every code it gives is above the 11 000 the older scheme (MAJOR·10 000 + MINOR·100 +
        // PATCH) reached with 1.9.10, the last upload made with it — Play only accepts a higher one.
        def rdbkVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../public/version.json')).version.toString()
        def rdbkParts = rdbkVersion.tokenize('.')
        if (rdbkParts.size() != 3 || !rdbkParts.every { it ==~ /\d+/ }) throw new GradleException("public/version.json: '${rdbkVersion}' is not MAJOR.MINOR.PATCH")
        def (rdbkMajor, rdbkMinor, rdbkPatch) = rdbkParts.collect { it.toInteger() }
        if (rdbkMinor > 999 || rdbkPatch > 999 || rdbkMajor > 2099) throw new GradleException("public/version.json: '${rdbkVersion}' does not fit the versionCode (MINOR and PATCH ≤ 999)")
        def rdbkVc = rdbkMajor * 1000000 + rdbkMinor * 1000 + rdbkPatch
        if (rdbkVc <= 11000) throw new GradleException("versionCode ${rdbkVc} is not above the 11000 already on Play")
        versionCode rdbkVc
        versionName rdbkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // R8 shrinks and OBFUSCATES the release DEX. Play measures that ("DEX code
            // optimization"): an app built without it ships ~2% obfuscated code and is flagged,
            // with publishing consequences. The only thing R8 cannot see is reflection, which is
            // exactly how Capacitor loads its plugins — proguard-rules.pro keeps that surface.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) { signingConfig signingConfigs.release }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
