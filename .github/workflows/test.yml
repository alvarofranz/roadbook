name: Tests

# Unit tests (Vitest) + a syntax check of the shared front-end scripts. Runs
# on every pull request (and manual dispatch for branch testing). `main` is
# covered by the Deploy workflow's gate, so it is not duplicated here.

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax-check every first-party script
        run: |
          set -e
          for f in $(find public -name '*.js' ! -name '*.min.js'); do node --check "$f"; done
      - run: npm test
