name: Android release

# Ships the Android app to Google Play. It runs on:
#   · a push to main that BUMPS public/version.json (a release) — the auto fan-out, so Android goes
#     out together with the web deploy and the iOS build; a merge with no version bump is skipped;
#   · an explicit `android-*` tag, or a manual run (workflow_dispatch) — override / re-run.
# versionName + versionCode come from public/version.json (the single source of truth), so all
# three surfaces always ship the same semver. Prereqs (one-time): the app exists in Play Console
# with a first manual AAB uploaded, Play App Signing enabled, and the service account
# (PLAY_SERVICE_ACCOUNT_JSON) invited with release permissions.
on:
  push:
    branches: [main]
    tags: ['android-*']
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  # Cheap gate: build only on a real release. A main push builds iff public/version.json changed;
  # an explicit tag or manual dispatch always builds. Keeps trivial merges (docs, small fixes) from
  # wasting a build — and from a duplicate versionCode that Play would reject.
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.g.outputs.build }}
      version: ${{ steps.g.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: g
        run: |
          VERSION=$(jq -r .version public/version.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "build=1" >> "$GITHUB_OUTPUT"
            echo "gate: explicit tag/dispatch → build $VERSION"
          else
            OLD=$(git show HEAD^:public/version.json 2>/dev/null | jq -r .version 2>/dev/null || echo "")
            if [ "$VERSION" != "$OLD" ]; then
              echo "build=1" >> "$GITHUB_OUTPUT"; echo "gate: version bump $OLD → $VERSION → build"
            else
              echo "build=0" >> "$GITHUB_OUTPUT"; echo "gate: no version bump ($VERSION) → skip"
            fi
          fi

  release:
    needs: gate
    if: needs.gate.outputs.build == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Android SDK + licenses
        uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Test (syntax-check + unit tests)
        run: |
          for f in $(find public -name '*.js' ! -name '*.min.js'); do node --check "$f"; done
          npm test

      # Rebuild the gitignored client assets the bundle needs, straight from the live site (public
      # by design — same as the iOS ci_post_clone), so the app matches exactly what production serves.
      - name: Rehydrate config.js + FontAwesome from the live site
        run: |
          SITE=https://rdbk.app
          curl -fsSL "$SITE/assets/js/config.js" -o public/assets/js/config.js
          FA=public/assets/fontawesome
          mkdir -p "$FA/css" "$FA/webfonts"
          curl -fsSL "$SITE/assets/fontawesome/css/all.min.css" -o "$FA/css/all.min.css"
          for font in $(grep -o 'webfonts/[A-Za-z0-9.-]*\.\(woff2\|ttf\)' "$FA/css/all.min.css" | sort -u); do
            curl -fsSL "$SITE/assets/fontawesome/$font" -o "$FA/$font"
          done

      - name: Build the native bridge + sync the web into android/
        run: |
          npm run build:native
          npx cap sync android

      - name: Restore the signing keystore from secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > android/rdbk-upload.jks
          {
            echo "storeFile=rdbk-upload.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/keystore.properties

      - name: versionName/versionCode from version.json
        id: ver
        run: |
          VN="${{ needs.gate.outputs.version }}"
          MAJ=$(echo "$VN" | cut -d. -f1)
          MIN=$(echo "$VN" | cut -d. -f2)
          PAT=$(echo "$VN" | cut -d. -f3)
          VC=$((MAJ * 10000 + MIN * 100 + PAT))
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "Building versionName=$VN versionCode=$VC"

      - name: Build the signed AAB
        run: |
          chmod +x android/gradlew
          (cd android && ./gradlew --no-daemon bundleRelease \
            -PrdbkVersionCode=${{ steps.ver.outputs.code }} \
            -PrdbkVersionName=${{ steps.ver.outputs.name }})

      - name: Upload to Google Play (closed testing / alpha track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.rdbk
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: alpha
          status: completed
