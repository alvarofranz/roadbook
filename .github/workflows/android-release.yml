name: Android release

# Ship the Android app to Google Play. Fires ONLY on an `android-*` tag (never on a normal push
# to main), so a web release never triggers an app build — mirrors the iOS `ios-*` tag flow.
# Prereqs (one-time): the app exists in Play Console with a first manual AAB uploaded, Play App
# Signing enabled, and the service account (PLAY_SERVICE_ACCOUNT_JSON) invited in Play Console
# with release permissions. Cut a release: `git tag android-1.0.4 && git push origin android-1.0.4`.
on:
  push:
    tags: ['android-*']
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Android SDK + licenses
        uses: android-actions/setup-android@v3

      - run: npm ci

      # Rebuild the gitignored client assets the bundle needs, straight from the live site (public
      # by design — same as the iOS ci_post_clone), so the app matches exactly what production serves.
      - name: Rehydrate config.js + FontAwesome from the live site
        run: |
          SITE=https://rdbk.app
          curl -fsSL "$SITE/assets/js/config.js" -o public/assets/js/config.js
          FA=public/assets/fontawesome
          mkdir -p "$FA/css" "$FA/webfonts"
          curl -fsSL "$SITE/assets/fontawesome/css/all.min.css" -o "$FA/css/all.min.css"
          for font in $(grep -o 'webfonts/[A-Za-z0-9.-]*\.\(woff2\|ttf\)' "$FA/css/all.min.css" | sort -u); do
            curl -fsSL "$SITE/assets/fontawesome/$font" -o "$FA/$font"
          done

      - name: Build the native bridge + sync the web into android/
        run: |
          npm run build:native
          npx cap sync android

      - name: Restore the signing keystore from secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > android/rdbk-upload.jks
          {
            echo "storeFile=rdbk-upload.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/keystore.properties

      - name: Compute version (code from the run number, name from the tag)
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in android-*) VN="${TAG#android-}" ;; *) VN="1.0.$GITHUB_RUN_NUMBER" ;; esac
          VC=$((100 + GITHUB_RUN_NUMBER))
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "Building versionName=$VN versionCode=$VC"

      - name: Build the signed AAB
        run: |
          chmod +x android/gradlew
          (cd android && ./gradlew --no-daemon bundleRelease \
            -PrdbkVersionCode=${{ steps.ver.outputs.code }} \
            -PrdbkVersionName=${{ steps.ver.outputs.name }})

      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.rdbk
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
