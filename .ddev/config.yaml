name: rdbk
type: php
docroot: public
php_version: "8.1"
webserver_type: nginx-fpm
composer_version: "2"
database:
  type: mariadb
  version: "10.11"

# The PHP API reads its config from the environment (phpdotenv won't override real
# env vars). DDEV's built-in DB is host `db`, name/user/pass all `db`.
web_environment:
  - DB_HOST=db
  - DB_NAME=db
  - DB_USER=db
  - DB_PASS=db
  - APP_SECRET=ddev-local-only-secret
  - BASE_URL=https://rdbk.ddev.site

hooks:
  post-start:
    # PHP deps (phpdotenv) into vendor/
    - composer: install
    # a working client config so the front-end has window.RB_CONFIG (map is free/no-key)
    - exec: "[ -f public/assets/js/config.js ] || cp public/assets/js/config.js.example public/assets/js/config.js"
    # apply any pending SQL migrations (tracked in a _migrations table, so files added
    # later are picked up on every start — not only on a fresh DB). tr strips CRLF in case
    # the script was checked out on Windows.
    - exec: "tr -d '\\r' < .ddev/migrate.sh | bash"
