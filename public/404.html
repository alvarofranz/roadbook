<!doctype html>
<html lang="en">
<head>
<!-- Served by the web server for this status code. Deliberately SELF-CONTAINED: no app.css,
     no app.js, no i18n — an error page has to render when the very thing that is broken is the
     asset pipeline, the session or the API. That is why the three error pages (403 · 404 · 500)
     carry the same inline stylesheet: it is duplication on purpose, kept identical by
     tests/ui-contracts.test.js, which fails the build if one of them drifts (#496). -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>404 — RDBK.app</title>
<style>
:root {
    --bg: #101313; --text: #f4f5f1; --muted: #a1aaa4;
    --sand: #ff7a1a; --sand-2: #ff9b50; --line: rgba(255,255,255,.08);
    --radius: 16px;
    color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
    background: radial-gradient(1200px 600px at 85% -8%, rgba(255,122,26,.14), transparent 60%),
                radial-gradient(900px 500px at -10% 5%, rgba(217,102,59,.10), transparent 55%),
                var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
}
.card {
    text-align: center;
    max-width: 480px;
    padding: 2rem;
}
h1 {
    font-size: 6rem;
    font-weight: 800;
    color: var(--sand);
    line-height: 1;
    margin-bottom: .5rem;
}
p {
    color: var(--muted);
    margin-bottom: 2rem;
    font-size: 1.1rem;
    line-height: 1.6;
}
a {
    display: inline-block;
    padding: .75rem 1.5rem;
    background: var(--sand);
    color: #14100a;
    border-radius: var(--radius);
    font-weight: 600;
    text-decoration: none;
    transition: background .15s;
}
a:hover { background: var(--sand-2); }
hr {
    border: none;
    border-top: 1px solid var(--line);
    margin: 2rem 0 1.5rem;
}
.meta { font-size: .8rem; color: var(--muted); }
</style>
</head>
<body>
<div class="card">
    <h1>404</h1>
    <p>The page you were looking for doesn't exist or has moved.</p>
    <a href="/">Go home</a>
    <hr>
    <p class="meta">RDBK.app</p>
</div>
</body>
</html>
