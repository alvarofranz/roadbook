<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e1116">
    <title>Roadbook Reader · RDBK.app</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css?v=1.1.0-1">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
    <link rel="stylesheet" href="../assets/css/app.css?v=1.1.0-1">
    <style>
        /* top bar: km (prog/part) AND the CAP · clock · GPS · battery indicators all on one row */
        .odometer-bar { position: sticky; top: 56px; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: .5rem 1rem; flex-wrap: wrap; background: var(--card-2); border-bottom: 1px solid var(--line); padding: .45rem .9rem; }
        .odometer-item { display: flex; flex-direction: column; }
        .odometer-item.right { align-items: flex-end; }
        .odometer-item .field-label { font-size: .62rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
        .odometer-item .value { font-size: 2.2rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
        /* top row of the sticky bar: fullscreen toggle (left) · roadbook title (centre) · event logo (right) */
        .odo-toprow { flex: 1 0 100%; display: flex; align-items: center; gap: .6rem; }
        .odo-title { flex: 1; text-align: center; font-weight: 700; font-size: .95rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .odo-fs { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; background: var(--card-2); border: 1px solid var(--line); color: var(--text); font-size: 1.05rem; line-height: 1; cursor: pointer; border-radius: 8px; }
        .odo-fs:hover { color: var(--sand); border-color: var(--sand); }
        .odo-logo { flex-shrink: 0; max-height: 40px; width: auto; object-fit: contain; }
        /* CAP / clock / GPS / battery indicators, at the km value font size */
        .odometer-bar .ind { display: inline-flex; align-items: center; gap: .3rem; font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
        /* bearing indicator: the shared .cap-arrow rotation (0° = up = straight ahead), accented */
        .odometer-bar .cap-arrow { color: var(--sand); }
        .odometer-bar .ind i { font-size: 1.05rem; color: var(--muted); }
        /* bottom CAP bar */
        .capbar { position: fixed; bottom: calc(62px + env(safe-area-inset-bottom)); left: 0; right: 0; z-index: 35; display: flex; align-items: center; justify-content: space-around; gap: .5rem; background: #0a0d12; border-top: 2px solid var(--ok); padding: .55rem 1rem; color: var(--ok); font-weight: 800; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
        .capbar .cap-arrow { font-size: 1.4rem; --cap-rotation: -45deg; } /* the location-arrow glyph points NE, hence the -45° rest */
        .qr-image { width: 260px; height: 260px; image-rendering: pixelated; border-radius: 8px; }
        .mode-grid { margin-top: 1rem; grid-template-columns: 1fr 1fr; }
        .qr-box { display: flex; justify-content: center; margin: .5rem 0; }
        .qr-stats { text-align: left; }
        .qr-code-text { display: block; word-break: break-all; background: var(--card-2); padding: .5rem; border-radius: 8px; margin: .6rem 0; font-size: .72rem; }
        @media (orientation: landscape) and (max-height: 540px) { .odometer-bar { top: 0; } } /* the topbar hide is the shared body.gps-tool rule */
        /* phones: the labelled fabrow buttons drop their decorative icon — the label carries the
           meaning and the freed width keeps all buttons on one overflow-free row (#250) */
        @media (max-width: 480px) { #autoBtn > i, #validateBtn > i, #finishBtn > i { display: none; } }
        /* note rows use the shared white "paper" .nrow grid (app.css); the per-note states
           (done/skipped/active/close) are toggled by reader.js */
        #noteList { background: #fff; color: #14110b; padding-bottom: 8.5rem; }
        /* larger per-note readouts: partial km just under the total, coordinates legible */
        #noteList .col-distance .partial { font-size: 1.6rem; }
        /* the note number and its FIA waypoint-type badge sit side by side at the bottom of the column */
        #noteList .col-distance .num-row { margin-top: auto; display: flex; align-items: center; gap: .4rem; }
        #noteList .col-distance .num-row .num { margin-top: 0; align-self: center; }
        #noteList .col-distance .num-row .wp-badge { display: block; flex-shrink: 0; }
        #noteList .col-text .coords { font-size: .9rem; }
        .nmap { background: #fff; border-bottom: 1px solid #c9c9c9; padding: 4px; }
        /* interactive per-note map (zoom buttons + satellite/topo toggle, one open at a time) */
        .rb-inline-map { height: 320px; width: 100%; border-radius: 6px; overflow: hidden; }
        .opt-row { margin-top: 1rem; display: flex; flex-direction: column; gap: .55rem; text-align: left; }
    </style>
</head>
<body class="gps-tool">
<header class="topbar"></header>

<!-- load -->
<main id="loadScreen" class="wrap center-screen">
    <div class="center-card">
        <div class="big"><i class="fa-solid fa-compass"></i></div>
        <div class="tool-titlebar">
            <h1 data-i18n="fp.tool.reader">Roadbook Reader</h1>
            <a class="tool-help" href="../features/reader/"><i class="fa-solid fa-circle-info"></i> <span data-i18n="How it works">How it works</span></a>
        </div>
        <p class="muted" data-i18n="Load a roadbook and navigate it with GPS.">Load a roadbook and navigate it with GPS.</p>
        <input id="rbFile" type="file" accept=".rdbk,.json,application/x-roadbook" hidden>
        <div class="btnrow mt-2"><button class="btn btn-primary" id="pickRb" data-i18n="Load .rdbk file"><i class="fa-solid fa-folder-open"></i> Load .rdbk file</button></div>
        <div class="btnrow"><button class="btn btn-ghost" id="pickMine" hidden data-i18n="Load one of your RBs"><i class="fa-solid fa-book"></i> Load one of your RBs</button></div>
        <div class="btnrow">
            <button class="btn btn-ghost" id="pickChallenge" data-i18n="Load from public roadbooks"><i class="fa-solid fa-globe"></i> Load from public roadbooks</button>
        </div>
    </div>
</main>

<!-- navigation with a roadbook -->
<div id="navScreen" hidden>
    <!-- top odometer bar: total · bearing+clock · partial -->
    <div class="odometer-bar" role="status" aria-live="polite">
        <div class="odo-toprow">
            <button class="odo-fs" id="odoFs" type="button" title="Fullscreen" data-i18n-title="Fullscreen" aria-label="Fullscreen" data-i18n-aria="Fullscreen"><i class="fa-solid fa-expand"></i></button>
            <div class="odo-title" id="navTitle"></div>
            <img class="odo-logo" id="odoLogo" alt="" hidden>
        </div>
        <div class="odometer-item"><span class="field-label" data-i18n="prog.">prog.</span><span class="value" id="odoTotal">0.00</span></div>
        <span class="ind"><i class="fa-solid fa-arrow-up cap-arrow" id="odoBrgArrow"></i> <span id="odoBrg">—°</span></span>
        <span class="ind"><i class="fa-solid fa-clock"></i> <span id="odoClock">--:--</span></span>
        <span class="ind"><span id="gpsDot" class="gps-dot" aria-hidden="true"></span> <span id="gpsTxt" data-i18n="GPS…">GPS…</span></span>
        <span class="ind"><i class="fa-solid fa-battery-half" id="odoBattIcon"></i> <span id="odoBatt">—</span></span>
        <div class="odometer-item right"><span class="field-label" data-i18n="part.">part.</span><span class="value" id="odoPartial">0.00</span></div>
    </div>
    <!-- 3-column note rows: distances | graphic | indications + coords -->
    <div id="noteList"></div>
    <!-- bottom CAP bar (appears when the active note has a CAP) -->
    <div class="capbar" id="capbar" hidden>
        <span class="cap-heading" id="capHeading">—°</span>
        <span class="cap-speed" id="capSpeed">--</span>
        <span class="cap-dist" id="capDist">— km</span>
        <i class="fa-solid fa-location-arrow cap-arrow" id="capArrow"></i>
    </div>
    <nav class="fabrow">
        <button class="btn btn-ghost rb-switch on" id="autoBtn" role="switch" aria-checked="true" title="Auto: notes are validated by GPS as you reach them. Off: tap to mark each note done." data-i18n-title="Auto: notes are validated by GPS as you reach them. Off: tap to mark each note done."><i class="fa-solid fa-robot"></i> <span data-i18n="Auto">Auto</span> <span class="rb-switch-track" aria-hidden="true"><span class="rb-switch-knob"></span></span></button>
        <button class="btn btn-primary" id="validateBtn" data-i18n="Validate"><i class="fa-solid fa-circle-check"></i> Validate</button>
        <button class="btn btn-ghost" id="pauseBtn" title="Pause" data-i18n-title="Pause" aria-label="Pause" data-i18n-aria="Pause"><i class="fa-solid fa-pause"></i></button>
        <button class="btn btn-ghost" id="navGpx" hidden title="Record GPX" data-i18n-title="Record GPX" aria-label="Record GPX" data-i18n-aria="Record GPX"><i class="fa-solid fa-circle-dot"></i> GPX</button>
        <button class="btn btn-ghost" id="finishBtn"><i class="fa-solid fa-flag-checkered"></i> <span data-i18n="Finish">Finish</span></button>
        <button class="btn btn-ghost" id="endBtn" title="End navigation" data-i18n-title="End navigation" aria-label="End navigation" data-i18n-aria="End navigation"><i class="fa-solid fa-right-from-bracket icon-danger"></i></button>
    </nav>
</div>

<!-- usage mode -->
<div id="modeModal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modeTitle">
        <h2 id="modeTitle" data-i18n="How will you use it?">How will you use it?</h2>
        <div class="opt-row">
            <label class="checkbox-row" id="optMapRow"><input type="checkbox" id="optMap" checked> <span data-i18n="Show map button per note">Show map button per note</span></label>
            <label class="checkbox-row"><input type="checkbox" id="optGpx"> <span data-i18n="Record a GPX track">Record a GPX track</span></label>
            <label class="checkbox-row"><input type="checkbox" id="optSound" checked> <span data-i18n="Sound on note">Sound on note</span></label>
        </div>
        <div class="mode-grid" id="modeGrid">
            <button class="mode-btn" id="modeTrip"><i class="fa-solid fa-compass"></i><b data-i18n="Trip mode">Trip mode</b><small data-i18n="Follow the roadbook freely. No scoring.">Follow the roadbook freely. No scoring.</small></button>
            <button class="mode-btn" id="modeComp"><i class="fa-solid fa-flag-checkered"></i><b data-i18n="Competition mode">Competition mode</b><small data-i18n="Validate every note and get your result QR.">Validate every note and get your result QR.</small></button>
        </div>
        <div id="modeLocked" class="opt-row" hidden>
            <p class="muted small"><i class="fa-solid fa-lock"></i> <span id="modeLockedTxt"></span></p>
            <button class="btn btn-primary" id="modeLockedStart"><i class="fa-solid fa-flag-checkered"></i> <span data-i18n="Start">Start</span></button>
        </div>
    </div>
</div>

<!-- vehicle number -->
<div id="teamModal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="teamTitle">
        <h2 id="teamTitle" data-i18n="Vehicle number"><i class="fa-solid fa-car-side icon-accent"></i> Vehicle number</h2>
        <p class="muted small" data-i18n="Identify your team for the ranking.">Identify your team for the ranking.</p>
        <input id="teamInput" class="modal-in" type="number" min="1" max="999" value="1" inputmode="numeric">
        <div class="btnrow spaced">
            <button class="btn btn-ghost" id="teamCancel" data-i18n="Cancel">Cancel</button>
            <button class="btn btn-primary" id="teamOk" data-i18n="Start"><i class="fa-solid fa-play"></i> Start</button>
        </div>
    </div>
</div>

<!-- final QR -->
<div id="qrModal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
        <h2 id="qrTitle" data-i18n="Result">Result</h2>
        <div id="qrImg" class="qr-box"></div>
        <div id="qrStats" class="muted small qr-stats"></div>
        <code id="qrMeta" class="qr-code-text"></code>
        <div class="btnrow">
            <button class="btn btn-ghost" id="qrClose" data-i18n="Close">Close</button>
            <button class="btn btn-ghost" id="qrShare" data-i18n="Share"><i class="fa-solid fa-share-nodes"></i> Share</button>
            <button class="btn btn-primary" id="qrDownload" data-i18n="Save QR"><i class="fa-solid fa-download"></i> Save QR</button>
        </div>
    </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="../assets/js/config.js?v=1.1.0-1"></script>
<script src="../assets/js/roadbook-core.js?v=1.1.0-1"></script>
<script src="../assets/js/rbzip.js?v=1.1.0-1"></script>
<script src="../assets/js/rbmap.js?v=1.1.0-1"></script>
<script src="../assets/js/gps-meter.js?v=1.1.0-1"></script>
<script src="../assets/js/status-bar.js?v=1.1.0-1"></script>
<script src="../assets/js/gpx-recorder.js?v=1.1.0-1"></script>
<script src="../assets/js/note-canvas.js?v=1.1.0-1"></script>
<script src="../assets/js/qrcode.min.js?v=1.1.0-1"></script>
<script src="../assets/js/challenges.js?v=1.1.0-1"></script>
<script src="../assets/js/i18n.es.js?v=1.1.0-1"></script>
<script src="../assets/js/i18n.it.js?v=1.1.0-1"></script>
<script src="../assets/js/i18n.de.js?v=1.1.0-1"></script>
<script src="../assets/js/i18n.fr.js?v=1.1.0-1"></script>
<script src="../assets/js/i18n.js?v=1.1.0-1"></script>
<script src="../assets/js/app.js?v=1.1.0-1"></script>
<script src="reader.js?v=1.1.0-1"></script>
</body>
</html>
