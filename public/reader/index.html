<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e1116">
    <title>Reader · RDBK.app</title>
    <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css?v=2026.06.13-4">
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css">
    <link rel="stylesheet" href="../assets/css/app.css?v=2026.06.13-4">
    <style>
        /* top odometer bar */
        .odometer-bar { position: sticky; top: 56px; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: .5rem; background: var(--card-2); border-bottom: 1px solid var(--line); padding: .45rem .9rem; }
        .odometer-item { display: flex; flex-direction: column; }
        .odometer-item.right { align-items: flex-end; }
        .odometer-item.heading { align-items: center; }
        .odometer-item .field-label { font-size: .62rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
        .odometer-item .value { font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
        .odometer-item .value.boxed { font-size: 1.25rem; border: 2px solid var(--text); border-radius: 8px; padding: .02rem .5rem; }
        .odometer-item .clock-text { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
        /* bottom CAP bar */
        .capbar { position: fixed; bottom: 62px; left: 0; right: 0; z-index: 35; display: flex; align-items: center; justify-content: space-around; gap: .5rem; background: #0a0d12; border-top: 2px solid var(--ok); padding: .55rem 1rem; color: var(--ok); font-weight: 800; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
        .capbar .cap-arrow { font-size: 1.4rem; transform: rotate(var(--cap-rotation, -45deg)); transition: transform .35s ease; }
        .qr-image { width: 260px; height: 260px; image-rendering: pixelated; border-radius: 8px; }
        .mode-grid { margin-top: 1rem; }
        .qr-box { display: flex; justify-content: center; margin: .5rem 0; }
        .qr-stats { text-align: left; }
        .qr-code-text { display: block; word-break: break-all; background: var(--card-2); padding: .5rem; border-radius: 8px; margin: .6rem 0; font-size: .72rem; }
        @media (orientation: landscape) and (max-height: 540px) { header.topbar { display: none; } }
        /* roadbook navigation rows — white "paper", fixed | fixed | dynamic | buttons */
        #noteList { background: #fff; color: #14110b; padding-bottom: 8.5rem; }
        .nrow { display: grid; grid-template-columns: 96px 124px 1fr 56px; border-bottom: 1px solid #c9c9c9; min-height: 132px; background: #fff; }
        .nrow > div { padding: .45rem .5rem; border-right: 1px solid #d7d7d7; min-width: 0; }
        .nrow .col-distance { display: flex; flex-direction: column; gap: .1rem; }
        .nrow .col-distance .total { font-size: 1.65rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
        .nrow .col-distance .partial { font-size: .8rem; color: #555; font-variant-numeric: tabular-nums; }
        .nrow .col-distance .num { margin-top: auto; align-self: flex-start; background: #14110b; color: #fff; border-radius: 6px; padding: 0 .5rem; font-weight: 800; }
        .nrow .col-distance.close { background: #bfe3ff; } /* light blue: < 50 m to the next note */
        .nrow .col-vignette { display: flex; align-items: center; justify-content: center; padding: .3rem; }
        .nrow .col-vignette svg { width: 100%; height: 100%; max-height: 122px; }
        .nrow .col-text { display: flex; flex-direction: column; font-size: .92rem; }
        .nrow .col-text .text { flex: 1; word-break: break-word; }
        .nrow .col-text .note-cap { color: #c0392b; font-weight: 800; margin-top: .2rem; }
        .nrow .col-text .coords { color: #666; font-size: .68rem; font-variant-numeric: tabular-nums; margin-top: .2rem; }
        .nrow .col-buttons { display: flex; flex-direction: column; gap: .35rem; align-items: center; justify-content: center; border-right: 0; }
        .nrow .col-buttons .note-button { width: 42px; height: 42px; border-radius: 10px; border: 1px solid #bbb; background: #efefef; color: #333; cursor: pointer; font-size: 1rem; }
        .nrow .col-buttons .note-button.reach { background: #2ecc71; color: #fff; border-color: #27ae60; }
        .nrow.done { background: #d6f5e0; }     /* light green: reached */
        .nrow.skipped { background: #ffe1ec; }  /* pink: passed over without being reached */
        .nrow.active { box-shadow: inset 0 0 0 3px #ff2a2a; }            /* red border: target */
        .nrow.active.warn { box-shadow: inset 0 0 0 3px #ff9f1c; }      /* orange: approaching (auto, ≤30 m) */
        .nmap { background: #fff; border-bottom: 1px solid #c9c9c9; padding: 4px; }
        /* interactive per-note map (zoom buttons + satellite/topo toggle, one open at a time) */
        .rb-inline-map { height: 320px; width: 100%; border-radius: 6px; overflow: hidden; }
        .opt-row { margin-top: 1rem; display: flex; flex-direction: column; gap: .55rem; text-align: left; }
        .segmented { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
        .segment-button { flex: 1; background: var(--card-2); color: var(--muted); border: 0; padding: .55rem; font: inherit; font-weight: 700; cursor: pointer; }
        .segment-button.on { background: var(--sand); color: #14100a; }
    </style>
</head>
<body>
<header class="topbar"></header>

<!-- load -->
<main id="loadScreen" class="wrap center-screen">
    <div class="center-card">
        <div class="big"><i class="fa-solid fa-compass"></i></div>
        <h1 data-i18n="Reader">Reader</h1>
        <p class="muted" data-i18n="Load a roadbook and navigate it with GPS.">Load a roadbook and navigate it with GPS.</p>
        <input id="rbFile" type="file" accept=".rdbk,.json,application/x-roadbook" hidden>
        <div class="btnrow mt-2"><button class="btn btn-primary" id="pickRb" data-i18n="Load .rdbk file"><i class="fa-solid fa-folder-open"></i> Load .rdbk file</button></div>
        <div class="btnrow">
            <button class="btn btn-ghost" id="pickChallenge" data-i18n="Load from public challenges"><i class="fa-solid fa-trophy"></i> Load from public challenges</button>
        </div>
    </div>
</main>

<!-- navigation with a roadbook -->
<div id="navScreen" hidden>
    <!-- top odometer bar: total · bearing+clock · partial -->
    <div class="odometer-bar">
        <div class="odometer-item"><span class="field-label" data-i18n="prog.">prog.</span><span class="value" id="odoTotal">0.00</span></div>
        <div class="odometer-item heading"><span class="value boxed" id="odoBrg">—°</span><span class="clock-text" id="odoClock">--:--:--</span><span class="clock-text"><span id="gpsDot" class="gps-dot"></span> <span id="gpsTxt" data-i18n="GPS…">GPS…</span></span></div>
        <div class="odometer-item right"><span class="field-label" data-i18n="part.">part.</span><span class="value" id="odoPartial">0.00</span></div>
    </div>
    <!-- 3-column note rows: distances | graphic | indications + coords -->
    <div id="noteList"></div>
    <!-- bottom CAP bar (appears when the active note has a CAP) -->
    <div class="capbar" id="capbar" hidden>
        <span class="cap-heading" id="capHeading">—°</span>
        <span class="cap-speed" id="capSpeed">--</span>
        <span class="cap-dist" id="capDist">— km</span>
        <i class="fa-solid fa-location-arrow cap-arrow" id="capArrow"></i>
    </div>
    <nav class="fabrow">
        <button class="btn btn-ghost" id="navLoad" title="Load roadbook"><i class="fa-solid fa-folder-open"></i></button>
        <button class="btn btn-ghost" id="autoBtn"><i class="fa-solid fa-robot"></i> Auto: off</button>
        <button class="btn btn-primary" id="validateBtn" data-i18n="Validate"><i class="fa-solid fa-circle-check"></i> Validate</button>
        <button class="btn btn-ghost" id="navGpx" hidden title="Record GPX"><i class="fa-solid fa-circle-dot"></i></button>
        <button class="btn btn-ghost" id="finishBtn"><i class="fa-solid fa-flag-checkered"></i> <span data-i18n="Finish">Finish</span></button>
    </nav>
</div>

<!-- usage mode -->
<div id="modeModal" class="modal" hidden>
    <div class="modal-card">
        <h2 data-i18n="How will you use it?">How will you use it?</h2>
        <div class="opt-row">
            <label class="muted small" data-i18n="Advancement">Advancement</label>
            <div class="segmented">
                <button type="button" class="segment-button on" id="advAuto" data-i18n="Automatic (GPS)">Automatic (GPS)</button>
                <button type="button" class="segment-button" id="advManual" data-i18n="Manual (tap)">Manual (tap)</button>
            </div>
            <label class="checkbox-row" id="optMapRow"><input type="checkbox" id="optMap" checked> <span data-i18n="Show map button per note">Show map button per note</span></label>
            <label class="checkbox-row"><input type="checkbox" id="optGpx"> <span data-i18n="Record a GPX track">Record a GPX track</span></label>
        </div>
        <div class="mode-grid">
            <button class="mode-btn" id="modeTrip"><i class="fa-solid fa-compass"></i><b data-i18n="Trip mode">Trip mode</b><small data-i18n="Follow the roadbook freely. No scoring.">Follow the roadbook freely. No scoring.</small></button>
            <button class="mode-btn" id="modeComp"><i class="fa-solid fa-flag-checkered"></i><b data-i18n="Competition mode">Competition mode</b><small data-i18n="Validate every note and get your result QR.">Validate every note and get your result QR.</small></button>
        </div>
    </div>
</div>

<!-- vehicle number -->
<div id="teamModal" class="modal" hidden>
    <div class="modal-card">
        <h2 data-i18n="Vehicle number"><i class="fa-solid fa-car-side icon-accent"></i> Vehicle number</h2>
        <p class="muted small" data-i18n="Identify your team for the ranking.">Identify your team for the ranking.</p>
        <input id="teamInput" type="number" min="1" max="999" value="1" inputmode="numeric">
        <div class="btnrow spaced">
            <button class="btn btn-ghost" id="teamCancel" data-i18n="Cancel">Cancel</button>
            <button class="btn btn-primary" id="teamOk" data-i18n="Start"><i class="fa-solid fa-play"></i> Start</button>
        </div>
    </div>
</div>

<!-- final QR -->
<div id="qrModal" class="modal" hidden>
    <div class="modal-card">
        <h2 data-i18n="Result">Result</h2>
        <div id="qrImg" class="qr-box"></div>
        <div id="qrStats" class="muted small qr-stats"></div>
        <code id="qrMeta" class="qr-code-text"></code>
        <div class="btnrow">
            <button class="btn btn-ghost" id="qrClose" data-i18n="Close">Close</button>
            <button class="btn btn-ghost" id="qrShare" data-i18n="Share"><i class="fa-solid fa-share-nodes"></i> Share</button>
            <button class="btn btn-primary" id="qrDownload" data-i18n="Save QR"><i class="fa-solid fa-download"></i> Save QR</button>
        </div>
    </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<script src="../assets/js/config.js?v=2026.06.13-4"></script>
<script src="../assets/js/roadbook-core.js?v=2026.06.13-4"></script>
<script src="../assets/js/rbmap.js?v=2026.06.13-4"></script>
<script src="../assets/js/gps-meter.js?v=2026.06.13-4"></script>
<script src="../assets/js/gpx-recorder.js?v=2026.06.13-4"></script>
<script src="../assets/js/note-canvas.js?v=2026.06.13-4"></script>
<script src="../assets/js/qrcode.min.js?v=2026.06.13-4"></script>
<script src="../assets/js/challenges.js?v=2026.06.13-4"></script>
<script src="../assets/js/i18n.js?v=2026.06.13-4"></script>
<script src="../assets/js/app.js?v=2026.06.13-4"></script>
<script src="reader.js?v=2026.06.13-4"></script>
</body>
</html>
