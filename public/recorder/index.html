<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e1116">
    <title>Recorder · RDBK.app</title>
    <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css?v=2026.06.25-15">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
    <link rel="stylesheet" href="../assets/css/app.css?v=2026.06.25-15">
    <style>
        .rec-main { max-width: 560px; padding-top: 1rem; }
        @keyframes recpulse { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
        /* recorded km box sits to the right of Waypoints → four readouts in a row */
        .rec-readouts { grid-template-columns: repeat(4, 1fr); }
        /* live map: the recorded track + waypoints + geotagged photos */
        .rec-map { height: 46vh; min-height: 280px; padding: 0; overflow: hidden; border-radius: 14px; margin-bottom: .8rem; }
        .map-placeholder { padding: 1rem; color: var(--muted); }
        .rec-counts { color: var(--muted); font-size: .8rem; text-align: center; margin-top: -.2rem; }
        /* compact readouts; big full-width Pause/Waypoint on one row (as wide as the map) */
        .rec-main .row3 .mini { padding: .4rem .35rem; }
        .rec-main .row3 .value { font-size: 1.2rem; }
        .rec-main .row3 .key { font-size: .6rem; }
        /* speed is the at-a-glance number while riding: bigger and accented */
        .rec-readouts .mini.speed .value { font-size: 1.75rem; color: var(--sand); }
        #recRunning .btnrow { flex-wrap: nowrap; }
        #recRunning .btnrow .btn { flex: 1; min-width: 0; justify-content: center; padding: 1rem .5rem; font-size: 1.05rem; }
        /* narrow/tall phones: shrink so four readouts + action buttons stay on one row each,
           and tighten the vertical rhythm so the map gets more of the screen */
        @media (max-width: 430px) {
            .rec-readouts { gap: .45rem; }
            .rec-main .row3 .value { font-size: 1rem; }
            .rec-readouts .mini.speed .value { font-size: 1.4rem; }
            #recRunning .btnrow .btn { padding: .85rem .3rem; font-size: .82rem; gap: .25rem; }
            .rec-main { padding-top: .35rem; }
            .rec-main .dash { padding-top: .35rem; gap: .5rem; } /* one uniform gap between sections */
            #recRunning .btnrow { margin-top: 0; }
            .rec-lastwp { margin-bottom: 0; padding: .45rem .6rem; } /* spacing handled by .dash gap */
            .rec-map { margin-bottom: 0; }
        }
        .photo-preview { width: 100%; max-height: 48vh; object-fit: cover; border-radius: 12px; }
        /* waypoint quick-note: text field + dictation mic; the mic pulses while listening */
        .wf-row { display: flex; gap: .5rem; align-items: center; }
        .wf-row .field { flex: 1; min-width: 0; }
        #wfMic.on, #recWptAudio.on { color: var(--track); animation: recpulse 1.2s infinite; }
        /* latest waypoint note (incl. live dictated audio text) shown while recording */
        .rec-lastwp { background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: .5rem .7rem; margin-bottom: .8rem; font-size: .9rem; color: var(--text); }
        @media (orientation: landscape) and (max-height: 540px) { header.topbar { display: none; } }
    </style>
</head>
<body>
<header class="topbar"></header>

<main class="wrap rec-main">
    <!-- idle: start a recording -->
    <div id="recIdle" class="center-screen">
        <div class="center-card">
            <div class="big"><i class="fa-solid fa-circle-dot"></i></div>
            <h1 data-i18n="Recorder">Recorder</h1>
            <p class="muted" data-i18n="Record a GPX track live with GPS.">Record a GPX track live with GPS.</p>
            <div class="btnrow mt-2"><button class="btn btn-primary" id="recStart"><i class="fa-solid fa-circle-dot"></i> <span data-i18n="Start recording">Start recording</span></button></div>
        </div>
    </div>

    <!-- running: readouts + controls, the live map between the action buttons and Finish -->
    <div id="recRunning" hidden>
        <div class="dash">
            <div class="row3 rec-readouts">
                <div class="mini"><div class="value" id="rbElapsed">0:00</div><div class="key" data-i18n="Elapsed">Elapsed</div></div>
                <div class="mini speed"><div class="value" id="rbSpeed">0</div><div class="key">km/h</div></div>
                <div class="mini"><div class="value" id="rbWptsN">0</div><div class="key" data-i18n="Waypoints">Waypoints</div></div>
                <div class="mini"><div class="value" id="rbKmBox">0.00</div><div class="key">km</div></div>
            </div>
            <div class="btnrow">
                <button class="btn btn-ghost" id="recPause"><i class="fa-solid fa-pause"></i> <span id="recPauseTxt" data-i18n="Pause">Pause</span></button>
                <button class="btn btn-ghost" id="recWpt"><i class="fa-solid fa-flag"></i> <span data-i18n="Waypoint">Waypoint</span></button>
                <button class="btn btn-accent" id="recWptAudio" hidden><i class="fa-solid fa-microphone"></i> <span data-i18n="WP audio">WP audio</span></button>
                <button class="btn btn-ghost" id="recPhoto" hidden><i class="fa-solid fa-camera"></i> <span data-i18n="WP photo">WP photo</span></button>
            </div>
            <div id="recLastWp" class="rec-lastwp" hidden></div>
            <div id="recMap" class="rec-map panel"></div>
            <div class="btnrow">
                <button class="btn btn-danger grow" id="recStop"><i class="fa-solid fa-flag-checkered"></i> <span data-i18n="Finish">Finish</span></button>
            </div>
        </div>
    </div>
</main>

<input id="recPhotoFile" type="file" accept="image/*" capture="environment" hidden>
<div id="toast" class="toast" hidden></div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="../assets/js/config.js?v=2026.06.25-15"></script>
<script src="../assets/js/roadbook-core.js?v=2026.06.25-15"></script>
<script src="../assets/js/rbmap.js?v=2026.06.25-15"></script>
<script src="../assets/js/gps-meter.js?v=2026.06.25-15"></script>
<script src="../assets/js/gpx-recorder.js?v=2026.06.25-15"></script>
<script src="../assets/js/i18n.js?v=2026.06.25-15"></script>
<script src="../assets/js/app.js?v=2026.06.25-15"></script>
<script src="../assets/js/status-bar.js?v=2026.06.25-15"></script>
<script src="recorder.js?v=2026.06.25-15"></script>
</body>
</html>
