<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e1116">
    <title>Recorder · RDBK.app</title>
    <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css?v=2026.06.17-4">
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css">
    <link rel="stylesheet" href="../assets/css/app.css?v=2026.06.17-4">
    <style>
        .rec-main { max-width: 560px; padding-top: 1rem; }
        /* running status bar: clock · battery · satellites/GPS · km — shown only while recording.
           sized for phones/tablets: scales with the viewport, large but never clipped */
        .rec-bar { position: sticky; top: 0; z-index: 30; display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
        .rec-bar .rec-cell { display: flex; align-items: center; justify-content: center; gap: .3rem; min-width: 0; background: var(--bg); padding: .85rem .2rem; font-size: clamp(1.15rem, 5.5vw, 1.6rem); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .rec-bar .rec-cell i { font-size: clamp(.95rem, 4vw, 1.25rem); color: var(--muted); }
        .rec-bar .rec-cell .unit { color: var(--muted); font-weight: 700; font-size: clamp(.85rem, 3.5vw, 1.1rem); }
        .rec-bar .rec-cell.ok i, .rec-bar .rec-cell.ok span { color: var(--ok); }
        .rec-bar .rec-cell.mid i, .rec-bar .rec-cell.mid span { color: #ff9f1c; }
        .rec-bar .rec-cell.bad i, .rec-bar .rec-cell.bad span { color: var(--track); }
        /* the km icon blinks while recording (the bar is only shown while recording) */
        .rec-bar .rec-cell .rec-blink { color: var(--track); animation: recpulse 1.2s infinite; }
        @keyframes recpulse { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
        /* live map: the recorded track + waypoints + geotagged photos */
        .rec-map { height: 46vh; min-height: 280px; padding: 0; overflow: hidden; border-radius: 14px; margin-bottom: .8rem; }
        .map-placeholder { padding: 1rem; color: var(--muted); }
        .rec-counts { color: var(--muted); font-size: .8rem; text-align: center; margin-top: -.2rem; }
        /* compact readouts; big full-width Pause/Waypoint on one row (as wide as the map) */
        .rec-main .row3 .mini { padding: .4rem .35rem; }
        .rec-main .row3 .value { font-size: 1.2rem; }
        .rec-main .row3 .key { font-size: .6rem; }
        #recRunning .btnrow { flex-wrap: nowrap; }
        #recRunning .btnrow .btn { flex: 1; min-width: 0; justify-content: center; padding: 1rem .5rem; font-size: 1.05rem; }
        .photo-preview { width: 100%; max-height: 48vh; object-fit: cover; border-radius: 12px; }
        @media (orientation: landscape) and (max-height: 540px) { header.topbar { display: none; } }
    </style>
</head>
<body>
<header class="topbar"></header>

<!-- running status bar (only while recording) -->
<div class="rec-bar" id="recBar" hidden>
    <div class="rec-cell"><i class="fa-solid fa-clock"></i><span id="rbClock">--:--</span></div>
    <div class="rec-cell"><i class="fa-solid fa-battery-half" id="rbBattIcon"></i><span id="rbBatt">—</span></div>
    <div class="rec-cell" id="rbGpsCell"><i class="fa-solid fa-satellite-dish"></i><span id="rbGps">—</span></div>
    <div class="rec-cell"><i class="fa-solid fa-route rec-blink"></i><span id="rbKm">0.00</span> <span class="unit">km</span></div>
</div>

<main class="wrap rec-main">
    <!-- idle: start a recording -->
    <div id="recIdle" class="center-screen">
        <div class="center-card">
            <div class="big"><i class="fa-solid fa-circle-dot"></i></div>
            <h1 data-i18n="Recorder">Recorder</h1>
            <p class="muted" data-i18n="Record a GPX track live with GPS.">Record a GPX track live with GPS.</p>
            <div class="btnrow mt-2"><button class="btn btn-primary" id="recStart"><i class="fa-solid fa-circle-dot"></i> <span data-i18n="Start recording">Start recording</span></button></div>
        </div>
    </div>

    <!-- running: readouts + controls, the live map between the action buttons and Finish -->
    <div id="recRunning" hidden>
        <div class="dash">
            <div class="row3">
                <div class="mini"><div class="value" id="rbElapsed">0:00</div><div class="key" data-i18n="Elapsed">Elapsed</div></div>
                <div class="mini"><div class="value" id="rbSpeed">0</div><div class="key">km/h</div></div>
                <div class="mini"><div class="value" id="rbWptsN">0</div><div class="key" data-i18n="Waypoints">Waypoints</div></div>
            </div>
            <div class="btnrow">
                <button class="btn btn-ghost" id="recPause"><i class="fa-solid fa-pause"></i> <span id="recPauseTxt" data-i18n="Pause">Pause</span></button>
                <button class="btn btn-ghost" id="recWpt"><i class="fa-solid fa-flag"></i> <span data-i18n="Waypoint">Waypoint</span></button>
                <button class="btn btn-ghost" id="recPhoto" hidden><i class="fa-solid fa-camera"></i> <span data-i18n="Photo">Photo</span></button>
            </div>
            <div id="recMap" class="rec-map panel"></div>
            <div class="btnrow">
                <button class="btn btn-danger grow" id="recStop"><i class="fa-solid fa-flag-checkered"></i> <span data-i18n="Finish">Finish</span></button>
            </div>
        </div>
    </div>
</main>

<input id="recPhotoFile" type="file" accept="image/*" capture="environment" hidden>
<div id="toast" class="toast" hidden></div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<script src="../assets/js/config.js?v=2026.06.17-4"></script>
<script src="../assets/js/roadbook-core.js?v=2026.06.17-4"></script>
<script src="../assets/js/rbmap.js?v=2026.06.17-4"></script>
<script src="../assets/js/gps-meter.js?v=2026.06.17-4"></script>
<script src="../assets/js/gpx-recorder.js?v=2026.06.17-4"></script>
<script src="../assets/js/i18n.js?v=2026.06.17-4"></script>
<script src="../assets/js/app.js?v=2026.06.17-4"></script>
<script src="recorder.js?v=2026.06.17-4"></script>
</body>
</html>
