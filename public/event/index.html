<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e1116">
    <title>Event · RDBK.app</title>
    <meta name="description" content="A roadbook event on RDBK.app — see the details and its public roadbooks.">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="RDBK.app">
    <meta property="og:image" content="https://rdbk.app/assets/mockup.png">
    <meta property="og:locale" content="en">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://rdbk.app/assets/mockup.png">
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
    <link rel="stylesheet" href="/assets/fontawesome/css/all.min.css?v=1.7.0-20">
    <link rel="stylesheet" href="/assets/css/app.css?v=1.7.0-20">
    <style>
        #evWrap { max-width: 880px; padding: 1rem 1.1rem 5rem; }
        .ev-head { margin-bottom: 1rem; display: flex; align-items: center; gap: 1rem; }
        .ev-head h1 { margin: .2rem 0 .3rem; font-size: 1.8rem; }
        .ev-head-text { min-width: 0; }
        /* the event logo (#151): boxed like an avatar, never squeezing the title */
        .ev-logo { width: 84px; height: 84px; border-radius: 14px; object-fit: cover; background: var(--card); border: 1px solid var(--line); flex: none; }
        .ev-desc { color: var(--text); line-height: 1.6; white-space: pre-wrap; }
        /* per-card status chip on an event roadbook: sand = reserved to entrants (#25), green = public (#251) */
        .ev-rb-status { margin-top: .3rem; font-size: .78rem; }
        .ev-rb-status.reserved { color: var(--sand); }
        .ev-rb-status.public { color: var(--ok); }
        /* join-with-code (#123): a compact inline form / joined banner between description and roadbooks */
        .ev-join { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: .8rem 1rem; margin: 1rem 0; }
        .ev-join .field { max-width: 12rem; margin: 0; font-family: ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase; }
        .ev-join .btn { width: auto; }
        .ev-join .grow { flex: 1; }
        .ev-hq-map { width: 100%; height: 240px; border-radius: 12px; border: 1px solid var(--line); margin-top: .8rem; }
        .ev-qr-box { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .ev-qr { background: #fff; border-radius: 8px; padding: 6px; }
        .ev-qr-right { flex: 1; min-width: 12rem; }
        .ev-qr-right p { margin: 0 0 .4rem; font-size: .88rem; color: var(--text); }
        .ev-token { font-size: 2.4rem; font-weight: 800; letter-spacing: .25em; word-break: break-all; user-select: all; background: var(--card); padding: .3rem .8rem; border-radius: 8px; text-align: center; font-family: ui-monospace, monospace; }
        .ev-rb-list { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .5rem; }
    </style>
</head>
<body>
<header class="topbar"></header>

<main class="wrap" id="evWrap">
    <p id="evLoading" class="muted" data-i18n="gallery.loading">Loading…</p>
    <article id="evContent" hidden>
        <div class="ev-head">
            <img id="evLogo" class="ev-logo" alt="" hidden>
            <div class="ev-head-text">
                <h1 id="evTitle"></h1>
                <div class="muted small" id="evMeta"></div>
            </div>
        </div>
        <p id="evDesc" class="ev-desc"></p>
        <p id="evWebsite" class="ev-desc" hidden></p>
        <div id="evHqMap" class="ev-hq-map" hidden></div>
        <div class="ev-join" id="evActivate" hidden>
            <div class="ev-qr-box">
                <canvas id="evQrCode" width="180" height="180" class="ev-qr"></canvas>
                <div class="ev-qr-right">
                    <p data-i18n="Show this QR to the event organizer to activate your participation.">Show this QR to the event organizer to activate your participation.</p>
                    <p><code id="evQrToken" class="ev-token"></code></p>
                    <div class="btnrow"><button class="btn btn-ghost btn-sm" id="evQrCopy" type="button"><i class="fa-solid fa-copy"></i> <span data-i18n="Copy">Copy</span></button></div>
                </div>
            </div>
        </div>
        <div class="ev-join" id="evJoin" hidden></div>
        <div class="icon-category" data-i18n="Roadbooks">Roadbooks</div>
        <div class="gallery" id="evRoadbooks"></div>
        <div class="ev-ranking" id="evRanking" hidden>
            <div class="card-head"><h2><i class="fa-solid fa-ranking-star icon-accent"></i> <span data-i18n="Ranking">Ranking</span></h2></div>
            <p class="muted small" data-i18n="Live classification for this event. Open the ranking for a specific competition roadbook to scan result QRs.">Live classification for this event. Open the ranking for a specific competition roadbook to scan result QRs.</p>
            <div id="evRankingLinks" class="ev-rb-list"></div>
        </div>
    </article>
</main>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="/assets/js/config.js?v=1.7.0-20"></script>
<script src="/assets/js/roadbook-core.js?v=1.7.0-20"></script>
<script src="/assets/js/rbmap.js?v=1.7.0-20"></script>
<script src="/assets/js/i18n.es.js?v=1.7.0-20"></script>
<script src="/assets/js/i18n.it.js?v=1.7.0-20"></script>
<script src="/assets/js/i18n.de.js?v=1.7.0-20"></script>
<script src="/assets/js/i18n.fr.js?v=1.7.0-20"></script>
<script src="/assets/js/i18n.js?v=1.7.0-20"></script>
<script src="/assets/js/qrcode.min.js?v=1.7.0-20"></script>
<script src="/assets/js/app.js?v=1.7.0-20"></script>
<script src="event.js?v=1.7.0-20"></script>
</body>
</html>
