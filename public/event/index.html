<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e1116">
    <title>Event · RDBK.app</title>
    <meta name="description" content="A roadbook event on RDBK.app — see the details and its public roadbooks.">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="RDBK.app">
    <meta property="og:image" content="https://rdbk.app/assets/mockup.png">
    <meta property="og:locale" content="en">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://rdbk.app/assets/mockup.png">
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/assets/fontawesome/css/all.min.css?v=2026.07.05-7">
    <link rel="stylesheet" href="/assets/css/app.css?v=2026.07.05-7">
    <style>
        #evWrap { max-width: 880px; padding: 1rem 1.1rem 5rem; }
        .ev-head { margin-bottom: 1rem; display: flex; align-items: center; gap: 1rem; }
        .ev-head h1 { margin: .2rem 0 .3rem; font-size: 1.8rem; }
        .ev-head-text { min-width: 0; }
        /* the event logo (#151): boxed like an avatar, never squeezing the title */
        .ev-logo { width: 84px; height: 84px; border-radius: 14px; object-fit: cover; background: var(--card); border: 1px solid var(--line); flex: none; }
        .ev-desc { color: var(--text); line-height: 1.6; white-space: pre-wrap; }
        /* a READY roadbook delivered to entrants only (#25): small reserved chip on its card */
        .ev-rb-reserved { margin-top: .3rem; font-size: .78rem; color: var(--sand); }
        /* join-with-code (#123): a compact inline form / joined banner between description and roadbooks */
        .ev-join { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: .8rem 1rem; margin: 1rem 0; }
        .ev-join .field { max-width: 12rem; margin: 0; font-family: ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase; }
        .ev-join .btn { width: auto; }
        .ev-join .grow { flex: 1; }
    </style>
</head>
<body>
<header class="topbar"></header>

<main class="wrap" id="evWrap">
    <p id="evLoading" class="muted" data-i18n="gallery.loading">Loading…</p>
    <article id="evContent" hidden>
        <div class="ev-head">
            <img id="evLogo" class="ev-logo" alt="" hidden>
            <div class="ev-head-text">
                <div class="kicker"><a href="/events/" data-i18n="Events">Events</a></div>
                <h1 id="evTitle"></h1>
                <div class="muted small" id="evMeta"></div>
            </div>
        </div>
        <p id="evDesc" class="ev-desc"></p>
        <div class="ev-join" id="evJoin" hidden></div>
        <div class="icon-category" data-i18n="Roadbooks">Roadbooks</div>
        <div class="gallery" id="evRoadbooks"></div>
    </article>
</main>

<script src="/assets/js/i18n.es.js?v=2026.07.05-7"></script>
<script src="/assets/js/i18n.it.js?v=2026.07.05-7"></script>
<script src="/assets/js/i18n.de.js?v=2026.07.05-7"></script>
<script src="/assets/js/i18n.fr.js?v=2026.07.05-7"></script>
<script src="/assets/js/i18n.js?v=2026.07.05-7"></script>
<script src="/assets/js/app.js?v=2026.07.05-7"></script>
<script src="event.js?v=2026.07.05-7"></script>
</body>
</html>
