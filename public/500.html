<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>500 — RDBK.app</title>
<style>
:root {
    --bg: #0e1116; --text: #eef2f7; --muted: #93a0b4;
    --sand: #e8b059; --sand-2: #f2c879; --line: rgba(255,255,255,.08);
    --radius: 16px;
    color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
    background: radial-gradient(1200px 600px at 85% -8%, rgba(232,176,89,.14), transparent 60%),
                radial-gradient(900px 500px at -10% 5%, rgba(217,102,59,.10), transparent 55%),
                var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
}
.card {
    text-align: center;
    max-width: 480px;
    padding: 2rem;
}
h1 {
    font-size: 6rem;
    font-weight: 800;
    color: var(--sand);
    line-height: 1;
    margin-bottom: .5rem;
}
p {
    color: var(--muted);
    margin-bottom: 2rem;
    font-size: 1.1rem;
    line-height: 1.6;
}
a {
    display: inline-block;
    padding: .75rem 1.5rem;
    background: var(--sand);
    color: #14100a;
    border-radius: var(--radius);
    font-weight: 600;
    text-decoration: none;
    transition: background .15s;
}
a:hover { background: var(--sand-2); }
hr {
    border: none;
    border-top: 1px solid var(--line);
    margin: 2rem 0 1.5rem;
}
.meta { font-size: .8rem; color: var(--muted); }
</style>
</head>
<body>
<div class="card">
    <h1>500</h1>
    <p>Something went wrong on our end. Please try again later.</p>
    <a href="/">Go home</a>
    <hr>
    <p class="meta">RDBK.app</p>
</div>
</body>
</html>
