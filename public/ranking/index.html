<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e1116">
    <title>Ranking · RDBK.app</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css?v=2026.07.04-8">
    <link rel="stylesheet" href="../assets/css/app.css?v=2026.07.04-8">
    <style>
        table.rank { width: 100%; border-collapse: collapse; font-size: .9rem; }
        table.rank th, table.rank td { padding: .55rem .5rem; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
        table.rank th:first-child, table.rank td:first-child, table.rank th:nth-child(2), table.rank td:nth-child(2) { text-align: left; }
        table.rank thead th { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
        table.rank tr.top td { color: var(--sand); font-weight: 800; }
        table.rank .final-score { font-weight: 800; color: var(--sand); }
        #video { width: 100%; max-height: 320px; border-radius: 12px; background: #000; display: block; }
        .config-row input { width: 80px; background: var(--card-2); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: .4rem; }
        #manualMeta { flex: 1; min-width: 200px; width: auto; padding: .6rem; }
        .config-row { margin-top: .8rem; align-items: center; }
        #msg { margin-top: .5rem; }
        .rank-results { margin-top: 1rem; }
        .card-head h2 { margin: 0; }
    </style>
</head>
<body>
<header class="topbar"></header>

<main class="wrap tool-page">
    <div class="tool-titlebar">
        <h1>Ranking</h1>
        <a class="tool-help" href="../features/ranking/"><i class="fa-solid fa-circle-info"></i> <span data-i18n="How it works">How it works</span></a>
    </div>
    <section class="panel">
        <h2 data-i18n="Add result">Add result</h2>
        <div class="action-row">
            <button class="btn btn-primary" id="scanBtn"><i class="fa-solid fa-camera"></i> <span data-i18n="Scan QR">Scan QR</span></button>
            <input id="manualMeta" type="text" placeholder="…or paste the code (META) here" data-i18n-ph="…or paste the code (META) here" aria-label="…or paste the code (META) here">
            <button class="btn btn-ghost" id="addManual"><i class="fa-solid fa-plus"></i> <span data-i18n="Add">Add</span></button>
        </div>
        <video id="video" hidden playsinline></video>
        <div class="config-row action-row">
            <label class="muted small"><span data-i18n="Target average speed">Target average speed</span> <input id="targetAvg" type="number" value="30" min="1"> km/h</label>
            <span class="muted small" data-i18n="(used for regularity if the QR doesn't carry it)">(used for regularity if the QR doesn't carry it)</span>
        </div>
        <div id="msg" class="muted small msg"></div>
    </section>

    <section class="panel rank-results">
        <div class="card-head"><h2 data-i18n="Overall ranking">Overall ranking</h2><div class="btn-group"><button class="btn btn-ghost" id="exportCsv"><i class="fa-solid fa-file-csv"></i> CSV</button><button class="btn btn-ghost" id="clearAll" data-i18n="Clear"><i class="fa-solid fa-trash-can"></i> Clear</button></div></div>
        <div class="table-scroll"><table class="rank" id="table"></table></div>
        <p class="muted small" id="empty" data-i18n="No results yet. Scan or paste a QR.">No results yet. Scan or paste a QR.</p>
    </section>
</main>

<div id="toast" class="toast" hidden></div>

<script src="../assets/js/config.js?v=2026.07.04-8"></script>
<script src="../assets/js/roadbook-core.js?v=2026.07.04-8"></script>
<script src="../assets/js/i18n.es.js?v=2026.07.04-8"></script>
<script src="../assets/js/i18n.it.js?v=2026.07.04-8"></script>
<script src="../assets/js/i18n.de.js?v=2026.07.04-8"></script>
<script src="../assets/js/i18n.fr.js?v=2026.07.04-8"></script>
<script src="../assets/js/i18n.js?v=2026.07.04-8"></script>
<script src="../assets/js/app.js?v=2026.07.04-8"></script>
<script src="ranking.js?v=2026.07.04-8"></script>
</body>
</html>
