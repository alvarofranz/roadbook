<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e1116">
    <title>Roadbook Editor · RDBK.app</title>
    <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css?v=2026.07.03-6">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
    <link rel="stylesheet" href="../assets/css/app.css?v=2026.07.03-6">
    <style>
        .ed-row { display: flex; gap: .5rem; align-items: center; margin: .25rem 0; flex-wrap: wrap; }
        /* soft edit lock (#154): the read-only strip above the actions */
        .lock-banner { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; background: rgba(232, 176, 89, .12); border: 1px solid var(--sand); color: var(--sand); border-radius: 10px; padding: .5rem .7rem; margin-bottom: .6rem; font-size: .85rem; }
        .lock-banner .btn { width: auto; margin-left: auto; }
        .ed-row.between { justify-content: space-between; }
        #loadFrom .icon-category { margin-top: 0; }
        .icon-category.flush { margin: 0; }
        .notecount { text-transform: none; letter-spacing: 0; }
        .note-list { display: flex; flex-direction: column; gap: .4rem; }
        .rec-btns .btn-danger { flex: 0 0 auto; }
        .map-box { padding: 0; overflow: hidden; border-radius: 14px; }
        /* right-click map popup → Google Maps link for the clicked point */
        /* every menu row (link or button) shares one rhythm: full width, even vertical padding */
        .map-ctx-link { display: flex; width: 100%; align-items: center; gap: .5rem; padding: .3rem 0; font-weight: 700; color: #1a73e8; text-decoration: none; cursor: pointer; }
        .map-ctx-link:hover { text-decoration: underline; }
        button.map-ctx-link { background: none; border: 0; font: inherit; text-align: left; }
        .map-ctx-coords { display: block; margin-top: .4rem; padding-top: .4rem; border-top: 1px solid #e6e6e6; color: #555; font-size: .72rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .map-ctx-delpt { color: var(--track); }
        /* every row shows its vignette between distance and text; the open row hosts the live editor canvas */
        #canvasWrap { position: relative; width: 160px; max-width: 100%; margin: 0; }
        .note-mini .note-tulip { flex-shrink: 0; width: 160px; display: flex; align-items: center; justify-content: center; }
        .note-mini .note-tulip > svg { width: 100%; height: auto; display: block; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
        /* the icon search sits on its own row above the icons; it grows to fill the width */
        #iconSearch { min-width: 0; }
        #roadSlot, #dangerSlot, #speedSlot, #capTypeSlot, #wpTypeSlot, #wpRadiusSlot { flex-shrink: 0; }
        #roadSlot select, #dangerSlot select, #speedSlot select, #capTypeSlot select { width: auto; min-width: 3.4rem; padding: .3rem .4rem; }
        #wpRadiusSlot input { width: 4.2rem; padding: .3rem .4rem; }
        /* the waypoint-type badge (RB.wpBadgeSVG) shown in a note row, next to the number */
        .note-mini .wp-badge { display: block; flex-shrink: 0; margin-top: .15rem; }
        /* WP-type custom dropdown — each option shows its colour badge (a <select> can't) */
        .wp-dd-wrap { position: relative; }
        .wp-dd-btn { display: inline-flex; align-items: center; gap: .4rem; width: auto; min-width: 7rem; padding: .3rem .5rem; cursor: pointer; text-align: left; }
        .wp-dd-btn .wp-badge { flex-shrink: 0; }
        .wp-dd-chev { margin-left: auto; padding-left: .3rem; color: var(--muted); }
        .wp-dd-none { color: var(--muted); }
        .wp-dd-menu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 30; width: 250px; max-height: 300px; overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: .3rem; }
        .wp-dd-opt { display: flex; align-items: center; gap: .5rem; width: 100%; background: none; border: 0; color: var(--text); font: inherit; text-align: left; padding: .35rem .5rem; border-radius: 7px; cursor: pointer; }
        .wp-dd-opt:hover { background: var(--card-2); }
        .wp-dd-opt.on { background: rgba(232, 176, 89, .14); }
        .wp-dd-opt .wp-dd-cap { font-weight: 800; min-width: 2.6rem; }
        .wp-dd-opt .wp-dd-nm { color: var(--muted); font-size: .82rem; }
        /* Labelled property selects, one row above the icon search (Road / Danger / Speed / CAP type) */
        .prop-field { display: flex; align-items: center; gap: .45rem; min-width: 0; }
        .prop-field > span:first-child { font-size: .66rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
        .logo-preview { width: 46px; height: 46px; object-fit: contain; border-radius: 8px; background: var(--card-2); border: 1px solid var(--line); cursor: pointer; }
        .logo-preview:hover { border-color: var(--sand); }
        .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: .5rem; max-height: 50vh; overflow: auto; overscroll-behavior: contain; }
        /* icons live on a white tile so dark line-art symbols stay legible */
        .icon-grid button { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 6px; cursor: pointer; }
        .icon-grid img { width: 100%; height: 44px; object-fit: contain; }
        .icon-grid .icon-category { grid-column: 1 / -1; margin-top: .25rem; }
        /* icon category filter chips — jump between groups without scrolling */
        .icon-cats { display: flex; flex-wrap: wrap; gap: .35rem; margin: .1rem 0 .25rem; }
        .icon-cat-chip { background: var(--card-2); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: .25rem .65rem; font-size: .72rem; font-weight: 700; cursor: pointer; }
        .icon-cat-chip.on { background: var(--sand); color: #14100a; border-color: var(--sand); }
        .note-mini { display: flex; gap: .5rem; align-items: center; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--rt, #ff5a45); border-radius: 10px; padding: .35rem .5rem .35rem .7rem; cursor: pointer; }
        .note-mini.sel { border-color: var(--sand); box-shadow: 0 0 0 2px var(--sand) inset; }
        .note-mini .note-number { font-weight: 800; color: var(--sand); flex-shrink: 0; }
        /* the text cell: the editable comment (fills the row height), with CAP + coordinates below it */
        .note-mini .note-textcell { flex: 1; min-width: 0; align-self: stretch; display: flex; flex-direction: column; gap: .25rem; }
        .note-mini .note-title { flex: 1; width: 100%; min-width: 0; min-height: 2.2rem; margin: 0; padding: .3rem .5rem; resize: none; }
        .note-mini .note-meta { display: flex; justify-content: space-between; align-items: center; gap: .5rem; padding: 0 .2rem; }
        /* Red CAP on/off toggle: muted when off, red when on */
        .note-mini .note-meta .note-cap { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: .05rem .35rem; font: inherit; font-size: .64rem; font-weight: 800; letter-spacing: .04em; cursor: pointer; }
        .note-mini .note-meta .note-cap.on { color: var(--track); border-color: var(--track); }
        .note-mini .note-meta .note-coords { margin-left: auto; color: var(--muted); font-size: .68rem; font-variant-numeric: tabular-nums; }
        /* distance cell sits right after the number: total km (bold) + partial leg (muted) */
        .note-mini .note-km { flex-shrink: 0; font-size: .68rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; min-width: 3.4rem; }
        .note-mini .note-km b { display: block; font-size: .82rem; font-weight: 800; color: var(--text); }
        /* a photo was taken near this note → tap the "IMG" pill (under the km) to view it */
        .note-mini .note-km .note-photo { display: inline-block; margin-top: .25rem; padding: .05rem .35rem; background: none; border: 1px solid #3a8dff; border-radius: 6px; color: #3a8dff; font: inherit; font-size: .62rem; font-weight: 800; letter-spacing: .04em; line-height: 1.4; cursor: pointer; }
        /* delete + up/down stacked in a vertical column on the right of the row */
        .note-mini .note-actions { flex-shrink: 0; align-self: stretch; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .25rem; }
        .note-mini .note-del, .note-mini .note-nav { flex-shrink: 0; display: inline-flex; background: none; border: 0; padding: .25rem .4rem; font: inherit; cursor: pointer; }
        .note-mini .note-del { font-size: .8rem; font-weight: 800; }
        .note-mini .note-nav { font-size: .95rem; font-weight: 700; line-height: 1; color: var(--muted); }
        .note-mini .note-nav:disabled { opacity: .3; cursor: default; }
        /* the editor expands inline, right under the tapped row (like the Reader's per-note map) */
        .note-edit-slot:empty { display: none; }
        .note-edit-slot { margin: .1rem 0 .5rem; }
        .del-badge { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; line-height: 18px; text-align: center; background: var(--track); color: #fff; border: 0; padding: 0; border-radius: 50%; font: inherit; font-weight: 800; cursor: pointer; }
        .photo-preview { width: 100%; max-height: 48vh; object-fit: cover; border-radius: 12px; }
        .photo-thumb { position: relative; }
        .photo-thumb img { width: 100%; height: 64px; object-fit: cover; border-radius: 8px; }
        /* voice-note rows: nearest-note label · audio player · delete */
        .audio-item { display: flex; align-items: center; gap: .5rem; }
        .audio-item .audio-note { flex-shrink: 0; min-width: 2.2rem; font-weight: 800; color: var(--sand); font-size: .8rem; }
        .audio-item audio { flex: 1; min-width: 0; height: 34px; }
        .audio-item .del-badge { position: static; width: 22px; height: 22px; line-height: 22px; flex-shrink: 0; }
        /* a note's voice note(s): the recorded clip shown ON the note row, under its text */
        .note-audio { display: flex; flex-direction: column; gap: .3rem; margin-top: .35rem; }
        .note-audio audio { height: 30px; }
        #edMap { height: 60vh; min-height: 360px; }
        body.placing-photo #edMap { cursor: crosshair; }
        /* photo viewer: overlays ONLY the map box (so the notes panel stays editable) */
        #lightbox { position: absolute; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; background: rgba(6, 8, 12, .94); }
        #lightbox img { max-width: 94%; max-height: 88%; object-fit: contain; border-radius: 8px; }
        .lb-close, .lb-nav { position: absolute; border: 0; background: rgba(255, 255, 255, .12); color: #fff; cursor: pointer; border-radius: 50%; }
        .lb-close { top: 1rem; right: 1rem; width: 44px; height: 44px; font-size: 1.2rem; }
        .lb-nav { top: 50%; transform: translateY(-50%); width: 52px; height: 52px; font-size: 1.6rem; }
        .lb-prev { left: 1rem; } .lb-next { right: 1rem; }
        .lb-close:hover, .lb-nav:hover { background: rgba(255, 255, 255, .26); }
        .lb-actions { position: absolute; bottom: 1.2rem; left: 50%; transform: translateX(-50%); display: flex; gap: .5rem; flex-wrap: wrap; justify-content: center; }
        /* the GPX editor: map + vertical tool bar (overlaid left, like the Mapbox controls) */
        .map-editor { position: relative; }
        /* no overflow clipping here — the hover tooltips render outside the bar */
        .map-tools { position: absolute; top: 10px; left: 10px; z-index: 6; display: flex; flex-direction: column; gap: 2px; background: rgba(14, 17, 22, .88); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
        .map-tool { position: relative; width: 40px; height: 40px; flex-shrink: 0; border: 0; border-radius: 9px; background: transparent; color: var(--text); cursor: pointer; font-size: .9rem; }
        .map-tool:hover { background: var(--card-2); }
        .map-tool.on { background: var(--sand); color: #14100a; }
        /* collapsible "more tools" menu (Navigate + Add note) flying out to the right of the bar */
        .map-tools-menu { position: absolute; top: 14px; left: 60px; display: flex; flex-direction: column; gap: 2px; background: rgba(14, 17, 22, .88); border: 1px solid var(--line); border-radius: 12px; padding: 4px; z-index: 8; }
        .map-tool:disabled { opacity: .35; cursor: default; }
        .map-tools-sep { height: 1px; flex-shrink: 0; background: var(--line); margin: 2px 4px; }
        /* top-right map control (next to the zoom buttons): satellite/terrain toggle + zoom level */
        .rb-mapctl-layers { width: 29px; height: 29px; display: flex; align-items: center; justify-content: center; background: #fff; border: 0; cursor: pointer; color: #333; }
        .rb-mapctl-layers:hover { background: #f2f2f2; }
        .rb-mapctl-zoom { background: #fff; color: #333; font-size: .6rem; font-weight: 700; text-align: center; padding: 1px 2px 2px; font-variant-numeric: tabular-nums; border-top: 1px solid var(--line); }
        /* export popup: indent the GPX waypoint-icon sub-options under "Waypoints" */
        .gpx-sub { margin-left: 1.5rem; }
        /* map context menu: the keyboard-shortcut hint, pushed to the right of each command */
        .map-ctx-key { margin-left: auto; padding-left: 1.5rem; color: #999; font-size: .82em; font-weight: 700; }
        /* raw JSON/GPX editor (#28) */
        .raw-edit { width: 100%; height: 55vh; min-height: 240px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .76rem; line-height: 1.4; white-space: pre; overflow: auto; background: var(--card-2); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: .6rem .7rem; }
        .ok-msg { color: #3ad29f; } .err-msg { color: var(--track); }
        /* draggable marker shown while moving a photo on the map */
        .rb-photo-pin { padding: 0 7px; height: 26px; border-radius: 13px; background: #3a8dff; border: 2px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.55); color: #fff; font-weight: 800; font-size: 11px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: grab; }
        .map-tool[data-tip]:hover:not(:disabled)::after { content: attr(data-tip); position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%); white-space: nowrap; background: #0a0d12; border: 1px solid var(--line); color: var(--text); font-size: .78rem; font-weight: 600; padding: .3rem .55rem; border-radius: 8px; pointer-events: none; z-index: 7; }
        /* white vignette: shows EXACTLY what gets produced/printed (matches the Reader + PDF) */
        .vignette-box { position: relative; width: 100%; max-width: 170px; margin: .2rem 0 .4rem; aspect-ratio: 230/162; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; touch-action: none; }
        .vignette-box-junctions { cursor: pointer; }
        .vignette-box-icon { cursor: grab; }
        .vignette-drag-handle { cursor: move; }
        .vignette-resize-handle { cursor: nwse-resize; }
        .add-junction { position: absolute; top: 4px; right: 4px; z-index: 4; width: 26px; height: 26px; font-size: .72rem; border-radius: 7px; border: 1px solid var(--line); background: rgba(14,17,22,.82); color: var(--text); cursor: pointer; }
        .add-junction:hover { background: rgba(14,17,22,.95); }
        .vignette-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        .vignette-toolbar { display: flex; gap: 5px; align-items: center; justify-content: center; flex-wrap: wrap; max-width: 360px; margin: 0 auto .5rem; padding: 5px 6px; background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; }
        .vignette-toolbar:empty { display: none; }
        .vignette-toolbar button { width: 30px; height: 30px; border: 0; border-radius: 7px; background: var(--card-2); color: var(--text); cursor: pointer; font-size: .85rem; }
        .vignette-toolbar button.on { background: var(--sand); color: #14100a; }
        .vignette-toolbar button.danger { color: var(--track); }
        .vignette-toolbar select { background: var(--card-2); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: .3rem; }
        #viewMap, #viewConfig { max-width: 720px; margin: 0 auto; }
        #loadFrom { margin-bottom: 1rem; }
        /* the map view's right column: the notes list, each row expanding its editor inline */
        .note-list-zone { margin-top: .3rem; }
        .note-edit-zone { background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: .6rem .7rem; }
        .note-edit-zone .icon-grid { max-height: 28vh; }
        .note-edit-zone .vignette-toolbar { max-width: none; }
        /* canvas above, icon palette below — keeps both usable in the narrow column */
        .vig-split { display: flex; flex-direction: column; gap: .2rem; }
        .load-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .6rem; }
        .load-card { display: flex; flex-direction: column; align-items: flex-start; gap: .15rem; background: var(--card-2); border: 1px solid var(--line); border-radius: 14px; padding: .9rem 1rem; cursor: pointer; color: var(--text); text-align: left; transition: border-color .15s, transform .1s; }
        .load-card:hover { border-color: var(--sand); transform: translateY(-1px); }
        .load-card i { font-size: 1.3rem; color: var(--sand); margin-bottom: .15rem; }
        .load-card b { font-size: 1rem; }
        .load-card small { color: var(--muted); font-size: .76rem; }
        .record-bar { display: flex; flex-direction: column; gap: .55rem; background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: .65rem .9rem; margin-bottom: .8rem; }
        .rec-status { display: flex; align-items: center; gap: .5rem; }
        .rec-btns { display: flex; gap: .45rem; }
        .rec-btns .btn { flex: 1; justify-content: center; padding: .6rem .4rem; }
        .rec-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--track); animation: recpulse 1.2s infinite; flex-shrink: 0; }
        @keyframes recpulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
        .rb-actions { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; justify-content: space-between; margin-top: .9rem; }
        .rb-actions .btn-group { flex-wrap: wrap; } /* phones: action buttons wrap instead of overflowing off-screen */
        .rb-actions-right { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; flex: 1 1 260px; }
        /* labelled field cards (roadbook details + note properties) */
        .meta-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 1rem; margin-top: 1rem; }
        .meta-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .8rem; }
        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem 1rem; }
        .meta-field { display: flex; flex-direction: column; gap: .35rem; min-width: 0; }
        .meta-field > span:first-child { font-size: .66rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
        .meta-field.full { grid-column: 1 / -1; }
        /* a field laid out as label + control on one line (e.g. Description) */
        .meta-field.inline { flex-direction: row; align-items: center; gap: .7rem; }
        .meta-field.inline > span:first-child { flex: 0 0 auto; }
        .meta-field.inline > .field { flex: 1; min-width: 0; }
        /* settings split into labelled groups (Identity · Waypoints & scoring · Visibility & map · Route) */
        .meta-group { margin-top: 1.2rem; }
        .meta-group:first-child { margin-top: 0; }
        .meta-grouphead { display: flex; align-items: center; gap: .6rem; margin-bottom: .75rem; font-size: .64rem; text-transform: uppercase; letter-spacing: .1em; color: var(--sand); font-weight: 800; }
        .meta-grouphead::after { content: ""; flex: 1; height: 1px; background: var(--line); }
        .meta-modified { margin-top: 1.2rem; padding-top: .7rem; border-top: 1px solid var(--line); font-size: .72rem; color: var(--muted); }
        .meta-modified #rbModified { color: var(--text); }
        .logo-row { display: flex; gap: .5rem; align-items: center; }
        /* desktop: wider editor, the start cards on one line */
        @media (min-width: 900px) {
            #viewMap { max-width: 1100px; }
            .load-opts { grid-template-columns: repeat(4, 1fr); }
        }
        /* tablet landscape (iPad) and up: RB-suite split — the map pinned on the
           left, the notes + inline editor column on the right */
        @media (min-width: 1024px) {
            main.tool-page { max-width: 1680px; } /* the split layout earns the full width */
            /* the split grid is for editing only — on the landing screen #viewMap stays the
               centred 1100px column (otherwise the start cards hug the left of a 1680px row) */
            #viewMap:has(#mapEditor:not([hidden])) { max-width: none; display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 1.2rem; align-items: start; margin: 0 -1.1rem; }
            .map-box { border-radius: 0; }
            #landing, #recBar { grid-column: 1 / -1; }
            .map-editor { position: sticky; top: 66px; }
            #edMap { height: calc(100vh - 112px); }
            /* the notes column is its own pane: commands + "Notes" heading stay fixed, the list
               scrolls inside its own area (like an iframe) and ends at the pane's bottom edge */
            #rbPanel { position: sticky; top: 66px; height: calc(100vh - 112px); display: flex; flex-direction: column; }
            .rb-actions { margin-top: 0; flex-shrink: 0; }
            .note-list-zone { margin-top: .2rem; flex: 1; min-height: 0; display: flex; flex-direction: column; }
            .note-list-zone .icon-category { margin-top: .2rem; flex-shrink: 0; }
            #noteList { flex: 1; min-height: 0; overflow-y: auto; }
        }
        /* phones & portrait tablets (stacked): pin the map at the top of the screen and let
           the notes scroll beneath it — editing a note always keeps its map in view */
        @media (max-width: 1023px) {
            .map-editor { position: sticky; top: 56px; z-index: 20; }
            #edMap { height: 40vh; min-height: 240px; }
        }
        @media (max-width: 600px) {
            #edMap { height: 46vh; }
            .icon-grid { grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); max-height: 38vh; }
            .map-tools { max-height: calc(100% - 20px); overflow-y: auto; } /* touch: no hover tooltips, scrolling wins */
            .meta-grid { grid-template-columns: 1fr; }
            /* phones: the text takes the row; the tulip drops to its own line below it */
            .note-mini { flex-wrap: wrap; }
            .note-mini .note-tulip { order: 9; flex-basis: 100%; width: auto; }
            .note-mini .note-tulip > svg { max-width: 160px; }
        }
    </style>
</head>
<body>
<header class="topbar"></header>
<input id="gpxFile" type="file" accept=".gpx,.wpt" multiple hidden>
<input id="jsonFile" type="file" accept=".rdbk,.json,application/x-roadbook" hidden>

<main class="wrap tool-page">
    <!-- VIEW A: map + notes -->
    <section id="viewMap">
        <!-- opening screen: ways to start a new roadbook (existing ones are re-opened from the profile) -->
        <div id="landing">
            <div class="tool-titlebar">
                <h1 data-i18n="fp.tool.editor">Roadbook Editor</h1>
                <a class="tool-help" href="../features/editor/"><i class="fa-solid fa-circle-info"></i> <span data-i18n="How it works">How it works</span></a>
            </div>
            <div id="loadFrom">
                <div class="icon-category" data-i18n="Start new Roadbook from:">Start new Roadbook from:</div>
                <div class="load-opts">
                    <button class="load-card" id="loadGpx"><i class="fa-solid fa-route"></i><b>GPX</b><small data-i18n="Import a GPS track">Import a GPS track</small></button>
                    <button class="load-card" id="drawRoute"><i class="fa-solid fa-pencil"></i><b data-i18n="Draw on the map">Draw on the map</b><small data-i18n="Sketch a route tapping the map">Sketch a route tapping the map</small></button>
                    <button class="load-card" id="loadJson"><i class="fa-solid fa-file-code"></i><b>.rdbk</b><small data-i18n="Open an existing roadbook">Open an existing roadbook</small></button>
                    <button class="load-card" id="pickChallenge"><i class="fa-solid fa-trophy"></i><b data-i18n="Start from a public RB">Start from a public RB</b><small data-i18n="Public Roadbooks">Public Roadbooks</small></button>
                </div>
            </div>
            <div id="myRbSection" hidden>
                <div class="icon-category" data-i18n="Your roadbooks">Your roadbooks</div>
                <div id="myRbList" class="rb-grid"></div>
            </div>
            <!-- roadbooks you can edit through your events (#123): someone else's, with the event named -->
            <div id="coeditSection" hidden>
                <div class="icon-category" data-i18n="From your events">From your events</div>
                <div id="coeditList" class="rb-grid"></div>
            </div>
        </div>
        <div id="recBar" class="record-bar" hidden>
            <div class="rec-status"><span class="rec-dot"></span> <span id="recStats" class="muted small">Recording…</span></div>
            <div class="rec-btns">
                <button class="btn btn-ghost" id="recPause"><i class="fa-solid fa-pause"></i></button>
                <button class="btn btn-ghost" id="recPhoto" hidden><i class="fa-solid fa-camera"></i></button>
                <button class="btn btn-ghost" id="recWaypoint" data-i18n="Waypoint"><i class="fa-solid fa-location-dot"></i> Waypoint</button>
                <button class="btn btn-danger" id="recDiscard" hidden title="Discard recording" data-i18n-title="Discard recording" aria-label="Discard recording" data-i18n-aria="Discard recording"><i class="fa-solid fa-trash-can"></i></button>
                <button class="btn btn-primary" id="recStop" data-i18n="Finish"><i class="fa-solid fa-flag-checkered"></i> Finish</button>
            </div>
        </div>
        <input id="recPhotoFile" type="file" accept="image/*" capture="environment" hidden>
        <input id="addGpxFile" type="file" accept=".gpx" hidden>
        <input id="ctxPhotoFile" type="file" accept="image/*" multiple hidden>
        <!-- the GPX editor: the map + its vertical tool bar (modes left, actions below) -->
        <div id="mapEditor" class="map-editor" hidden>
            <div class="map-tools" role="toolbar" aria-label="GPX editing tools">
                <button class="map-tool" id="mapMenuToggle" aria-label="More tools"><i class="fa-solid fa-bars"></i></button>
                <span class="map-tools-sep"></span>
                <button class="map-tool" id="undoBtn" disabled aria-label="Undo"><i class="fa-solid fa-arrow-rotate-left"></i></button>
                <button class="map-tool" id="redoBtn" disabled aria-label="Redo"><i class="fa-solid fa-arrow-rotate-right"></i></button>
            </div>
            <!-- ☰ submenu (sibling of the toolbar so its overflow never clips it): every tool lives here.
                 Move is the default map mode (no button); only the menu toggle + undo/redo stay on the bar (#61). -->
            <div class="map-tools-menu" id="mapMenuPanel" hidden>
                <button class="map-tool" id="toolCut" data-tool="cut" aria-label="Cut" disabled><i class="fa-solid fa-scissors"></i></button>
                <span class="map-tools-sep"></span>
                <button class="map-tool" id="toolAddGpx" aria-label="Add a GPX track" disabled><i class="fa-solid fa-file-circle-plus"></i></button>
                <button class="map-tool" id="toolSimplify" aria-label="Simplify" disabled><i class="fa-solid fa-broom"></i></button>
                <button class="map-tool" id="toolAdjust" aria-label="Adjust on the trail" disabled><i class="fa-solid fa-location-crosshairs"></i></button>
            </div>
            <div id="edMap" class="panel map-box"></div>
            <!-- photo viewer: overlays ONLY the map, so the notes panel stays editable -->
            <div id="lightbox" hidden>
                <button type="button" id="lbClose" class="lb-close" aria-label="Close" data-i18n-aria="Close">✕</button>
                <button type="button" id="lbPrev" class="lb-nav lb-prev" aria-label="Previous" data-i18n-aria="Previous">‹</button>
                <img id="lbImg" alt="">
                <button type="button" id="lbNext" class="lb-nav lb-next" aria-label="Next" data-i18n-aria="Next">›</button>
                <div class="lb-actions">
                    <button type="button" id="lbMove" class="btn btn-ghost"><i class="fa-solid fa-up-down-left-right"></i> <span data-i18n="Move on map">Move on map</span></button>
                    <button type="button" id="lbWaypoint" class="btn btn-primary"><i class="fa-solid fa-map-pin"></i> <span data-i18n="Waypoint">Waypoint</span></button>
                    <button type="button" id="lbDelete" class="btn btn-danger"><i class="fa-solid fa-trash-can"></i> <span data-i18n="Delete">Delete</span></button>
                </div>
            </div>
        </div>
        <div id="rbPanel" hidden>
            <!-- soft edit lock (#154): someone else is editing → read-only + force unlock -->
            <div id="lockBanner" class="lock-banner" hidden>
                <i class="fa-solid fa-lock"></i> <span id="lockBannerText"></span>
                <button class="btn btn-ghost" id="lockForce" type="button"><i class="fa-solid fa-unlock"></i> <span data-i18n="Force unlock">Force unlock</span></button>
            </div>
            <div class="rb-actions">
                <div class="btn-group">
                    <button class="btn btn-ghost" id="openConfig" title="Settings" data-i18n-title="Settings" aria-label="Settings" data-i18n-aria="Settings"><i class="fa-solid fa-sliders"></i></button>
                    <button class="btn btn-primary" id="exportBtn" title="Export" data-i18n-title="Export" aria-label="Export" data-i18n-aria="Export"><i class="fa-solid fa-file-export"></i></button>
                    <button class="btn btn-primary" id="rawJsonBtn" title="Raw JSON" data-i18n-title="Raw JSON" aria-label="Raw JSON" data-i18n-aria="Raw JSON"><i class="fa-solid fa-code"></i></button>
                    <button class="btn btn-primary" id="saveAccount" title="Save" data-i18n-title="Save" aria-label="Save" data-i18n-aria="Save"><i class="fa-solid fa-floppy-disk"></i></button>
                    <button class="btn btn-ghost" id="saveAsAccount" title="Save as" data-i18n-title="Save as" aria-label="Save as" data-i18n-aria="Save as"><i class="fa-solid fa-clone"></i></button>
                    <button class="btn btn-ghost" id="closeEditor" title="Close" data-i18n-title="Close" aria-label="Close" data-i18n-aria="Close"><i class="fa-solid fa-xmark"></i> <span data-i18n="Close">Close</span></button>
                </div>
                <div class="rb-actions-right">
                    <input type="text" id="rbTitle" class="field grow" placeholder="Roadbook title" data-i18n-ph="Roadbook title">
                    <img id="rbLogoPrev" alt="" class="logo-preview" title="Change logo" data-i18n-title="Change logo" hidden>
                    <button class="btn btn-ghost" id="rbLogoBtn" title="Upload logo" data-i18n-title="Upload logo" aria-label="Upload logo" data-i18n-aria="Upload logo"><i class="fa-solid fa-image"></i></button>
                    <button class="btn btn-ghost" id="rbLogoClr" hidden title="Remove logo" data-i18n-title="Remove logo" aria-label="Remove logo" data-i18n-aria="Remove logo"><i class="fa-solid fa-xmark"></i></button>
                    <input id="rbLogoFile" type="file" accept="image/*" hidden>
                </div>
            </div>
            <!-- ZONE 1: the notes list (its own scroll area) -->
            <div class="note-list-zone">
                <div class="icon-category">Notes <span class="muted small notecount" id="noteCount"></span></div>
                <div id="noteList" class="note-list"></div>
            </div>
            <!-- ZONE 2: the selected note's editor — expands inline under the tapped row -->
            <div id="noteEditZone" class="note-edit-zone" hidden>
                <div class="vig-split">
                    <div class="vig-canvas">
                        <div id="noteToolbar"></div>
                    </div>
                    <div class="vig-icons">
                        <input id="iconFile" type="file" accept="image/*" multiple hidden>
                        <div class="ed-row"><span id="roadSlot"></span><span id="dangerSlot"></span><span id="speedSlot"></span><span id="capTypeSlot"></span><span id="wpTypeSlot"></span><span id="wpRadiusSlot"></span></div>
                        <div class="ed-row"><span class="icon-category flush" data-i18n="Icons">Icons</span><input id="iconSearch" class="field grow" type="search" placeholder="Search icons…" data-i18n-ph="Search icons…" data-i18n-aria="Search icons…" aria-label="Search icons…" autocomplete="off"></div>
                        <div id="iconCats" class="icon-cats"></div>
                        <div id="iconGrid" class="icon-grid"></div>
                        <div class="btnrow end"><button class="btn btn-ghost" id="addIconBtn" data-i18n="Upload icon"><i class="fa-solid fa-plus"></i> Upload icon</button></div>
                    </div>
                </div>
            </div>
            <!-- the tulip editor canvas: JS parks it here and moves it INTO the selected note's row (between distance and text) -->
            <div id="canvasWrap" hidden>
                <div id="noteCanvas"></div>
                <button class="add-junction" id="addJunction" aria-label="Add junction" data-i18n-aria="Add junction" title="Add junction" data-i18n-title="Add junction"><i class="fa-solid fa-code-fork"></i></button>
            </div>
        </div><!-- /#rbPanel -->
    </section>

    <!-- VIEW B: whole-roadbook configuration (details, logo, photos, player map access) -->
    <section id="viewConfig" hidden>
        <div class="ed-row between">
            <button class="btn btn-ghost" id="backToMap" data-i18n="Back"><i class="fa-solid fa-arrow-left"></i> Back</button>
            <div class="icon-category flush" data-i18n="Roadbook configuration">Roadbook configuration</div>
            <button class="btn btn-primary" id="cfgSave"><i class="fa-solid fa-floppy-disk"></i> <span data-i18n="Save">Save</span></button>
        </div>
        <div class="meta-card">
            <div class="meta-group">
                <div class="meta-grouphead" data-i18n="Identity">Identity</div>
                <div class="meta-grid">
                    <label class="meta-field"><span><span data-i18n="Author">Author</span><button class="help-tip" data-i18n-tip="help.author" data-i18n-aria="help.author" aria-label="Help"><i class="fa-solid fa-circle-info"></i></button></span><input type="text" id="rbAuthor" class="field" placeholder="Author name" data-i18n-ph="Author name" maxlength="120"></label>
                    <label class="meta-field"><span><span data-i18n="Organization">Organization</span><button class="help-tip" data-i18n-tip="help.org" data-i18n-aria="help.org" aria-label="Help"><i class="fa-solid fa-circle-info"></i></button></span><input type="text" id="rbOrg" class="field" placeholder="Organization" data-i18n-ph="Organization" maxlength="120"></label>
                    <label class="meta-field full inline"><span><span data-i18n="Description">Description</span><button class="help-tip" data-i18n-tip="help.description" data-i18n-aria="help.description" aria-label="Help"><i class="fa-solid fa-circle-info"></i></button></span><textarea id="rbDesc" class="field" rows="2" placeholder="Shown on the public challenge page" data-i18n-ph="Shown on the public challenge page" maxlength="600"></textarea></label>
                </div>
            </div>
            <div class="meta-group">
                <div class="meta-grouphead" data-i18n="Waypoints & scoring">Waypoints &amp; scoring</div>
                <div class="meta-grid">
                    <label class="meta-field"><span><span data-i18n="Roadbook type">Roadbook type</span><button class="help-tip" data-i18n-tip="help.profile" data-i18n-aria="help.profile" aria-label="Help"><i class="fa-solid fa-circle-info"></i></button></span><select id="cfgProfile" class="field"><option value="basic" data-i18n="Basic (adventure)">Basic (adventure)</option><option value="rally" data-i18n="Rally (FIA)">Rally (FIA)</option></select></label>
                    <label class="meta-field"><span><span data-i18n="Default WP radius (m)">Default WP radius (m)</span><button class="help-tip" data-i18n-tip="help.defRadius" data-i18n-aria="help.defRadius" aria-label="Help"><i class="fa-solid fa-circle-info"></i></button></span><input type="number" id="cfgWpRadius" class="field" min="1" step="1" placeholder="—" data-i18n-ph="Per-type default"></label>
                </div>
            </div>
            <div class="meta-group">
                <div class="meta-grouphead" data-i18n="Visibility & map">Visibility &amp; map</div>
                <div class="meta-grid">
                    <div class="meta-field full" id="visField"><span><span data-i18n="Visibility">Visibility</span><button class="help-tip" data-i18n-tip="help.visibility" data-i18n-aria="help.visibility" aria-label="Help"><i class="fa-solid fa-circle-info"></i></button></span>
                        <div class="segmented" role="group" aria-label="Visibility">
                            <button class="segment on" id="visDraft" data-i18n="Draft" aria-pressed="true"><i class="fa-solid fa-pencil"></i> Draft</button>
                            <button class="segment" id="visReady" data-i18n="Ready" aria-pressed="false"><i class="fa-solid fa-circle-check"></i> Ready</button>
                            <button class="segment" id="visPublic" data-i18n="Public" aria-pressed="false"><i class="fa-solid fa-globe"></i> Public</button>
                        </div>
                    </div>
                    <!-- co-editing an event roadbook (#123): visibility stays with the owner -->
                    <div class="meta-field full" id="visCoedit" hidden><span class="muted small" id="visCoeditNote"></span></div>
                    <div class="meta-field full">
                        <label class="checkbox-row"><input type="checkbox" id="cfgMapAccess" checked> <span data-i18n="Allow the map in the Reader">Allow the map in the Reader</span><button class="help-tip" data-i18n-tip="help.mapAccess" data-i18n-aria="help.mapAccess" aria-label="Help"><i class="fa-solid fa-circle-info"></i></button></label>
                    </div>
                </div>
            </div>
            <div class="meta-group">
                <div class="meta-grouphead" data-i18n="Route">Route</div>
                <div class="ed-row"><button class="btn btn-ghost" id="cfgReverse" data-i18n="Reverse direction"><i class="fa-solid fa-right-left"></i> Reverse direction</button><button class="help-tip" data-i18n-tip="help.route" data-i18n-aria="help.route" aria-label="Help"><i class="fa-solid fa-circle-info"></i></button></div>
            </div>
            <div class="meta-modified"><span data-i18n="Last modified">Last modified</span>: <span id="rbModified">—</span></div>
        </div>
        <div id="photosSection" hidden>
            <div class="ed-row between"><div class="icon-category flush" data-i18n="Photos">Photos</div><button class="btn btn-ghost" id="addPhotoBtn" data-i18n="Add photos"><i class="fa-solid fa-camera"></i> Add photos</button></div>
            <input id="photoFile" type="file" accept="image/*" multiple hidden>
            <div id="photoGrid" class="icon-grid"></div>
        </div>
        <div id="deleteSection" class="ed-row" hidden>
            <button class="btn btn-danger" id="deleteRb"><i class="fa-solid fa-trash-can"></i> <span data-i18n="Delete roadbook">Delete roadbook</span></button>
        </div>
    </section>
</main>
