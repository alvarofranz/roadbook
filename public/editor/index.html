    <style>
        .ed-row { display: flex; gap: .5rem; align-items: center; margin: .25rem 0; flex-wrap: wrap; }

        .note-list-zone .note-list, #noteList { scrollbar-gutter: stable; scrollbar-width: thin; scrollbar-color: var(--muted) transparent; }

        /* the icon search sits on its own row above the icons; it grows to fill the width */

        #roadSlot, #dangerSlot, #speedSlot, #capTypeSlot, #wpTypeSlot, #wpRadiusSlot { flex-shrink: 0; }

        .wp-dd-wrap { position: relative; }

                .wp-dd-chev { margin-left: auto; padding-left: .3rem; color: var(--muted); }
        .wp-dd-none { color: var(--muted); }

        .wp-dd-opt { display: flex; align-items: center; gap: .5rem; width: 100%; background: none; border: 0; color: var(--text); font: inherit; text-align: left; padding: .35rem .5rem; border-radius: 7px; cursor: pointer; }

        /* The note's own parameters, under the palette: label over control, in even columns so

        .note-params { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .5rem .6rem; margin: .5rem 0 .25rem; }

        .prop-field > span:first-child { display: flex; align-items: center; gap: .25rem; font-size: .66rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }

        /* The palette is a STRIP: two rows of equal tiles that scroll sideways, so the gallery

        .icon-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(2, 58px); grid-auto-columns: 58px; gap: .45rem; align-items: stretch; overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; padding: 2px 0 .45rem; scrollbar-width: thin; scrollbar-color: var(--muted) transparent; }

        .icon-cat-chip { background: var(--card-2); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: .25rem .65rem; font-size: .72rem; font-weight: 700; cursor: pointer; }
        .icon-cat-chip.on { background: var(--sand); color: var(--on-sand); border-color: var(--sand); }
        .note-mini { display: flex; gap: .5rem; align-items: center; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--rt, #ff5a45); border-radius: 10px; padding: .35rem .5rem .35rem .7rem; cursor: pointer; }

        .note-mini .note-title { flex: 1; width: 100%; min-width: 0; min-height: 2.2rem; margin: 0; padding: .3rem .5rem; resize: none; }

        .note-mini .note-km b { display: block; font-size: .82rem; font-weight: 800; color: var(--text); }
        /* a photo was taken near this note → tap the "IMG" pill (under the km) to view it */
        .note-mini .note-km .note-photo { display: inline-block; margin-top: .25rem; padding: .05rem .35rem; background: none; border: 1px solid #3a8dff; border-radius: 6px; color: #3a8dff; font: inherit; font-size: .62rem; font-weight: 800; letter-spacing: .04em; line-height: 1.4; cursor: pointer; }
        /* the material attached to a note, shown above or below its row: a photo to look at, an

        .note-block { display: flex; align-items: center; gap: .6rem; background: var(--card-2); border: 1px dashed var(--sand); border-radius: 10px; padding: .4rem .6rem; margin: .25rem 0; cursor: pointer; }

        /* the editor tabs: the note itself, or the material around it */
        .kind-tabs { display: flex; flex-wrap: wrap; gap: .35rem; margin: 0 0 .5rem; }

        .kind-tab.on .tab-count { background: rgba(0, 0, 0, .18); }
        .note-list-zone > .icon-category { display: flex; align-items: center; gap: .4rem; }

        .block-card .block-prev:hover { border-color: var(--sand); }

        .block-empty { color: var(--muted); font-size: .82rem; }
        /* the editor expands inline, right under the tapped row (like the Reader's per-note map) */
        .note-edit-slot:empty { display: none; }
        .note-edit-slot { margin: .1rem 0 .5rem; }
        .del-badge { position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; line-height: 16px; text-align: center; background: var(--track); color: #fff; border: 0; padding: 0; border-radius: 50%; font: inherit; font-size: .72rem; font-weight: 800; cursor: pointer; }
        .photo-thumb { position: relative; }
        .photo-thumb img { width: 100%; height: 84px; object-fit: cover; border-radius: 8px; cursor: pointer; } /* sized for the photo grid, not the icon grid */
        /* voice-note rows: nearest-note label · audio player · delete */

        #edMap { height: 60vh; min-height: 360px; }

        /* photo viewer: overlays ONLY the map box (so the notes panel stays editable) */

        #lightbox img { max-width: 94%; max-height: 88%; object-fit: contain; border-radius: 8px; }
        .lb-close, .lb-nav { position: absolute; border: 0; background: rgba(255, 255, 255, .12); color: #fff; cursor: pointer; border-radius: 50%; }

        /* the GPX editor: map + vertical tool bar (overlaid left, like the Mapbox controls) */
        .map-editor { position: relative; }

        .map-tools { position: absolute; top: 10px; left: 10px; z-index: 6; display: flex; flex-direction: column; gap: 2px; background: rgba(14, 17, 22, .88); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }

        #viewMap, #viewConfig { max-width: 720px; margin: 0 auto; }

        .note-edit-zone .vignette-toolbar { max-width: none; }
        /* canvas above, icon palette below — keeps both usable in the narrow column */
        .vig-split { display: flex; flex-direction: column; gap: .2rem; }
        .load-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .6rem; }
        .load-card { display: flex; flex-direction: column; align-items: flex-start; gap: .15rem; background: var(--card-2); border: 1px solid var(--line); border-radius: 14px; padding: .9rem 1rem; cursor: pointer; color: var(--text); text-align: left; transition: border-color .15s, transform .1s; }
        .load-card:hover { border-color: var(--sand); transform: translateY(-1px); }
        .load-card i { font-size: 1.3rem; color: var(--sand); margin-bottom: .15rem; }
        .load-card b { font-size: 1rem; }
        .load-card small { color: var(--muted); font-size: .76rem; }
        .record-bar { display: flex; flex-direction: column; gap: .55rem; background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: .65rem .9rem; margin-bottom: .8rem; }
        .rec-status { display: flex; align-items: center; gap: .5rem; }
        .rec-btns { display: flex; gap: .45rem; }
        .rec-btns .btn { flex: 1; justify-content: center; padding: .6rem .4rem; }
        .rec-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--track); animation: recpulse 1.2s infinite; flex-shrink: 0; }
        .rb-actions { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; justify-content: space-between; margin-top: .9rem; }
        .rb-actions .btn-group { flex-wrap: wrap; } /* phones: action buttons wrap instead of overflowing off-screen */
        .rb-actions-right { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; flex: 1 1 260px; }
        /* labelled field cards (roadbook details + note properties) */
        .meta-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 1rem; margin-top: 1rem; }
        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem 1rem; }
        .meta-field { display: flex; flex-direction: column; gap: .35rem; min-width: 0; }
        .meta-field > span:first-child { font-size: .66rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
        .meta-field.full { grid-column: 1 / -1; }
        /* a field laid out as label + control on one line (e.g. Description) */
        .meta-field.inline { flex-direction: row; align-items: center; gap: .7rem; }
        .meta-field.inline > span:first-child { flex: 0 0 auto; }
        .meta-field.inline > .field { flex: 1; min-width: 0; }
        /* settings split into labelled groups (Identity · Waypoints & scoring · Visibility & map · Route) */
        .meta-group { margin-top: 1.2rem; }
        .meta-group:first-child { margin-top: 0; }
        .meta-grouphead { display: flex; align-items: center; gap: .6rem; margin-bottom: .75rem; font-size: .64rem; text-transform: uppercase; letter-spacing: .1em; color: var(--sand); font-weight: 800; }
        .meta-grouphead::after { content: ""; flex: 1; height: 1px; background: var(--line); }
        .meta-modified { margin-top: 1.2rem; padding-top: .7rem; border-top: 1px solid var(--line); font-size: .72rem; color: var(--muted); }
        /* a group heading with an action on its right (Photos + Add photos) */
        .meta-grouphead > .btn { margin-left: auto; flex: 0 0 auto; }
        .meta-grouphead:has(> .btn)::after { display: none; }
        /* photos: a grid sized for photographs, not for the 58 px icon buttons */
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: .5rem; }
        .photo-grid .photo-empty { grid-column: 1 / -1; color: var(--muted); font-size: .85rem; margin: 0; }
        .danger-card { border-color: rgba(255, 90, 69, .35); }
        .danger-card .meta-grouphead { color: var(--track); }
        .danger-card p { margin: 0 0 .8rem; }
        .config-bottom { display: grid; gap: 1rem; align-items: start; }
        .meta-modified #rbModified { color: var(--text); }
        /* desktop: wider editor, the start cards on one line */
        @media (min-width: 900px) {
            #viewMap, #viewConfig { max-width: 1100px; }
            /* the screen is there: photos take the space, the destructive action sits beside them
               instead of under everything (#438) */
            .config-bottom { grid-template-columns: 2fr 1fr; }
            .load-opts { grid-template-columns: repeat(4, 1fr); }
        }
        /* tablet portrait and up: RB-suite split — the map pinned on the
           left, the notes + inline editor column on the right.
           The topbar is hidden ≤1024px so sticky offset is 0 there. */
        @media (min-width: 769px) {
            main.tool-page { max-width: 1680px; } /* the split layout earns the full width */
            /* the split grid is for editing only — on the landing screen #viewMap stays the
               centred 1100px column (otherwise the start cards hug the left of a 1680px row) */
            #viewMap:has(#mapEditor:not([hidden])) { max-width: none; display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 1.2rem; align-items: start; margin: 0 -1.1rem; }
            .map-box { border-radius: 0; }
            #landing, #recBar { grid-column: 1 / -1; }
            .map-editor { position: sticky; top: 66px; }
            @media (max-width: 1024px) { .map-editor { top: 0; } }
            #edMap { height: calc(100vh - 112px); }
            @media (max-width: 1024px) { #edMap { height: calc(100vh - 56px); } }
            /* the notes column is its own pane: commands + "Notes" heading stay fixed, the list
               scrolls inside its own area (like an iframe) and ends at the pane's bottom edge */
            #rbPanel { position: sticky; top: 66px; height: calc(100vh - 112px); display: flex; flex-direction: column; }
            @media (max-width: 1024px) { #rbPanel { top: 0; height: calc(100vh - 56px); } }
            .rb-actions { margin-top: 0; flex-shrink: 0; }
            .note-list-zone { margin-top: .2rem; flex: 1; min-height: 0; display: flex; flex-direction: column; }
            .note-list-zone .icon-category { margin-top: .2rem; flex-shrink: 0; }
            #noteList { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
        }
        /* phones (stacked): the map is a normal in-flow block at the top, the
           palette + notes flow beneath it. NOT sticky — a pinned interactive map both overlapped
           the content scrolling under it and hijacked the page scroll (it needs one-finger pan). */
        @media (max-width: 768px) {
            .map-editor { position: relative; }
            #edMap { height: 46vh; min-height: 240px; }
        }
        @media (max-width: 600px) {
            #edMap { height: 46vh; }
            .icon-grid { grid-template-rows: repeat(2, 50px); grid-auto-columns: 50px; }
            .map-tools { max-height: calc(100% - 20px); overflow-y: auto; } /* touch: no hover tooltips, scrolling wins */
            .meta-grid { grid-template-columns: 1fr; }
            /* phones: the text takes the row; the tulip drops to its own line below it */
            .note-mini { flex-wrap: wrap; }
            .note-mini .note-tulip { order: 9; flex-basis: 100%; width: auto; }
            .note-mini .note-tulip > svg { max-width: 160px; }
        }
    </style>
</head>
<body>
<header class="topbar"></header>
<input id="gpxFile" type="file" accept=".gpx,.wpt" multiple hidden>
<input id="jsonFile" type="file" accept=".rdbk,.json,application/x-roadbook" hidden>

<main class="wrap tool-page">
    <!-- VIEW A: map + notes -->
    <section id="viewMap">
        <!-- opening screen: ways to start a new roadbook (existing ones are re-opened from the profile) -->
        <div id="landing">
            <div class="tool-titlebar">
                <h1 data-i18n="fp.tool.editor">Roadbook Editor</h1>
                <a class="tool-help" href="../features/editor/"><i class="fa-solid fa-circle-info"></i> <span data-i18n="Help">Help</span></a>
            </div>
            <div id="loadFrom">
                <div class="icon-category" data-i18n="Start new Roadbook from:">Start new Roadbook from:</div>
                <div class="load-opts">
                    <button class="load-card" id="loadGpx"><i class="fa-solid fa-route"></i><b>GPX</b><small data-i18n="Import a GPS track">Import a GPS track</small></button>
                    <button class="load-card" id="drawRoute"><i class="fa-solid fa-pencil"></i><b data-i18n="Draw on the map">Draw on the map</b><small data-i18n="Sketch a route tapping the map">Sketch a route tapping the map</small></button>
                    <button class="load-card" id="loadJson"><i class="fa-solid fa-file-code"></i><b>.rdbk</b><small data-i18n="Open an existing roadbook">Open an existing roadbook</small></button>
                    <button class="load-card" id="pickChallenge"><i class="fa-solid fa-book-open"></i><b data-i18n="Start from a public RB">Start from a public RB</b><small data-i18n="Public roadbooks">Public roadbooks</small></button>
                </div>
            </div>
            <div id="myRbSection" hidden>
                <div class="icon-category" data-i18n="Your roadbooks">Your roadbooks</div>
                <div id="myRbList"></div>
            </div>
            <!-- roadbooks you can edit through your events (#123): someone else's, with the event named -->
            <div id="coeditSection" hidden>
                <div class="icon-category" data-i18n="From your events">From your events</div>
                <div id="coeditList" class="rb-grid"></div>
            </div>
        </div>
        <div id="recBar" class="record-bar" hidden>
            <div class="rec-status"><span class="rec-dot"></span> <span id="recStats" class="muted small">Recording…</span></div>
            <div class="rec-btns">
                <button class="btn btn-ghost" id="recPause"><i class="fa-solid fa-pause"></i> <span data-i18n="Pause">Pause</span></button>
                <button class="btn btn-ghost" id="recPhoto" hidden><i class="fa-solid fa-camera"></i> <span data-i18n="Photo">Photo</span></button>
                <button class="btn btn-ghost" id="recWaypoint"><i class="fa-solid fa-location-dot"></i> <span data-i18n="Note">Note</span></button>
                <button class="btn btn-primary" id="recStop"><i class="fa-solid fa-flag-checkered"></i> <span data-i18n="Finish">Finish</span></button>
            </div>
            <div id="recPending" class="rec-pending" hidden></div>
        </div>
        <input id="recPhotoFile" type="file" accept="image/*" capture="environment" hidden>
        <input id="addGpxFile" type="file" accept=".gpx" hidden>
        <input id="ctxPhotoFile" type="file" accept="image/*" multiple hidden>
        <!-- the GPX editor: the map + its vertical tool bar (modes left, actions below) -->
        <div id="mapEditor" class="map-editor" hidden>
            <div class="map-tools" role="toolbar" aria-label="GPX editing tools" data-i18n-aria="GPX editing tools">
                <button class="map-tool" id="mapMenuToggle" aria-label="More tools"><i class="fa-solid fa-bars"></i></button>
                <span class="map-tools-sep"></span>
                <button class="map-tool" id="undoBtn" disabled aria-label="Undo"><i class="fa-solid fa-arrow-rotate-left"></i></button>
                <button class="map-tool" id="redoBtn" disabled aria-label="Redo"><i class="fa-solid fa-arrow-rotate-right"></i></button>
            </div>
            <!-- ☰ submenu (sibling of the toolbar so its overflow never clips it): every tool lives here.
                 Move is the default map mode (no button); only the menu toggle + undo/redo stay on the bar (#61). -->
            <div class="map-tools-menu" id="mapMenuPanel" hidden>
                <button class="map-tool-row" id="toolMove" data-tool="points"><i class="fa-solid fa-arrows-up-down-left-right"></i><span data-i18n="Move">Move</span><span class="map-ctx-key">M</span></button>
                <button class="map-tool-row" id="toolNote" data-tool="note" disabled><i class="fa-solid fa-map-pin"></i><span data-i18n="Add note">Add note</span><span class="map-ctx-key">A</span></button>
                <button class="map-tool-row" id="toolDraw" data-tool="draw" disabled><i class="fa-solid fa-pen"></i><span data-i18n="Draw route">Draw route</span><span class="map-ctx-key">D</span></button>
                <button class="map-tool-row" id="toolCut" data-tool="cut" disabled><i class="fa-solid fa-scissors"></i><span data-i18n="Cut">Cut</span><span class="map-ctx-key">C</span></button>
                <span class="map-tools-sep"></span>
                <button class="map-tool-row" id="toolAddGpx"><i class="fa-solid fa-file-circle-plus"></i><span data-i18n="Add a GPX track">Add a GPX track</span></button>
                <button class="map-tool-row" id="toolSimplify"><i class="fa-solid fa-broom"></i><span data-i18n="Simplify">Simplify</span></button>
                <button class="map-tool-row" id="toolAdjust"><i class="fa-solid fa-location-crosshairs"></i><span data-i18n="Adjust on the trail">Adjust on the trail</span></button>
                <span class="map-tools-sep"></span>
                <button class="map-tool-row" id="toolShortcuts"><i class="fa-solid fa-keyboard"></i><span data-i18n="Shortcuts">Shortcuts</span></button>
            </div>
            <div id="edMap" class="panel map-box"></div>
            <!-- #456: which mode you just switched into, bottom-left over the map, gone after 3 s -->
            <div id="mapModeLabel" class="map-mode-label" hidden></div>
            <!-- photo viewer: overlays ONLY the map, so the notes panel stays editable -->
            <div id="lightbox" hidden>
                <button type="button" id="lbClose" class="lb-close" aria-label="Close" data-i18n-aria="Close">✕</button>
                <button type="button" id="lbPrev" class="lb-nav lb-prev" aria-label="Previous" data-i18n-aria="Previous">‹</button>
                <img id="lbImg" alt="">
                <button type="button" id="lbNext" class="lb-nav lb-next" aria-label="Next" data-i18n-aria="Next">›</button>
                <div class="lb-actions">
                    <button type="button" id="lbMove" class="btn btn-ghost"><i class="fa-solid fa-up-down-left-right"></i> <span data-i18n="Move on map">Move on map</span></button>
                    <button type="button" id="lbWaypoint" class="btn btn-primary"><i class="fa-solid fa-map-pin"></i> <span data-i18n="Note">Note</span></button>
                    <button type="button" id="lbDelete" class="btn btn-danger"><i class="fa-solid fa-trash-can"></i> <span data-i18n="Delete">Delete</span></button>
                </div>
            </div>
        </div>
        <div id="rbPanel" hidden>
            <!-- soft edit lock (#154): someone else is editing → read-only + force unlock -->
            <div id="lockBanner" class="lock-banner" hidden>
                <i class="fa-solid fa-lock"></i> <span id="lockBannerText"></span>
                <button class="btn btn-ghost" id="lockForce" type="button"><i class="fa-solid fa-unlock"></i> <span data-i18n="Force unlock">Force unlock</span></button>
            </div>
            <div class="rb-actions">
                <div class="btn-group">
                    <button class="btn btn-ghost" id="openConfig" title="Settings" data-i18n-title="Settings" aria-label="Settings" data-i18n-aria="Settings"><i class="fa-solid fa-sliders"></i></button>
                    <button class="btn btn-primary" id="exportBtn" title="Export" data-i18n-title="Export" aria-label="Export" data-i18n-aria="Export"><i class="fa-solid fa-file-export"></i></button>
                    <button class="btn btn-primary" id="rawJsonBtn" title="Raw JSON" data-i18n-title="Raw JSON" aria-label="Raw JSON" data-i18n-aria="Raw JSON"><i class="fa-solid fa-code"></i></button>
                    <button class="btn btn-primary" id="saveAccount" title="Save" data-i18n-title="Save" aria-label="Save" data-i18n-aria="Save"><i class="fa-solid fa-floppy-disk"></i></button>
                    <button class="btn btn-ghost" id="saveAsAccount" title="Save as" data-i18n-title="Save as" aria-label="Save as" data-i18n-aria="Save as"><i class="fa-solid fa-file-circle-plus"></i></button>
                    <button class="btn btn-ghost" id="closeEditor" title="Close" data-i18n-title="Close" aria-label="Close" data-i18n-aria="Close"><i class="fa-solid fa-xmark"></i> <span data-i18n="Close">Close</span></button>
                </div>
                <div class="rb-actions-right">
                    <input type="text" id="rbTitle" class="field grow" placeholder="Roadbook title" data-i18n-ph="Roadbook title">
                    <img id="rbLogoPrev" alt="" class="logo-preview" title="Change logo" data-i18n-title="Change logo" hidden>
                    <button class="btn btn-ghost" id="rbLogoBtn" title="Upload logo" data-i18n-title="Upload logo" aria-label="Upload logo" data-i18n-aria="Upload logo"><i class="fa-solid fa-image"></i></button>
                    <button class="btn btn-ghost" id="rbLogoClr" hidden title="Remove logo" data-i18n-title="Remove logo" aria-label="Remove logo" data-i18n-aria="Remove logo"><i class="fa-solid fa-xmark"></i></button>
                    <input id="rbLogoFile" type="file" accept="image/*" hidden>
                </div>
            </div>
            <!-- ZONE 1: the notes list (its own scroll area) -->
            <div class="note-list-zone">
                <div class="icon-category"><span data-i18n="Notes">Notes</span> <span class="muted small notecount" id="noteCount"></span></div>
                <div id="noteList" class="note-list"></div>
            </div>
            <!-- ZONE 2: the selected note's editor — expands inline under the tapped row -->
            <div id="noteEditZone" class="note-edit-zone" hidden>
                <!-- one tab per pane: the note's settings, its icons, and the material around it -->
                <div class="kind-tabs" id="kindTabs" role="tablist"></div>
                <!-- PANE: what the note IS — road, danger, speed, CAP, waypoint type, radius -->
                <div class="tab-pane" id="notePane">
                    <div class="note-params"><span id="roadSlot"></span><span id="dangerSlot"></span><span id="speedSlot"></span><span id="capSlot"></span><span id="capTypeSlot"></span><span id="wpTypeSlot"></span><span id="wpRadiusSlot"></span></div>
                </div>
                <!-- PANE: the icons on its tulip — the selected element's tools, the search, the palette -->
                <div class="tab-pane" id="iconPane" hidden>
                    <!-- What NoteCanvas draws for the selected icon/junction: it names itself
                         (Icon tools / Junction tools) and takes no space with nothing selected. -->
                    <div id="noteToolbar" class="icon-tools"></div>
                    <input id="iconFile" type="file" accept="image/*" multiple hidden>
                    <!-- one slim row for every way to bring an icon in: search the palette, paste, upload -->
                    <div class="icon-bar">
                        <input id="iconSearch" class="field grow" type="search" placeholder="Search icons…" data-i18n-ph="Search icons…" data-i18n-aria="Search icons…" aria-label="Search icons…" autocomplete="off">
                        <button class="btn btn-ghost" id="pasteIconBtn" data-i18n-title="Paste icon" title="Paste icon" data-i18n-aria="Paste icon" aria-label="Paste icon"><i class="fa-solid fa-paste"></i></button>
                        <button class="btn btn-ghost" id="addIconBtn" data-i18n-title="Upload icon" title="Upload icon" data-i18n-aria="Upload icon" aria-label="Upload icon"><i class="fa-solid fa-plus"></i></button>
                    </div>
                    <div id="iconCats" class="icon-cats"></div>
                    <div id="iconGrid" class="icon-grid"></div>
                </div>
                <!-- PANE: the material around the note — the picker's input lives OUTSIDE it, because
                     the pane rewrites its own innerHTML and would destroy the input it opens -->
                <input id="edBlockImg" type="file" accept="image/*" hidden>
                <div class="tab-pane" id="blockPanel" hidden></div>
            </div>
            <!-- the tulip editor canvas: JS parks it here and moves it INTO the selected note's row (between distance and text) -->
            <div id="canvasWrap" hidden>
                <div id="noteCanvas"></div>
                <button class="add-junction" id="addJunction" aria-label="Add junction" data-i18n-aria="Add junction" title="Add junction" data-i18n-title="Add junction"><i class="fa-solid fa-code-fork"></i></button>
            </div>
        </div><!-- /#rbPanel -->
    </section>

    <!-- VIEW B: whole-roadbook configuration (details, logo, photos, player map access) -->
    <section id="viewConfig" hidden>
        <div class="ed-row between">
            <button class="btn btn-ghost" id="backToMap" data-i18n="Back"><i class="fa-solid fa-arrow-left"></i> Back</button>
            <div class="icon-category flush" data-i18n="Roadbook configuration">Roadbook configuration</div>
            <button class="btn btn-primary" id="cfgSave"><i class="fa-solid fa-floppy-disk"></i> <span data-i18n="Save">Save</span></button>
        </div>
        <div class="meta-card">
            <div class="meta-group">
                <div class="meta-grouphead" data-i18n="Identity">Identity</div>
                <div class="meta-grid">
                    <label class="meta-field"><span><span data-i18n="Author">Author</span><button class="help-tip" data-i18n-tip="help.author" data-i18n-aria="help.author" aria-label="Help"><i class="fa-solid fa-circle-info"></i></button></span><input type="text" id="rbAuthor" class="field" placeholder="Author name" data-i18n-ph="Author name" maxlength="120"></label>
                    <label class="meta-field"><span><span data-i18n="Organization">Organization</span><button class="help-tip" data-i18n-tip="help.org" data-i18n-aria="help.org" aria-label="Help"><i class="fa-solid fa-circle-info"></i></button></span><input type="text" id="rbOrg" class="field" placeholder="Organization" data-i18n-ph="Organization" maxlength="120"></label>
                    <label class="meta-field full inline"><span><span data-i18n="Description">Description</span><button class="help-tip" data-i18n-tip="help.description" data-i18n-aria="help.description" aria-label="Help"><i class="fa-solid fa-circle-info"></i></button></span><textarea id="rbDesc" class="field" rows="2" placeholder="Shown on the public roadbook page" data-i18n-ph="Shown on the public roadbook page" maxlength="600"></textarea></label>
                </div>
            </div>
            <div class="meta-group">
                <div class="meta-grouphead" data-i18n="Notes & scoring">Notes &amp; scoring</div>
                <div class="meta-grid">
                    <label class="meta-field"><span><span data-i18n="Roadbook type">Roadbook type</span><button class="help-tip" data-i18n-tip="help.profile" data-i18n-aria="help.profile" aria-label="Help"><i class="fa-solid fa-circle-info"></i></button></span><select id="cfgProfile" class="field"><option value="basic" data-i18n="Basic (adventure)">Basic (adventure)</option><option value="rally" data-i18n="Rally (FIA)">Rally (FIA)</option></select></label>
                    <label class="meta-field"><span><span data-i18n="Default detection radius (m)">Default detection radius (m)</span><button class="help-tip" data-i18n-tip="help.defRadius" data-i18n-aria="help.defRadius" aria-label="Help"><i class="fa-solid fa-circle-info"></i></button></span><input type="number" id="cfgWpRadius" class="field" min="1" step="1" placeholder="50"></label>
                </div>
            </div>
            <div class="meta-group">
                <div class="meta-grouphead" data-i18n="Visibility & map">Visibility &amp; map</div>
                <div class="meta-grid">
                    <div class="meta-field full" id="visField"><span><span data-i18n="Visibility">Visibility</span><button class="help-tip" data-i18n-tip="help.visibility" data-i18n-aria="help.visibility" aria-label="Help"><i class="fa-solid fa-circle-info"></i></button></span>
                        <div class="segmented" role="group" aria-label="Visibility" data-i18n-aria="Visibility">
                            <button class="segment on" id="visDraft" data-i18n="Draft" aria-pressed="true"><i class="fa-solid fa-pencil"></i> Draft</button>
                            <button class="segment" id="visReady" data-i18n="Ready" aria-pressed="false"><i class="fa-solid fa-circle-check"></i> Ready</button>
                            <button class="segment" id="visPublic" data-i18n="Public" aria-pressed="false"><i class="fa-solid fa-globe"></i> Public</button>
                        </div>
                    </div>
                    <!-- co-editing an event roadbook (#123): visibility stays with the owner -->
                    <div class="meta-field full" id="visCoedit" hidden><span class="muted small" id="visCoeditNote"></span></div>
                    <div class="meta-field full">
                        <label class="checkbox-row"><input type="checkbox" id="cfgMapAccess" checked> <span data-i18n="Allow the map in the Reader">Allow the map in the Reader</span><button class="help-tip" data-i18n-tip="help.mapAccess" data-i18n-aria="help.mapAccess" aria-label="Help"><i class="fa-solid fa-circle-info"></i></button></label>
                        <label class="checkbox-row"><input type="checkbox" id="cfgReusable"> <span data-i18n="Let others copy this public roadbook">Let others copy this public roadbook</span><button class="help-tip" data-i18n-tip="help.reusable" data-i18n-aria="help.reusable" aria-label="Help"><i class="fa-solid fa-circle-info"></i></button></label>
                    </div>
                </div>
            </div>
            <div class="meta-group">
