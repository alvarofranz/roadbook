<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e1116">
    <title>Editor · RDBK.app</title>
    <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css">
    <link rel="stylesheet" href="../assets/css/app.css">
    <style>
        .ed-row { display: flex; gap: .5rem; align-items: center; margin: .5rem 0; flex-wrap: wrap; }
        .ed-row.between { justify-content: space-between; }
        #loadFrom .icon-category { margin-top: 0; }
        .icon-category.flush { margin: 0; }
        .notecount { text-transform: none; letter-spacing: 0; }
        .note-list { display: flex; flex-direction: column; gap: .4rem; }
        .rec-btns .btn-danger { flex: 0 0 auto; }
        .map-box { padding: 0; overflow: hidden; border-radius: 14px; }
        #noteMap { height: 46vh; min-height: 300px; margin-top: .5rem; }
        #canvasWrap { position: relative; max-width: 560px; margin: .4rem auto 0; }
        .logo-preview { width: 46px; height: 46px; object-fit: contain; border-radius: 8px; background: var(--card-2); }
        .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: .5rem; max-height: 50vh; overflow: auto; }
        .icon-grid button { position: relative; background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px; cursor: pointer; }
        .icon-grid img { width: 100%; height: 44px; object-fit: contain; }
        .icon-grid .icon-category { grid-column: 1 / -1; }
        .note-mini { display: flex; gap: .5rem; align-items: center; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--rt, #ff5a45); border-radius: 10px; padding: .5rem .7rem; cursor: pointer; }
        .note-mini.sel { border-color: var(--sand); box-shadow: 0 0 0 2px var(--sand) inset; }
        .note-mini .note-number { font-weight: 800; color: var(--sand); }
        .note-mini .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .del-badge { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; line-height: 18px; text-align: center; background: var(--track); color: #fff; border-radius: 50%; font-weight: 800; cursor: pointer; }
        .photo-preview { width: 100%; max-height: 48vh; object-fit: cover; border-radius: 12px; }
        .photo-thumb { position: relative; }
        .photo-thumb img { width: 100%; height: 64px; object-fit: cover; border-radius: 8px; }
        #edMap { height: 60vh; min-height: 360px; }
        /* the GPX editor: map + vertical tool bar (overlaid left, like the Mapbox controls) */
        .map-editor { position: relative; }
        .map-editor.max { position: fixed; inset: 0; z-index: 80; background: var(--bg); }
        .map-editor.max #edMap { height: 100%; min-height: 0; border-radius: 0; }
        /* no overflow clipping here — the hover tooltips render outside the bar */
        .map-tools { position: absolute; top: 10px; left: 10px; z-index: 6; display: flex; flex-direction: column; gap: 2px; background: rgba(14, 17, 22, .88); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
        .map-tool { position: relative; width: 35px; height: 35px; flex-shrink: 0; border: 0; border-radius: 9px; background: transparent; color: var(--text); cursor: pointer; font-size: .9rem; }
        .map-tool:hover { background: var(--card-2); }
        .map-tool.on { background: var(--sand); color: #14100a; }
        .map-tool:disabled { opacity: .35; cursor: default; }
        .map-tools-sep { height: 1px; flex-shrink: 0; background: var(--line); margin: 2px 4px; }
        .map-tool[data-tip]:hover:not(:disabled)::after { content: attr(data-tip); position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%); white-space: nowrap; background: #0a0d12; border: 1px solid var(--line); color: var(--text); font-size: .78rem; font-weight: 600; padding: .3rem .55rem; border-radius: 8px; pointer-events: none; z-index: 7; }
        .vignette-box { position: relative; width: 100%; max-width: 560px; margin: .2rem auto .4rem; aspect-ratio: 230/162; background: #11161f; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; touch-action: none; }
        .vignette-box-junctions { cursor: pointer; }
        .vignette-box-icon { cursor: grab; }
        .vignette-drag-handle { cursor: move; }
        .vignette-resize-handle { cursor: nwse-resize; }
        .add-junction { position: absolute; top: 8px; right: 8px; z-index: 4; width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: rgba(14,17,22,.82); color: var(--text); cursor: pointer; }
        .add-junction:hover { background: rgba(14,17,22,.95); }
        .vignette-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        .vignette-toolbar { display: flex; gap: 5px; align-items: center; justify-content: center; flex-wrap: wrap; max-width: 360px; margin: 0 auto .5rem; padding: 5px 6px; background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; }
        .vignette-toolbar:empty { display: none; }
        .vignette-toolbar button { width: 30px; height: 30px; border: 0; border-radius: 7px; background: var(--card-2); color: var(--text); cursor: pointer; font-size: .85rem; }
        .vignette-toolbar button.on { background: var(--sand); color: #14100a; }
        .vignette-toolbar button.danger { color: var(--track); }
        .vignette-toolbar select { background: var(--card-2); color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: .3rem; }
        #viewMap, #viewNote { max-width: 720px; margin: 0 auto; }
        #loadFrom { margin-bottom: 1rem; }
        .load-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .6rem; }
        .load-card { display: flex; flex-direction: column; align-items: flex-start; gap: .15rem; background: var(--card-2); border: 1px solid var(--line); border-radius: 14px; padding: .9rem 1rem; cursor: pointer; color: var(--text); text-align: left; transition: border-color .15s, transform .1s; }
        .load-card:hover { border-color: var(--sand); transform: translateY(-1px); }
        .load-card i { font-size: 1.3rem; color: var(--sand); margin-bottom: .15rem; }
        .load-card b { font-size: 1rem; }
        .load-card small { color: var(--muted); font-size: .76rem; }
        .record-bar { display: flex; flex-direction: column; gap: .55rem; background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: .65rem .9rem; margin-bottom: .8rem; }
        .rec-status { display: flex; align-items: center; gap: .5rem; }
        .rec-btns { display: flex; gap: .45rem; }
        .rec-btns .btn { flex: 1; justify-content: center; padding: .6rem .4rem; }
        .rec-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--track); animation: recpulse 1.2s infinite; flex-shrink: 0; }
        @keyframes recpulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
        .rb-actions { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; justify-content: space-between; margin-top: .9rem; }
        .rb-actions-right { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
        .note-tabs { display: flex; gap: .4rem; margin: 1rem 0 .3rem; }
        .note-tab { flex: 1; background: var(--card-2); border: 1px solid var(--line); color: var(--muted); border-radius: 10px; padding: .55rem; font: inherit; font-weight: 700; cursor: pointer; }
        .note-tab.on { background: var(--sand); color: #14100a; border-color: var(--sand); }
        .vis-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
        .vis-toggle .vis { background: var(--card-2); color: var(--muted); border: 0; padding: .55rem .8rem; cursor: pointer; font: inherit; font-weight: 600; }
        .vis-toggle .vis.on { background: var(--sand); color: #14100a; }
        .field { background: var(--card-2); border: 1px solid rgba(255,255,255,.12); color: var(--text); border-radius: 10px; padding: .7rem .8rem; font-size: 1rem; }
        .field:focus { outline: 2px solid var(--sand); border-color: transparent; }
        /* labelled field cards (roadbook details + note properties) */
        .meta-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 1rem; margin-top: 1rem; }
        .meta-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .8rem; }
        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem 1rem; }
        .meta-field { display: flex; flex-direction: column; gap: .35rem; min-width: 0; }
        .meta-field > span:first-child { font-size: .66rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
        .meta-field.full { grid-column: 1 / -1; }
        .meta-value { padding: .45rem 0; }
        .logo-row { display: flex; gap: .5rem; align-items: center; }
        /* desktop split view: vignette canvas left · icon palette right */
        @media (min-width: 900px) {
            #viewNote { max-width: 1100px; }
            .vig-split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 4fr); gap: 1.2rem; align-items: start; }
            .vig-icons .icon-grid { max-height: 58vh; }
        }
        @media (max-width: 600px) {
            #edMap { height: 46vh; }
            .icon-grid { grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); max-height: 38vh; }
            .map-tools { max-height: calc(100% - 20px); overflow-y: auto; } /* touch: no hover tooltips, scrolling wins */
            .meta-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<header class="topbar"></header>
<input id="gpxFile" type="file" accept=".gpx,.wpt" multiple hidden>
<input id="jsonFile" type="file" accept=".rdbk,.json,application/x-roadbook" hidden>

<main class="wrap tool-page">
    <!-- VIEW A: map + notes -->
    <section id="viewMap">
        <div id="loadFrom">
            <div class="icon-category" data-i18n="Load from">Load from</div>
            <div class="load-opts">
                <button class="load-card" id="loadGpx"><i class="fa-solid fa-route"></i><b>GPX</b><small data-i18n="Import a GPS track">Import a GPS track</small></button>
                <button class="load-card" id="recordRoute"><i class="fa-solid fa-circle-dot"></i><b data-i18n="Record route">Record route</b><small data-i18n="Record live with GPS">Record live with GPS</small></button>
                <button class="load-card" id="drawRoute"><i class="fa-solid fa-pencil"></i><b data-i18n="Draw on the map">Draw on the map</b><small data-i18n="Sketch a route tapping the map">Sketch a route tapping the map</small></button>
                <button class="load-card" id="loadJson"><i class="fa-solid fa-file-code"></i><b>.rdbk</b><small data-i18n="Open an existing roadbook">Open an existing roadbook</small></button>
                <button class="load-card" id="pickChallenge"><i class="fa-solid fa-trophy"></i><b data-i18n="Challenges">Challenges</b><small data-i18n="Start from a public one">Start from a public one</small></button>
            </div>
        </div>
        <div id="recBar" class="record-bar" hidden>
            <div class="rec-status"><span class="rec-dot"></span> <span id="recStats" class="muted small">Recording…</span></div>
            <div class="rec-btns">
                <button class="btn btn-ghost" id="recPause"><i class="fa-solid fa-pause"></i></button>
                <button class="btn btn-ghost" id="recPhoto" hidden><i class="fa-solid fa-camera"></i></button>
                <button class="btn btn-ghost" id="recWaypoint" data-i18n="Waypoint"><i class="fa-solid fa-location-dot"></i> Waypoint</button>
                <button class="btn btn-danger" id="recDiscard" hidden title="Discard recording"><i class="fa-solid fa-trash-can"></i></button>
                <button class="btn btn-primary" id="recStop" data-i18n="Finish"><i class="fa-solid fa-flag-checkered"></i> Finish</button>
            </div>
        </div>
        <input id="recPhotoFile" type="file" accept="image/*" capture="environment" hidden>
        <input id="addGpxFile" type="file" accept=".gpx" hidden>
        <!-- the GPX editor: the map + its vertical tool bar (modes left, actions below) -->
        <div id="mapEditor" class="map-editor">
            <div class="map-tools" role="toolbar" aria-label="GPX editing tools">
                <button class="map-tool on" id="toolPan" data-tool="pan" aria-label="Navigate"><i class="fa-solid fa-arrow-pointer"></i></button>
                <button class="map-tool" id="toolNote" data-tool="note" aria-label="Add note"><i class="fa-solid fa-map-pin"></i></button>
                <button class="map-tool" id="toolDraw" data-tool="draw" aria-label="Draw route"><i class="fa-solid fa-pencil"></i></button>
                <button class="map-tool" id="toolCut" data-tool="cut" aria-label="Cut"><i class="fa-solid fa-scissors"></i></button>
                <span class="map-tools-sep"></span>
                <button class="map-tool" id="toolAddGpx" aria-label="Add a GPX track"><i class="fa-solid fa-file-circle-plus"></i></button>
                <button class="map-tool" id="toolReverse" aria-label="Reverse direction"><i class="fa-solid fa-right-left"></i></button>
                <button class="map-tool" id="toolSimplify" aria-label="Simplify"><i class="fa-solid fa-broom"></i></button>
                <button class="map-tool" id="toolAdjust" aria-label="Adjust on the trail"><i class="fa-solid fa-location-crosshairs"></i></button>
                <span class="map-tools-sep"></span>
                <button class="map-tool" id="undoBtn" disabled aria-label="Undo"><i class="fa-solid fa-arrow-rotate-left"></i></button>
                <button class="map-tool" id="redoBtn" disabled aria-label="Redo"><i class="fa-solid fa-arrow-rotate-right"></i></button>
                <span class="map-tools-sep"></span>
                <button class="map-tool" id="toolMax" aria-label="Maximize"><i class="fa-solid fa-expand"></i></button>
            </div>
            <div id="edMap" class="panel map-box"></div>
        </div>
        <div id="rbPanel" hidden>
            <div class="rb-actions">
                <div class="btn-group">
                    <button class="btn btn-primary" id="exportRdbk" data-i18n="Export .rdbk"><i class="fa-solid fa-floppy-disk"></i> Export .rdbk</button>
                    <button class="btn btn-ghost" id="exportGpx" data-i18n="Export GPX"><i class="fa-solid fa-route"></i> Export GPX</button>
                </div>
                <div class="rb-actions-right">
                    <div class="vis-toggle" role="group" aria-label="Visibility">
                        <button class="vis on" id="visPrivate" data-i18n="Private"><i class="fa-solid fa-lock"></i> Private</button>
                        <button class="vis" id="visPublic" data-i18n="Public"><i class="fa-solid fa-globe"></i> Public</button>
                    </div>
                    <button class="btn btn-ghost" id="saveAccount" data-i18n="Save"><i class="fa-solid fa-cloud-arrow-up"></i> Save</button>
                </div>
            </div>
            <div class="meta-card">
                <div class="meta-grid">
                    <label class="meta-field full"><span data-i18n="Title">Title</span><input type="text" id="rbTitle" class="field" placeholder="Roadbook title" data-i18n-ph="Roadbook title"></label>
                    <label class="meta-field full"><span data-i18n="Description">Description</span><textarea id="rbDesc" class="field" rows="2" placeholder="Shown on the public challenge page" data-i18n-ph="Shown on the public challenge page" maxlength="600"></textarea></label>
                    <label class="meta-field"><span data-i18n="Author">Author</span><input type="text" id="rbAuthor" class="field" placeholder="Author name" data-i18n-ph="Author name" maxlength="120"></label>
                    <label class="meta-field"><span data-i18n="Organization">Organization</span><input type="text" id="rbOrg" class="field" placeholder="Organization" data-i18n-ph="Organization" maxlength="120"></label>
                    <div class="meta-field"><span data-i18n="Event logo">Event logo</span>
                        <div class="logo-row">
                            <img id="rbLogoPrev" alt="" class="logo-preview" hidden>
                            <button class="btn btn-ghost" id="rbLogoBtn" data-i18n="Upload logo"><i class="fa-solid fa-image"></i> Upload logo</button>
                            <button class="btn btn-ghost" id="rbLogoClr" hidden title="Remove logo"><i class="fa-solid fa-xmark"></i></button>
                            <input id="rbLogoFile" type="file" accept="image/*" hidden>
                        </div>
                    </div>
                    <div class="meta-field"><span data-i18n="Last modified">Last modified</span><span id="rbModified" class="meta-value">—</span></div>
                </div>
            </div>
            <div id="photosSection" hidden>
                <div class="ed-row between"><div class="icon-category flush" data-i18n="Photos">Photos</div><button class="btn btn-ghost" id="addPhotoBtn" data-i18n="Add photos"><i class="fa-solid fa-camera"></i> Add photos</button></div>
                <input id="photoFile" type="file" accept="image/*" multiple hidden>
                <div id="photoGrid" class="icon-grid"></div>
            </div>
            <div class="icon-category">Notes <span class="muted small notecount" id="noteCount"></span></div>
            <div id="noteList" class="note-list"></div>
        </div><!-- /#rbPanel -->
    </section>

    <!-- VIEW B: note editor (props → vignette → icons) -->
    <section id="viewNote" hidden>
        <div class="ed-row between">
            <button class="btn btn-ghost" id="backToMap" data-i18n="Map &amp; notes"><i class="fa-solid fa-arrow-left"></i> Map &amp; notes</button>
            <div class="btn-group">
                <button class="btn btn-ghost" id="copyVig" title="Copy vignette" aria-label="Copy vignette"><i class="fa-solid fa-copy"></i></button>
                <button class="btn btn-ghost" id="cutVig" title="Cut vignette" aria-label="Cut vignette"><i class="fa-solid fa-scissors"></i></button>
                <button class="btn btn-ghost" id="pasteVig" disabled title="Paste vignette" aria-label="Paste vignette"><i class="fa-solid fa-paste"></i></button>
            </div>
            <button class="btn btn-danger" id="delNote" data-i18n="Delete"><i class="fa-solid fa-trash-can"></i> Delete</button>
            <div class="btn-group">
                <button class="btn btn-ghost" id="prevNote" aria-label="Previous note"><i class="fa-solid fa-chevron-left"></i></button>
                <button class="btn btn-ghost" id="nextNote" aria-label="Next note"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>
        <div id="editor"></div>
        <div class="note-tabs">
            <button id="tabBtnVig" class="note-tab on" data-i18n="Vignette"><i class="fa-solid fa-pen-ruler"></i> Vignette</button>
            <button id="tabBtnMap" class="note-tab" data-i18n="Map"><i class="fa-solid fa-location-dot"></i> Map</button>
        </div>
        <div id="tabVignette" class="vig-split">
            <div class="vig-canvas">
                <div id="canvasWrap">
                    <div id="noteCanvas"></div>
                    <button class="add-junction" id="addJunction" aria-label="Add junction" title="Add junction"><i class="fa-solid fa-code-fork"></i></button>
                </div>
                <div id="noteToolbar"></div>
            </div>
            <div class="vig-icons">
                <div class="ed-row between">
                    <div class="icon-category flush" data-i18n="Icons">Icons</div>
                    <button class="btn btn-ghost" id="addIconBtn" data-i18n="Upload icon"><i class="fa-solid fa-plus"></i> Upload icon</button>
                </div>
                <input id="iconFile" type="file" accept="image/*" multiple hidden>
                <p class="muted small" data-i18n-html="Tap an icon to add it; drag it on the vignette to place it. Uploads are saved <b>inside this roadbook</b>.">Tap an icon to add it; drag it on the vignette to place it. Uploads are saved <b>inside this roadbook</b>.</p>
                <div class="ed-row"><input id="iconSearch" class="field grow" type="search" placeholder="Search icons…" data-i18n-ph="Search icons…" autocomplete="off"></div>
                <div id="iconGrid" class="icon-grid"></div>
            </div>
        </div>
        <div id="tabMap" hidden>
            <div id="noteMap" class="panel map-box"></div>
            <p class="muted small" data-i18n="Drag the highlighted note to reposition it — its order is recomputed automatically. Tap another note to edit it.">Drag the highlighted note to reposition it — its order is recomputed automatically. Tap another note to edit it.</p>
        </div>
    </section>
</main>

<div id="toast" class="toast" hidden></div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/roadbook-core.js"></script>
<script src="../assets/js/rbmap.js"></script>
<script src="../assets/js/note-canvas.js"></script>
<script src="../assets/js/challenges.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/app.js"></script>
<script src="editor.js"></script>
</body>
</html>
