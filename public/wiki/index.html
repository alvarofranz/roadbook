<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0e1116">
    <title>Wiki · RDBK.app</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css?v=1.9.18-245">
    <link rel="stylesheet" href="../assets/css/app.css?v=1.9.18-245">
    <style>
        .wiki-container { max-width: 860px; margin: 1.5rem auto; }
        .wiki-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
        .wiki-nav { display: flex; gap: .5rem; margin: .5rem 0 1.5rem; flex-wrap: wrap; }
        .wiki-nav a { padding: .35rem .8rem; background: var(--card); border: 1px solid var(--line); border-radius: 8px; text-decoration: none; color: var(--text); display: inline-flex; align-items: center; gap: .4rem; white-space: nowrap; transition: all .15s ease; }
        .wiki-nav a:hover, .wiki-nav a.active { background: var(--sand); color: var(--on-sand); border-color: var(--sand); }
        .wiki-nav a i { font-size: .9rem; }
        .wiki-content { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 1.6rem; box-shadow: var(--shadow); }
        .wiki-content h1 { font-size: 1.8rem; margin: 0 0 1rem; border-bottom: 2px solid var(--sand); padding-bottom: .5rem; }
        .wiki-content h2 { font-size: 1.4rem; margin: 1.5rem 0 .6rem; border-left: 3px solid var(--sand); padding-left: .6rem; }
        .wiki-content h3 { font-size: 1.2rem; margin: 1.2rem 0 .4rem; }
        .wiki-content p { line-height: 1.6; margin: .8rem 0; }
        .wiki-content ul, .wiki-content ol { margin: .8rem 0; padding-left: 1.8rem; }
        .wiki-content li { margin: .3rem 0; }
        .wiki-content blockquote { border-left: 4px solid var(--sand); background: rgba(232, 176, 89, .07); padding: .6rem .8rem; margin: .8rem 0; border-radius: 0 8px 8px 0; }
        .wiki-content code { background: var(--card-2); padding: .2rem .4rem; border-radius: 4px; font-family: "SF Mono", Monaco, monospace; }
        .wiki-content pre { background: var(--card-2); padding: .8rem; border-radius: 8px; overflow-x: auto; margin: .8rem 0; font-family: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", monospace; font-size: .85rem; line-height: 1.5; }
        .wiki-content pre code { background: none; padding: 0; }
        .wiki-content table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        .wiki-content th, .wiki-content td { border: 1px solid var(--line); padding: .6rem; text-align: left; }
        .wiki-content th { background: var(--card-2); }
    </style>
</head>
<body>
<header class="topbar"></header>

<main class="wrap">
    <div class="wiki-container">
        <div class="wiki-head">
            <h1><i class="fa-solid fa-circle-question icon-accent"></i> <span data-i18n="Help">Help</span></h1>
        </div>
        <div class="wiki-nav">
            <a href="../"><i class="fa-solid fa-house"></i> <span data-i18n="wiki.nav.home">Home</span></a>
            <a href="#" data-page="welcome"><i class="fa-solid fa-star"></i> <span data-i18n="wiki.nav.welcome">Getting started</span></a>
            <a href="#" data-page="recorder"><i class="fa-solid fa-circle-dot"></i> <span data-i18n="wiki.nav.recorder">Record a track</span></a>
            <a href="#" data-page="editor"><i class="fa-solid fa-pen"></i> <span data-i18n="wiki.nav.editor">Create / edit a roadbook</span></a>
            <a href="#" data-page="reader"><i class="fa-solid fa-compass"></i> <span data-i18n="wiki.nav.reader">Navigate with the Reader</span></a>
            <a href="#" data-page="tripmaster"><i class="fa-solid fa-gauge-high"></i> <span data-i18n="wiki.nav.tripmaster">Use the Tripmaster</span></a>
            <a href="#" data-page="events"><i class="fa-solid fa-calendar-check"></i> <span data-i18n="wiki.nav.events">Event management</span></a>
        </div>
        
        <div id="wikiContent" class="wiki-content">
            <p class="muted" data-i18n="gallery.loading">Loading…</p>
        </div>
    </div>
</main>


<script src="../assets/js/config.js?v=1.9.18-245"></script>
<script src="../assets/js/i18n.es.js?v=1.9.18-245"></script>
<script src="../assets/js/i18n.it.js?v=1.9.18-245"></script>
<script src="../assets/js/i18n.de.js?v=1.9.18-245"></script>
<script src="../assets/js/i18n.fr.js?v=1.9.18-245"></script>
<script src="../assets/js/i18n.js?v=1.9.18-245"></script>
<script src="../assets/js/app.js?v=1.9.18-245"></script>
<script src="../assets/js/marked.min.js?v=1.9.18-245"></script>
<script src="wiki.js?v=1.9.18-245"></script>
</body>
</html>
