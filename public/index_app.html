<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e1116">
    <title>RDBK.app — digital roadbooks for your adventures</title>
    <meta name="description" content="Create, navigate, validate and rank roadbooks for any adventure. Free PWA and the open .rdbk format.">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="96x96" href="assets/favicon-96x96.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css?v=2026.06.17-4">
    <link rel="stylesheet" href="assets/css/app.css?v=2026.06.17-4">
</head>
<body>
<header class="topbar"></header>

<main>
    <!-- TOOL LAUNCHER -->
    <section class="block">
        <nav class="wrap launcher" aria-label="RDBK tools">
            <a class="launch-tile" href="recorder/"><i class="fa-solid fa-circle-dot"></i><span class="launch-name">Recorder</span><span class="launch-sub" data-i18n="Record a GPS track">Record a GPS track</span></a>
            <a class="launch-tile" href="editor/"><i class="fa-solid fa-pen-ruler"></i><span class="launch-name">Editor</span><span class="launch-sub" data-i18n="Build a roadbook">Build a roadbook</span></a>
            <a class="launch-tile" href="reader/"><i class="fa-solid fa-compass"></i><span class="launch-name">Reader</span><span class="launch-sub" data-i18n="Navigate a roadbook">Navigate a roadbook</span></a>
            <a class="launch-tile" href="tripmaster/"><i class="fa-solid fa-gauge-high"></i><span class="launch-name">Tripmaster</span><span class="launch-sub" data-i18n="GPS trip computer">GPS trip computer</span></a>
            <a class="launch-tile" href="ranking/"><i class="fa-solid fa-ranking-star"></i><span class="launch-name">Ranking</span><span class="launch-sub" data-i18n="Build result rankings">Build result rankings</span></a>
        </nav>
    </section>

    <!-- PUBLIC CHALLENGES -->
    <section class="block" id="gallery">
        <div class="wrap">
            <div class="section-head">
                <h2 data-i18n="gallery.title">Public Challenges</h2>
            </div>
            <div class="gallery" id="galleryGrid"><p class="gallery-empty" data-i18n="gallery.loading">Loading challenges…</p></div>
        </div>
    </section>

</main>

<script src="assets/js/i18n.js?v=2026.06.17-4"></script>
<script src="assets/js/challenges.js?v=2026.06.17-4"></script>
<script src="assets/js/app.js?v=2026.06.17-4"></script>
<script src="assets/js/home.js?v=2026.06.17-4"></script>
</body>
</html>
