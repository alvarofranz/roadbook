<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e1116">
    <title>Profile · RDBK.app</title>
    <meta name="description" content="A rider's public profile on RDBK.app — completed roadbooks, statistics and their public roadbooks.">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="profile">
    <meta property="og:site_name" content="RDBK.app">
    <meta property="og:image" content="https://rdbk.app/assets/mockup.png">
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/assets/fontawesome/css/all.min.css?v=1.9.5-170">
    <link rel="stylesheet" href="/assets/css/app.css?v=1.9.5-170">
    <style>
        .pf-head { display: flex; align-items: center; gap: .6rem 1rem; flex-wrap: wrap; margin-bottom: .6rem; }
        .pf-head .avatar { width: 88px; height: 88px; }
        .pf-id { flex: 1 1 12rem; min-width: 0; }
        .pf-id h1 { margin: 0 0 .2rem; font-size: 1.7rem; overflow-wrap: anywhere; }
        .pf-bio { white-space: pre-wrap; line-height: 1.55; margin: .4rem 0 .8rem; }
        .pf-section { margin-top: 1.6rem; }
        /* one completed roadbook: its title, how many runs, then the runs themselves */
        .pf-rb { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin: .7rem 0; }
        .pf-rb > summary { list-style: none; cursor: pointer; padding: .8rem 1rem; display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
        .pf-rb > summary::-webkit-details-marker { display: none; }
        .pf-rb > summary .grow { min-width: 0; overflow-wrap: anywhere; }
        .pf-run { border-top: 1px solid var(--line); padding: .7rem 1rem; }
        .pf-run-head { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
        .pf-run-head .grow { min-width: 0; }
        /* a run's shareable image (#785): the 4:5 card, beside nothing, capped so the list stays a list */
        .pf-run-card { display: flex; flex-direction: column; align-items: flex-start; gap: .4rem; margin: .6rem 0; }
        .pf-run-card img { display: block; width: 100%; max-width: 280px; aspect-ratio: 4/5; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); background: var(--card-2); }
    </style>
</head>
<body>
<header class="topbar"></header>

<main class="wrap page-col" id="pfWrap">
    <p id="pfLoading" class="muted" data-i18n="gallery.loading">Loading…</p>
    <article id="pfContent" hidden>
        <div class="pf-head">
            <img id="pfAvatar" class="avatar" src="/assets/icon.svg" alt="">
            <div class="pf-id">
                <h1 id="pfName"></h1>
                <div class="muted small" id="pfMeta"></div>
            </div>
            <a class="btn btn-ghost" id="pfEdit" href="/account/" hidden><i class="fa-solid fa-gear"></i> <span data-i18n="Account settings">Account settings</span></a>
        </div>
        <p class="pf-bio" id="pfBio"></p>
        <div id="pfStats"></div>

        <section class="pf-section">
            <h2><i class="fa-solid fa-flag-checkered icon-accent"></i> <span data-i18n="Completed roadbooks">Completed roadbooks</span></h2>
            <p class="muted small" id="pfPrivateHint" hidden data-i18n="Only you see your private runs, marked with a lock.">Only you see your private runs, marked with a lock.</p>
            <div id="pfRuns"></div>
        </section>

        <section class="pf-section">
            <h2><i class="fa-solid fa-book-open icon-accent"></i> <span id="pfRbTitle" data-i18n="Public roadbooks">Public roadbooks</span></h2>
            <div class="gallery" id="pfRoadbooks"></div>
        </section>
    </article>
</main>


<script src="/assets/js/config.js?v=1.9.5-170"></script>
<script src="/assets/js/roadbook-core.js?v=1.9.5-170"></script>
<script src="/assets/js/i18n.es.js?v=1.9.5-170"></script>
<script src="/assets/js/i18n.it.js?v=1.9.5-170"></script>
<script src="/assets/js/i18n.de.js?v=1.9.5-170"></script>
<script src="/assets/js/i18n.fr.js?v=1.9.5-170"></script>
<script src="/assets/js/i18n.js?v=1.9.5-170"></script>
<script src="/assets/js/app.js?v=1.9.5-170"></script>
<script src="/assets/js/run-report.js?v=1.9.5-170"></script>
<!-- the page script lives in /assets/js/: anything inside /u/ could be taken for a username -->
<script src="/assets/js/profile-page.js?v=1.9.5-170"></script>
</body>
</html>
