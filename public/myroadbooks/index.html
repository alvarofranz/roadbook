<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e1116">
    <title>My roadbooks · RDBK.app</title>
    <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css?v=2026.06.19-1">
    <link rel="stylesheet" href="../assets/css/app.css?v=2026.06.19-1">
    <style>
        #myRoadbooks { max-width: 860px; margin: 0 auto; }
        .section-bar { display: flex; justify-content: space-between; align-items: center; gap: .5rem; flex-wrap: wrap; margin: 1.4rem 0 .6rem; }
        .section-bar h1 { margin: 0; font-size: 1.6rem; }
        /* single full-width column: one roadbook per row, readable on wide and narrow screens alike */
        .rb-grid { display: flex; flex-direction: column; gap: .6rem; }
        .roadbook-row { display: flex; align-items: center; gap: .5rem; background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: .7rem .9rem; }
        .roadbook-row .meta { flex: 1; min-width: 0; }
        .roadbook-row .meta b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .roadbook-row .meta small { color: var(--muted); white-space: nowrap; }
        .roadbook-row .btn { flex-shrink: 0; padding: .5rem .6rem; margin: 0; }
        /* public/private pill — green globe when shared, muted lock when private */
        .rb-badge { flex-shrink: 0; display: inline-flex; align-items: center; gap: .3rem; font-size: .72rem; font-weight: 700; padding: .25rem .55rem; border-radius: 999px; border: 1px solid var(--line); }
        .rb-badge.public { color: var(--ok); border-color: var(--ok); }
        .rb-badge.private { color: var(--muted); }
    </style>
</head>
<body>
<header class="topbar"></header>

<main class="wrap">
    <div id="myRoadbooks">
        <div class="section-bar">
            <h1 data-i18n="My roadbooks">My roadbooks</h1>
            <a class="btn btn-primary" href="../editor/" data-i18n="New roadbook"><i class="fa-solid fa-plus"></i> New roadbook</a>
        </div>
        <div id="rbList" class="rb-grid"><p class="muted small">Loading…</p></div>
    </div>
</main>

<div id="toast" class="toast" hidden></div>

<script src="../assets/js/i18n.js?v=2026.06.19-1"></script>
<script src="../assets/js/app.js?v=2026.06.19-1"></script>
<script src="myroadbooks.js?v=2026.06.19-1"></script>
</body>
</html>
