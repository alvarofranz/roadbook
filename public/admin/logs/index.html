<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e1116">
    <title>Logs · Admin · RDBK.app</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
    <link rel="manifest" href="../../manifest.json">
    <link rel="stylesheet" href="../../assets/fontawesome/css/all.min.css?v=1.5.0-14">
    <link rel="stylesheet" href="../../assets/css/app.css?v=1.5.0-14">
    <style>
        .logs-toolbar { margin: .2rem 0 .8rem; }
        .logs-toolbar .field { flex: 1; min-width: 180px; margin: 0; }

    </style>
</head>
<body>
<header class="topbar"></header>

<main class="wrap admin-wrap">
    <h1 data-i18n="Logs">Logs</h1>
    <div id="adminMsg" class="muted" data-i18n="Loading…">Loading…</div>
    <div id="logsWrap" hidden>
        <section class="cfg-card">
            <h2 data-i18n="Activity">Activity</h2>
            <div class="toolbar logs-toolbar">
                <input type="search" id="logSearch" class="field" placeholder="Search action, user, IP…" data-i18n-ph="Search action, user, IP…" autocomplete="off" spellcheck="false">
            </div>
            <div id="logTable" class="muted small">—</div>
            <div class="pager">
                <button class="btn btn-ghost" id="logPrev" aria-label="Previous" data-i18n-aria="Previous"><i class="fa-solid fa-chevron-left"></i></button>
                <span id="logPageInfo" class="muted small"></span>
                <button class="btn btn-ghost" id="logNext" aria-label="Next" data-i18n-aria="Next"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </section>
        <section class="cfg-card">
            <h2 data-i18n="Cron log">Cron log</h2>
            <p class="hint"><span data-i18n="Deploy logs live in GitHub Actions.">Deploy logs live in GitHub Actions.</span> <a href="https://github.com/alvarofranz/roadbook/actions" target="_blank" rel="noopener">GitHub Actions <i class="fa-solid fa-arrow-up-right-from-square"></i></a></p>
            <pre id="logCron" class="log-pre">—</pre>
        </section>
    </div>
</main>

<div id="toast" class="toast" hidden></div>

<script src="../../assets/js/roadbook-core.js?v=1.5.0-14"></script>
<script src="../../assets/js/i18n.es.js?v=1.5.0-14"></script>
<script src="../../assets/js/i18n.it.js?v=1.5.0-14"></script>
<script src="../../assets/js/i18n.de.js?v=1.5.0-14"></script>
<script src="../../assets/js/i18n.fr.js?v=1.5.0-14"></script>
<script src="../../assets/js/i18n.js?v=1.5.0-14"></script>
<script src="../../assets/js/app.js?v=1.5.0-14"></script>
<script src="admin-logs.js?v=1.5.0-14"></script>
</body>
</html>
