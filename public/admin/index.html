<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e1116">
    <title>Admin · RDBK.app</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css?v=1.9.7-197">
    <link rel="stylesheet" href="../assets/css/app.css?v=1.9.7-197">
    <style>
        /* Column table; min-width keeps the columns intact and the shared .table-scroll wrapper
           scrolls horizontally on narrow/medium screens instead of squeezing the layout. */
        .users-table { width: 100%; min-width: 700px; border-collapse: collapse; font-size: .9rem; }
        .users-table th, .users-table td { padding: .5rem .6rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
        .users-table th { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; }
        .users-table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .u-handle { color: var(--muted); font-size: .8rem; margin-top: .1rem; word-break: break-word; }
        .u-quota { color: var(--muted); font-size: .82rem; } /* second line of the Disk cell: assigned space */
        .u-actions { display: flex; gap: .35rem; flex-wrap: wrap; }
        .u-actions .btn { padding: .25rem .55rem; font-size: .78rem; }
        /* the filters wrap as a row: the search takes what is left, the others keep a usable width (#706) */
        .users-toolbar { margin-bottom: .7rem; color: var(--muted); }
        .users-toolbar #userSearch { flex: 1 1 14rem; min-width: 0; }
        .users-toolbar #userOrgFilter { flex: 1 1 10rem; min-width: 8rem; max-width: 16rem; }
        .users-toolbar .users-event-filter { flex: 0 1 14rem; min-width: 8rem; width: auto; }
        #userRbFilter.active, #userEvFilter.active { background: var(--sand); color: var(--on-sand); border-color: var(--sand); }
        /* a phone: every user is a card — name and disk on top, the actions wrapping underneath */
        @media (max-width: 640px) {
            .users-toolbar #userOrgFilter, .users-toolbar .users-event-filter { flex: 1 1 100%; max-width: none; }
            .users-table { min-width: 0; }
            .users-table thead { display: none; }
            .users-table tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .2rem .6rem; padding: .7rem 0; border-bottom: 1px solid var(--line); }
            .users-table td { padding: 0; border: 0; }
            .users-table td:last-child { grid-column: 1 / -1; margin-top: .4rem; }
        }
        /* #552: roadbook list + in-popup map preview, side by side on desktop.
           Triple class: .modal-card.wide (520px) would otherwise win on specificity
           and crush the two-column grid into a 520px card. */
        .modal-card.wide.rb-list-map { max-width: min(1160px, 96vw); }
        .rb-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 1rem; align-items: start; }
        .rb-split-list { min-width: 0; overflow-x: auto; }
        .rb-split-list .act-table td:first-child { white-space: normal; }
        .rb-map-pane { position: sticky; top: 0; min-width: 0; }
        #rbsMap { height: 420px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
        #rbsMapTitle { margin: .5rem 0 0; }
        .rb-row-sel { outline: 2px solid var(--sand); outline-offset: -2px; border-radius: 6px; }
        @media (max-width: 1024px) {
            .rb-split { grid-template-columns: minmax(0, 1fr); }
            .rb-map-pane { position: static; }
            #rbsMap { height: 300px; }
        }
    </style>
</head>
<body>
<header class="topbar"></header>

<main class="wrap admin-wrap">
    <div class="head-row">
        <h1 data-i18n="User management">User management</h1>
        <div class="btnrow" id="usersHeadActions" hidden>
            <a class="btn btn-ghost" href="users-map/"><i class="fa-solid fa-map-location-dot"></i> <span data-i18n="User locations">User locations</span></a>
            <button class="btn btn-primary" id="userCreate"><i class="fa-solid fa-user-plus"></i> <span data-i18n="Create user">Create user</span></button>
        </div>
    </div>
    <div id="adminMsg" class="muted" data-i18n="Loading…">Loading…</div>
    <div id="usersBox" hidden>
        <div class="toolbar users-toolbar">
            <i class="fa-solid fa-magnifying-glass"></i><input type="search" id="userSearch" class="field" placeholder="Search users…" data-i18n-ph="Search users…" autocomplete="off" spellcheck="false">
            <input type="text" id="userOrgFilter" class="field" placeholder="Organization" data-i18n-ph="Organization" autocomplete="off">
            <select id="userEventFilter" class="field users-event-filter" aria-label="Events" data-i18n-aria="Events"></select>
            <button class="btn btn-ghost" id="userRbFilter" type="button" aria-pressed="false" title="With roadbooks" data-i18n-title="With roadbooks" aria-label="With roadbooks" data-i18n-aria="With roadbooks"><i class="fa-solid fa-book"></i></button>
            <button class="btn btn-ghost" id="userEvFilter" type="button" aria-pressed="false" title="Event organizers" data-i18n-title="Event organizers" aria-label="Event organizers" data-i18n-aria="Event organizers"><i class="fa-solid fa-calendar-check"></i></button>
        </div>
        <div class="table-scroll">
            <table class="users-table">
                <thead><tr>
                    <th data-i18n="User">User</th>
                    <th class="num" data-i18n="Disk">Disk</th>
                    <th></th>
                </tr></thead>
                <tbody id="usersBody"></tbody>
            </table>
        </div>
        <div id="usersPager" class="pager"></div>
    </div>
</main>


<script src="../assets/js/roadbook-core.js?v=1.9.7-197"></script>
<script src="../assets/js/rbzip.js?v=1.9.7-197"></script>
<script src="../assets/js/i18n.es.js?v=1.9.7-197"></script>
<script src="../assets/js/i18n.it.js?v=1.9.7-197"></script>
<script src="../assets/js/i18n.de.js?v=1.9.7-197"></script>
<script src="../assets/js/i18n.fr.js?v=1.9.7-197"></script>
<script src="../assets/js/i18n.js?v=1.9.7-197"></script>
<script src="../assets/js/app.js?v=1.9.7-197"></script>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="../assets/js/rbmap.js?v=1.9.7-197"></script>
<script src="admin.js?v=1.9.7-197"></script>
</body>
</html>
