<body>
<header class="topbar"></header>

<main class="wrap admin-wrap">
    <h1 data-i18n="Roadbook trash">Roadbook trash</h1>
    <div id="adminMsg" class="muted" data-i18n="Loading…">Loading…</div>
    <div id="trashBody" hidden>
        <p class="muted small" id="trashNote"></p>
        <div class="head-row">
            <div class="rb-toolbar grow"><i class="fa-solid fa-magnifying-glass"></i><input type="search" class="rb-search" id="trashSearch" placeholder="Search by title, author or date…" data-i18n-ph="Search by title, author or date…" aria-label="Search by title, author or date…" data-i18n-aria="Search by title, author or date…" autocomplete="off" spellcheck="false"></div>
            <button class="btn btn-danger" id="trashPurgeExpired" type="button" hidden><i class="fa-solid fa-trash-can"></i> <span data-i18n="Delete expired">Delete expired</span> <span id="trashPurgeExpiredCount"></span></button>
        </div>
        <div id="trashList"></div>
        <div class="pager" id="trashPager"></div>
    </div>
</main>
