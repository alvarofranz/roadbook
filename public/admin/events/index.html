<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e1116">
    <title>Events · Admin · RDBK.app</title>
    <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
    <link rel="manifest" href="../../manifest.json">
    <link rel="stylesheet" href="../../assets/fontawesome/css/all.min.css?v=2026.07.02-4">
    <link rel="stylesheet" href="../../assets/css/app.css?v=2026.07.02-4">
    <style>
        #adminWrap { max-width: 1000px; margin: 1.2rem auto; }
        /* event editor: a roadbook row = the pick checkbox + its per-roadbook participation mode */
        .ev-rb-row { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
        .ev-rb-row .checkbox-row { flex: 1; min-width: 12rem; margin: 0; }
        .ev-rbmode { max-width: 15rem; }
        /* categories: an editable, reorderable list — name input grows, small action buttons follow */
        .ev-cat-row { display: flex; align-items: center; gap: .4rem; margin: .3rem 0; }
        .ev-cat-row .field { flex: 1; margin: 0; }
        .ev-cat-row .btn { width: auto; }
    </style>
</head>
<body>
<header class="topbar"></header>

<main class="wrap" id="adminWrap">
    <h1 data-i18n="Events">Events</h1>
    <div id="adminMsg" class="muted" data-i18n="Loading…">Loading…</div>
    <div id="evBody" hidden>
        <div class="btnrow"><button class="btn btn-primary" id="evNew" data-i18n="New event"><i class="fa-solid fa-plus"></i> New event</button></div>
        <div id="evList" class="rb-grid"></div>
    </div>
</main>

<div id="toast" class="toast" hidden></div>

<script src="../../assets/js/i18n.fr.js?v=2026.07.02-4"></script>
<script src="../../assets/js/i18n.js?v=2026.07.02-4"></script>
<script src="../../assets/js/app.js?v=2026.07.02-4"></script>
<script src="admin-events.js?v=2026.07.02-4"></script>
</body>
</html>
