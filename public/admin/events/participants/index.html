<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e1116">
    <title>Participants · RDBK.app</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="../../../assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../../../assets/apple-touch-icon.png">
    <link rel="manifest" href="../../../manifest.json">
    <link rel="stylesheet" href="../../../assets/fontawesome/css/all.min.css?v=1.7.0-17">
    <link rel="stylesheet" href="../../../assets/css/app.css?v=1.7.0-17">
    <style>
        .pp-search { margin: .8rem 0; }
        .pp-search .field { flex: 1; max-width: 360px; margin: 0; }
        .pp-search .btn { width: auto; margin: 0 0 0 auto; }
        .pp-add-search { margin: 0 0 .8rem; }
        #ppPendingFilter.active { background: var(--accent); color: #fff; }
    </style>
</head>
<body>
<header class="topbar"></header>

<main class="wrap admin-wrap">
    <p><a href="../" id="backLink"><i class="fa-solid fa-arrow-left"></i> <span data-i18n="Back to events">Back to events</span></a></p>
    <h1 id="ppHeading"><span data-i18n="Participants">Participants</span> <span class="muted" id="ppHeadCount"></span></h1>
    <div class="muted small" id="ppEventTitle"></div>
    <div id="adminMsg" class="muted" data-i18n="Loading…">Loading…</div>

    <div id="ppBody" hidden>
        <div class="toolbar pp-search">
            <input id="ppActivateIn" class="field ev-act-code" data-i18n-ph="Activation code" placeholder="Activation code" autocomplete="off" maxlength="6" style="text-transform:uppercase;font-size:1.4rem;font-weight:800;letter-spacing:.3em;width:10rem">
            <button class="btn btn-primary" id="ppActivate" type="button"><i class="fa-solid fa-check"></i> <span data-i18n="Activate">Activate</span></button>
            <button class="btn btn-ghost" id="ppScanQr" type="button" title="Scan QR"><i class="fa-solid fa-camera"></i></button>
        </div>
        <hr>
        <div class="toolbar pp-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="ppSearchIn" class="field" type="search" data-i18n-ph="Search participants…" placeholder="Search participants…" autocomplete="off">
            <button class="btn btn-ghost" id="ppPendingFilter" type="button"><i class="fa-solid fa-hourglass-half"></i> <span data-i18n="Pending only">Pending only</span></button>
            <button class="btn btn-primary" id="ppAdd" type="button"><i class="fa-solid fa-user-plus"></i> <span data-i18n="Add participant">Add participant</span></button>
        </div>
        <div id="ppList"></div>
        <div class="pager" id="ppPager"></div>
        <div class="btnrow end" style="margin-top:1rem">
            <button class="btn btn-ghost" id="ppExportBottom" type="button"><i class="fa-solid fa-file-csv"></i> <span data-i18n="Export CSV">Export CSV</span></button>
        </div>
    </div>
</main>

<div id="toast" class="toast" hidden></div>

<script src="../../../assets/js/config.js?v=1.7.0-17"></script>
<script src="../../../assets/js/roadbook-core.js?v=1.7.0-17"></script>
<script src="../../../assets/js/i18n.es.js?v=1.7.0-17"></script>
<script src="../../../assets/js/i18n.it.js?v=1.7.0-17"></script>
<script src="../../../assets/js/i18n.de.js?v=1.7.0-17"></script>
<script src="../../../assets/js/i18n.fr.js?v=1.7.0-17"></script>
<script src="../../../assets/js/i18n.js?v=1.7.0-17"></script>
<script src="../../../assets/js/app.js?v=1.7.0-17"></script>
<script src="../../../assets/js/qr-scan.js?v=1.7.0-17"></script>
<script src="participants.js?v=1.7.0-17"></script>
</body>
</html>
