<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e1116">
    <title>Participants · RDBK.app</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="../../../assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../../../assets/apple-touch-icon.png">
    <link rel="manifest" href="../../../manifest.json">
    <link rel="stylesheet" href="../../../assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../../../assets/css/app.css">
    <style>
        #adminWrap { max-width: 1000px; margin: 1.2rem auto; }
        .pp-search { display: flex; gap: .5rem; align-items: center; margin: .8rem 0; }
        .pp-search .field { flex: 1; max-width: 360px; margin: 0; }
        .pp-search .btn { width: auto; margin: 0 0 0 auto; }
        /* one participant per row: name grows, the remove action follows */
        .ev-line { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; padding: .25rem 0; }
        .ev-line .meta { flex: 1; min-width: 10rem; }
        .ev-pager { display: flex; align-items: center; justify-content: center; gap: .9rem; margin-top: .8rem; }
        .ev-pager .btn { margin: 0; width: auto; }
    </style>
</head>
<body>
<header class="topbar"></header>

<main class="wrap" id="adminWrap">
    <p><a href="../" id="backLink"><i class="fa-solid fa-arrow-left"></i> <span data-i18n="Back to events">Back to events</span></a></p>
    <h1 id="ppHeading"><span data-i18n="Participants">Participants</span> <span class="muted" id="ppHeadCount"></span></h1>
    <div class="muted small" id="ppEventTitle"></div>
    <div id="adminMsg" class="muted" data-i18n="Loading…">Loading…</div>

    <div id="ppBody" hidden>
        <div class="pp-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="ppSearchIn" class="field" type="search" data-i18n-ph="Search participants…" placeholder="Search participants…" autocomplete="off">
            <button class="btn btn-ghost" id="ppExport" type="button"><i class="fa-solid fa-file-csv"></i> <span data-i18n="Export CSV">Export CSV</span></button>
        </div>
        <div id="ppList"></div>
        <div class="ev-pager" id="ppPager"></div>
    </div>
</main>

<div id="toast" class="toast" hidden></div>

<script src="../../../assets/js/roadbook-core.js"></script>
<script src="../../../assets/js/i18n.es.js"></script>
<script src="../../../assets/js/i18n.it.js"></script>
<script src="../../../assets/js/i18n.de.js"></script>
<script src="../../../assets/js/i18n.fr.js"></script>
<script src="../../../assets/js/i18n.js"></script>
<script src="../../../assets/js/app.js"></script>
<script src="participants.js"></script>
</body>
</html>
