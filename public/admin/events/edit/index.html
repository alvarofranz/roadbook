<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e1116">
    <title>Event · RDBK.app</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="../../../assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../../../assets/apple-touch-icon.png">
    <link rel="manifest" href="../../../manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
    <link rel="stylesheet" href="../../../assets/fontawesome/css/all.min.css?v=1.3.3-8">
    <link rel="stylesheet" href="../../../assets/css/app.css?v=1.3.3-8">
    <style>
        /* title + page actions (View · Save) share one row */
        .ev-head-row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
        .ev-head-row h1 { margin: 0; flex: 1; min-width: 12rem; }
        .ev-head-row .btnrow { margin: 0; }
        .ev-section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 1rem 1.2rem; margin: 1rem 0; }
        .ev-section h2 { font-size: 1.1rem; margin: .2rem 0 .8rem; }
        /* associated roadbooks: header + rows share one grid so the participation-mode label
           sits exactly over its column (title · mode · edit · remove) */
        .ev-rb-head, .ev-rb-row { display: grid; grid-template-columns: 1fr 15rem 2.8rem 2.8rem; gap: .5rem; align-items: center; }
        .ev-rb-head h2 { margin: 0; }
        .ev-rb-row { padding: .35rem 0; border-bottom: 1px solid var(--line); }
        .ev-rb-row:last-child { border-bottom: 0; }
        .ev-rb-row .meta { min-width: 0; }
        @media (max-width: 640px) {
            .ev-rb-head, .ev-rb-row { grid-template-columns: 1fr 1fr; }
            .ev-rb-head span { display: none; }
        }
        /* dates + Public on ONE row, labels inline to the LEFT of each date box */
        .ev-dates-row { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin: .35rem 0; }
        .ev-dates-row .field { width: auto; margin: 0; }
        .ev-dates-row .field-label, .ev-dates-row .checkbox-row { margin: 0; }
        .ev-dates-row .checkbox-row { margin-left: auto; }
        .ev-add-row { display: flex; gap: .5rem; align-items: center; margin-top: .5rem; }
        .ev-add-row .field { flex: 1; margin: 0; }
        .ev-add-row .btn { width: auto; }
        .ev-join-code { font-family: ui-monospace, monospace; font-size: 1.25rem; letter-spacing: .15em; }
        /* the add-roadbook picker (inside the modal): scrollable result list */
        .ev-pick-list { max-height: 45vh; overflow: auto; margin-top: .5rem; }
        /* the event logo (#151): avatar-style preview beside its upload/remove actions */
        .ev-logo-thumb { width: 84px; height: 84px; border-radius: 14px; object-fit: cover; background: var(--card-2); border: 1px solid var(--line); }
        /* the duplicated Save at the foot of the form (#179) */
        .ev-save-bottom { margin: 1rem 0 2rem; }
        .ev-hq-map { width: 100%; height: 280px; border-radius: 12px; border: 1px solid var(--line); margin: .4rem 0; }
        .ev-coords-row { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin: .2rem 0; }
        .ev-coords-row .field-label { margin: 0; white-space: nowrap; }
        .ev-coord { width: 10rem; font-family: ui-monospace, monospace; font-size: .82rem; }
        .ev-link-url { font-family: ui-monospace, monospace; font-size: .95rem; word-break: break-all; }
    </style>
</head>
<body>
<header class="topbar"></header>

<main class="wrap admin-wrap">
    <p><a href="../" id="backLink"><i class="fa-solid fa-arrow-left"></i> <span data-i18n="Back to events">Back to events</span></a></p>
    <!-- heading row: the title with the page actions (View · Save) on the SAME line -->
    <div class="ev-head-row">
        <h1 id="evHeading" data-i18n="Event">Event</h1>
        <div class="btnrow" id="evActions" hidden>
            <a class="btn btn-ghost" id="evView" hidden><i class="fa-solid fa-eye"></i> <span data-i18n="View">View</span></a>
            <button class="btn btn-primary" id="evSave" type="button"><i class="fa-solid fa-floppy-disk"></i> <span data-i18n="Save">Save</span></button>
        </div>
    </div>
    <div id="adminMsg" class="muted" data-i18n="Loading…">Loading…</div>

    <div id="evBody" hidden>
        <!-- 1 · the event's own parameters -->
        <section class="ev-section">
            <div class="ev-line" id="logoRow" hidden>
                <img id="evLogoImg" class="ev-logo-thumb" alt="" hidden>
                <span class="grow"></span>
                <button class="btn btn-ghost" id="evLogoUpload" type="button"><i class="fa-solid fa-image"></i> <span data-i18n="Upload logo">Upload logo</span></button>
                <button class="btn btn-ghost" id="evLogoRemove" type="button" hidden><i class="fa-solid fa-trash-can icon-danger"></i> <span data-i18n="Remove logo">Remove logo</span></button>
                <input id="evLogoFile" type="file" accept="image/*" hidden>
            </div>
            <label class="field-label" for="evTitleIn" data-i18n="Title">Title</label>
            <input id="evTitleIn" class="field" autocomplete="off">
            <label class="field-label" for="evDescIn" data-i18n="Description">Description</label>
            <textarea id="evDescIn" class="field" rows="3"></textarea>
            <label class="field-label" for="evWebsiteIn" data-i18n="Organizer website">Organizer website</label>
            <input id="evWebsiteIn" class="field" type="url" placeholder="https://…" autocomplete="off">
            <label class="field-label" data-i18n="Event headquarters">Event headquarters</label>
            <div id="evHqMap" class="ev-hq-map"></div>
            <div class="ev-coords-row">
                <span class="muted small" data-i18n="Tap the map to set the event headquarters location.">Tap the map to set the event headquarters location.</span>
                <label class="field-label" for="evHqLat">Lat</label><input id="evHqLat" class="field ev-coord" type="number" step="any" placeholder="Latitude" data-i18n-ph="Latitude" autocomplete="off">
                <label class="field-label" for="evHqLon">Lon</label><input id="evHqLon" class="field ev-coord" type="number" step="any" placeholder="Longitude" data-i18n-ph="Longitude" autocomplete="off">
            </div>
            <div class="ev-dates-row">
                <label class="field-label" for="evStart" data-i18n="Start date">Start date</label><input id="evStart" type="date" class="field">
                <label class="field-label" for="evEnd" data-i18n="End date">End date</label><input id="evEnd" type="date" class="field">
                <label class="checkbox-row"><input type="checkbox" id="evPublic"> <span data-i18n="Public">Public</span></label>
            </div>
        </section>

        <!-- 2 · who manages this event (and can edit its roadbook associations) -->
        <section class="ev-section" id="orgSection" hidden>
            <h2 data-i18n="Organizers">Organizers</h2>
            <div id="orgList"></div>
            <div class="ev-add-row" id="orgAddRow">
                <input id="orgSearchIn" class="field" data-i18n-ph="Search users…" placeholder="Search users…" autocomplete="off">
                <input id="orgOrgIn" class="field" data-i18n-ph="Organization" placeholder="Organization" autocomplete="off" list="orgSuggest">
                <datalist id="orgSuggest"></datalist>
            </div>
            <div id="orgResults"></div>
        </section>

        <!-- 3 · the associated roadbooks -->
        <section class="ev-section" id="rbSection" hidden>
            <div class="ev-rb-head">
                <h2 data-i18n="Roadbooks">Roadbooks</h2>
                <span class="muted small" data-i18n="Participation mode">Participation mode</span>
            </div>
            <div id="rbList"></div>
            <div class="btnrow"><button class="btn btn-ghost" id="rbAdd" type="button"><i class="fa-solid fa-plus"></i> <span data-i18n="Add roadbook">Add roadbook</span></button></div>
        </section>

        <!-- 4 · the join code; the roster itself lives on its own page (#144) -->
        <section class="ev-section" id="ppSection" hidden>
            <h2><span data-i18n="Participants">Participants</span> <span class="muted" id="ppHeadCount"></span></h2>
            <div class="ev-line" id="joinRow">
                <span class="meta" id="joinCodeOut"></span>
                <button class="btn btn-ghost" id="joinCopy" type="button" hidden><i class="fa-solid fa-copy"></i> <span data-i18n="Copy">Copy</span></button>
                <button class="btn btn-ghost" id="joinRotate" type="button"><i class="fa-solid fa-rotate"></i> <span data-i18n="New join code">New join code</span></button>
                <button class="btn btn-ghost" id="joinClear" type="button" hidden><i class="fa-solid fa-ban icon-danger"></i> <span data-i18n="Disable joining">Disable joining</span></button>
            </div>
            <div class="btnrow"><a class="btn btn-ghost" id="ppPageLink"><i class="fa-solid fa-users"></i> <span data-i18n="View participants">View participants</span></a></div>
        </section>

        <!-- 5 · participant link for attendees (#163) -->
        <section class="ev-section" id="evLink" hidden>
            <h2 data-i18n="Link for participants">Link for participants</h2>
            <p class="muted small" data-i18n="Share this link with attendees so they access a simplified view showing only this event and its roadbooks:">Share this link with attendees so they access a simplified view showing only this event and its roadbooks:</p>
            <div class="ev-line" id="evLinkRow">
                <a class="meta ev-link-url" id="evLinkUrl" href="" target="_blank" rel="noopener"></a>
                <button class="btn btn-ghost" id="evLinkCopy" type="button" hidden><i class="fa-solid fa-copy"></i> <span data-i18n="Copy">Copy</span></button>
            </div>
        </section>

        <!-- a second Save, so a long form doesn't force a scroll back to the top -->
        <div class="btnrow end ev-save-bottom">
            <button class="btn btn-primary" id="evSaveBottom" type="button"><i class="fa-solid fa-floppy-disk"></i> <span data-i18n="Save">Save</span></button>
        </div>
    </div>
</main>

<div id="toast" class="toast" hidden></div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="../../../assets/js/config.js?v=1.3.3-8"></script>
<script src="../../../assets/js/roadbook-core.js?v=1.3.3-8"></script>
<script src="../../../assets/js/rbmap.js?v=1.3.3-8"></script>
<script src="../../../assets/js/i18n.es.js?v=1.3.3-8"></script>
<script src="../../../assets/js/i18n.it.js?v=1.3.3-8"></script>
<script src="../../../assets/js/i18n.de.js?v=1.3.3-8"></script>
<script src="../../../assets/js/i18n.fr.js?v=1.3.3-8"></script>
<script src="../../../assets/js/i18n.js?v=1.3.3-8"></script>
<script src="../../../assets/js/app.js?v=1.3.3-8"></script>
<script src="event-edit.js?v=1.3.3-8"></script>
</body>
</html>
