<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e1116">
    <title>Public roadbook · RDBK.app</title>
    <meta name="description" content="A public digital roadbook on RDBK.app — sign in to read it, navigate it with GPS or export a PDF.">
    <meta name="robots" content="noindex">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="RDBK.app">
    <meta property="og:image" content="https://rdbk.app/assets/mockup.png">
    <meta property="og:locale" content="en">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://rdbk.app/assets/mockup.png">
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/assets/fontawesome/css/all.min.css?v=1.9.2-117">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
    <link rel="stylesheet" href="/assets/css/app.css?v=1.9.2-117">
    <style>
        .ch-owner { display: flex; gap: .6rem; align-items: center; margin-top: .5rem; }
        #chLoading { padding: 2rem 0; }
        .ch-logo { flex-shrink: 0; max-height: 120px; max-width: 240px; width: auto; height: auto; object-fit: contain; }
        .ch-desc { color: var(--text); line-height: 1.6; }
        .ch-map { height: 320px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); margin: 1rem 0; }
        #chNotes { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    </style>
</head>
<body>
<header class="topbar"></header>

<main class="wrap page-col" id="chWrap">
    <p id="chLoading" class="muted" data-i18n="gallery.loading">Loading…</p>
    <article id="chContent" hidden>
        <p class="ch-ev-bar" id="chEvent" hidden></p>
        <!-- title + owner on the left, the event logo on the right: the shared heading row (#642) -->
        <div class="head-row">
            <div class="grow">
                <h1 id="chTitle"></h1>
                <div class="ch-owner">
                    <img id="chAvatar" class="avatar avatar-sm" alt="">
                    <div><b id="chOwner"></b> <span id="chStatus"></span><div class="muted small" id="chMeta"></div></div>
                </div>
            </div>
            <img id="chLogo" class="ch-logo" alt="" hidden>
        </div>
        <div class="btnrow start">
            <a class="btn btn-primary" id="chNav"><i class="fa-solid fa-location-arrow"></i> <span data-i18n="Navigate">Navigate</span></a>
            <button class="btn btn-ghost" id="chPdf" type="button"><i class="fa-solid fa-file-pdf"></i> <span data-i18n="PDF">PDF</span></button>
            <a class="btn btn-ghost" id="chEdit" hidden><i class="fa-solid fa-pen"></i> <span data-i18n="Edit">Edit</span></a>
        </div>
        <p id="chDesc" class="ch-desc"></p>
        <div id="chMap" class="ch-map" hidden></div>
        <div class="icon-category" data-i18n="Notes">Notes</div>
        <div id="chNotes"></div>
    </article>
</main>

<div id="toast" class="toast" hidden></div>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="/assets/js/config.js?v=1.9.2-117"></script>
<script src="/assets/js/roadbook-core.js?v=1.9.2-117"></script>
<script src="/assets/js/note-canvas.js?v=1.9.2-117"></script>
<script src="/assets/js/rb-pdf.js?v=1.9.2-117"></script>
<script src="/assets/js/rbmap.js?v=1.9.2-117"></script>
<script src="/assets/js/challenges.js?v=1.9.2-117"></script>
<script src="/assets/js/i18n.es.js?v=1.9.2-117"></script>
<script src="/assets/js/i18n.it.js?v=1.9.2-117"></script>
<script src="/assets/js/i18n.de.js?v=1.9.2-117"></script>
<script src="/assets/js/i18n.fr.js?v=1.9.2-117"></script>
<script src="/assets/js/i18n.js?v=1.9.2-117"></script>
<script src="/assets/js/app.js?v=1.9.2-117"></script>
<script src="challenge.js?v=1.9.2-117"></script>
</body>
</html>
