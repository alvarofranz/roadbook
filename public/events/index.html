<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e1116">
    <title data-i18n="seo.events.title">Events — RDBK.app</title>
    <meta name="description" data-i18n-content="seo.events.desc" content="Discover roadbook events and rallies: browse upcoming events and their public roadbooks.">
    <link rel="canonical" href="https://rdbk.app/events/">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="RDBK.app">
    <meta property="og:title" content="Events — RDBK.app">
    <meta property="og:description" content="Discover roadbook events and rallies: browse upcoming events and their public roadbooks.">
    <meta property="og:url" content="https://rdbk.app/events/">
    <meta property="og:image" content="https://rdbk.app/assets/mockup.png">
    <meta property="og:locale" content="en">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Events — RDBK.app">
    <meta name="twitter:description" content="Discover roadbook events and rallies: browse upcoming events and their public roadbooks.">
    <meta name="twitter:image" content="https://rdbk.app/assets/mockup.png">
    <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css?v=1.3.5-10">
    <link rel="stylesheet" href="../assets/css/app.css?v=1.3.5-10">
    <style>
        #evWrap { max-width: var(--maxw); padding: 1.2rem 1.1rem 5rem; }
        /* organiser CTA: an explained card (title + one line) with a short action button, plus the
           secondary "classify results" — a clean row, not a fat button floating in the header */
        .ev-cta { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: .9rem 1.1rem; margin: 1rem 0 1.4rem; }
        .ev-cta-text { display: flex; flex-direction: column; gap: .15rem; min-width: 12rem; }
        .ev-cta-text b { font-size: 1.02rem; }
        .ev-cta-actions { display: flex; gap: .5rem; flex-shrink: 0; flex-wrap: wrap; }
    </style>
</head>
<body>
<header class="topbar"></header>

<main class="wrap" id="evWrap">
    <div class="tool-titlebar">
        <h1 data-i18n="Events">Events</h1>
        <a class="tool-help" href="../features/events/"><i class="fa-solid fa-circle-info"></i> Info</a>
    </div>
    <p class="muted" data-i18n="Browse the events organised by the community.">Browse the events organised by the community.</p>
    <div class="ev-cta">
        <div class="ev-cta-text">
            <b data-i18n="Organise your event on RDBK.app">Organise your event on RDBK.app</b>
            <span class="muted small" data-i18n="Set up an event with its roadbooks, participants and rankings.">Set up an event with its roadbooks, participants and rankings.</span>
        </div>
        <div class="ev-cta-actions">
            <a class="btn btn-primary" id="evOrganise" href="../features/events/" data-i18n="Create">Create</a>
            <a class="btn btn-ghost" href="../ranking/" data-i18n="Classify results">Classify results</a>
        </div>
    </div>
    <div class="rb-toolbar"><i class="fa-solid fa-magnifying-glass"></i><input type="search" class="rb-search" id="evSearch" placeholder="Search events…" data-i18n-ph="Search events…" autocomplete="off" spellcheck="false"></div>
    <div class="gallery" id="evGrid"><p class="gallery-empty" data-i18n="gallery.loading">Loading…</p></div>
    <div class="pager" id="evPager"></div>
</main>

<script src="../assets/js/i18n.es.js?v=1.3.5-10"></script>
<script src="../assets/js/i18n.it.js?v=1.3.5-10"></script>
<script src="../assets/js/i18n.de.js?v=1.3.5-10"></script>
<script src="../assets/js/i18n.fr.js?v=1.3.5-10"></script>
<script src="../assets/js/i18n.js?v=1.3.5-10"></script>
<script src="../assets/js/roadbook-core.js?v=1.3.5-10"></script>
<script src="../assets/js/app.js?v=1.3.5-10"></script>
<script src="events.js?v=1.3.5-10"></script>
</body>
</html>
