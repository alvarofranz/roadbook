<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e1116">
    <title>Tripmaster · RDBK.app</title>
    <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css?v=2026.06.25-10">
    <link rel="stylesheet" href="../assets/css/app.css?v=2026.06.25-10">
    <style>
        .trip-main { max-width: 560px; padding: 1rem 1.1rem 1.4rem; border-radius: 16px; transition: background .35s ease; }
        .readout .num2 { font-size: 2.1rem; font-weight: 800; font-variant-numeric: tabular-nums; }
        /* odometer rows: value + Reset + ±10 m correctors stacked, all in one line */
        .readout-row { display: flex; align-items: center; gap: .6rem; text-align: left; }
        .readout-row .readout-val { flex: 1; min-width: 0; }
        .readout-row .num { font-size: clamp(1.9rem, 9vw, 3rem); }
        .corr { display: flex; flex-direction: column; gap: .35rem; flex-shrink: 0; }
        .corr .btn { padding: .35rem .6rem; }
        #tmReset { flex-shrink: 0; }
        /* Total + Partial side by side; compact values/controls to fit two columns */
        .tm-odo { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
        .tm-odo .readout { padding: .7rem .6rem; }
        .tm-odo .readout-row { gap: .4rem; }
        .tm-odo .num, .tm-odo .num2 { font-size: clamp(1.3rem, 6vw, 2.1rem); }
        .tm-odo .corr .btn { padding: .25rem .4rem; font-size: .72rem; }
        @media (max-width: 420px) { .tm-odo { grid-template-columns: 1fr; } }
        .mini .spd-unit { font-size: .85rem; color: var(--muted); font-weight: 700; }
        /* CAP needle: 0° = up = North, rotates to the travel heading */
        .cap-needle { margin-left: .35rem; font-size: .8em; color: var(--sand); transform: rotate(var(--cap-rotation, 0deg)); transition: transform .35s ease; }
        /* action buttons aligned under the three mini boxes; "mark note" (col 3) is twice
           as tall, spanning down to the "End the trip" row (which sits small, bottom-left) */
        .tm-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .6rem; margin-top: .8rem; }
        .tm-controls .tm-timerbtns { grid-column: 1; grid-row: 1; }
        .tm-controls #tmRecBtn { grid-column: 2; grid-row: 1; }
        .tm-controls .tm-marknote { grid-column: 3; grid-row: 1 / span 2; }
        .tm-controls #tmExit { grid-column: 1; grid-row: 2; justify-self: start; width: auto; flex-direction: row; }
        .tm-controls .btn { width: 100%; flex-direction: column; gap: .25rem; padding: .6rem .3rem; font-size: .8rem; justify-content: center; }
        .tm-controls .btn i { font-size: 1.2rem; }
        .tm-timerbtns { display: flex; gap: .4rem; }
        .tm-timerbtns .btn { flex: 1; min-width: 0; }
        /* black button background so the controls stand out over the alert-coloured column */
        .trip-main .btn-ghost, .trip-main .btn-danger { background: #000; }
        .trip-main .btn-ghost:hover { background: #111; }
        .mini-button { cursor: pointer; font: inherit; }
        .mini-button:hover { border-color: var(--sand); }
        #tmSpeed { transition: color .2s; color: var(--speed-band, var(--text)); }
        #tmSpeed.over::after { content: "\f071"; font-family: "Font Awesome 6 Pro"; font-weight: 900; font-size: .5em; margin-left: .35em; vertical-align: middle; }
        .hold-btn { position: relative; overflow: hidden; }
        .hold-fill { position: absolute; inset: 0; width: 0; background: rgba(255, 90, 69, .4); }
        .hold-btn.holding .hold-fill { width: 100%; transition: width 5s linear; }
        .hold-field-label { position: relative; z-index: 1; }
        @media (orientation: landscape) and (max-height: 540px) { header.topbar { display: none; } }
    </style>
</head>
<body>
<header class="topbar"></header>

<main class="wrap trip-main" id="tmMain">
    <div class="dash">
        <div class="tm-odo">
            <div class="readout primary">
                <div class="field-label" data-i18n="Total">Total</div>
                <div class="readout-row">
                    <div class="corr"><button class="btn btn-ghost" id="tmTotPlus10">+10 m</button><button class="btn btn-ghost" id="tmTotMinus10">−10 m</button></div>
                    <div class="readout-val"><span class="num" id="tmTotal">0.00</span> <span class="unit">km</span></div>
                </div>
            </div>
            <div class="readout">
                <div class="field-label" data-i18n="Partial">Partial</div>
                <div class="readout-row">
                    <button class="btn btn-ghost hold-btn" id="tmReset" aria-label="Reset" data-i18n-aria="Reset" title="Reset" data-i18n-title="Reset"><span class="hold-fill"></span><span class="hold-field-label"><i class="fa-solid fa-rotate-left"></i></span></button>
                    <div class="readout-val"><span class="num2" id="tmPartial">0.00</span> <span class="unit">km</span></div>
                    <div class="corr"><button class="btn btn-ghost" id="tmPlus10">+10 m</button><button class="btn btn-ghost" id="tmMinus10">−10 m</button></div>
                </div>
            </div>
        </div>
        <div class="row3">
            <button class="mini mini-button" id="tmSpeedAlert" data-i18n-aria="Speed alert" aria-label="Speed alert"><div class="value"><span id="tmSpeed">0</span> <span class="spd-unit">km/h</span></div><div class="key" data-i18n="Press to set Alert">Press to set Alert</div></button>
            <div class="mini"><div class="value"><span id="tmCap">—</span><i class="fa-solid fa-arrow-up cap-needle" id="tmCapArrow"></i></div><div class="key">CAP °</div></div>
            <div class="mini"><div class="value" id="tmClock">--:--</div><div class="key" data-i18n="Clock">Clock</div></div>
        </div>
        <div class="row3">
            <div class="mini"><div class="value" id="tmTimer">0:00</div><div class="key" data-i18n="Timer">Timer</div></div>
            <div class="mini"><div class="value" id="tmMax">0</div><div class="key" data-i18n="Max km/h">Max km/h</div></div>
            <div class="mini"><div class="value" id="tmNotes">0</div><div class="key" data-i18n="Waypoints">Waypoints</div></div>
        </div>
        <div class="tm-controls">
            <div class="tm-timerbtns">
                <button class="btn btn-ghost" id="tmTimerBtn" aria-label="Timer" data-i18n-aria="Timer" title="Timer" data-i18n-title="Timer"><i class="fa-solid fa-stopwatch"></i></button>
                <button class="btn btn-ghost" id="tmTimerReset" hidden aria-label="Reset timer" data-i18n-aria="Reset timer" title="Reset timer" data-i18n-title="Reset timer"><i class="fa-solid fa-rotate-left"></i></button>
            </div>
            <button class="btn btn-ghost" id="tmRecBtn"><i class="fa-solid fa-circle-dot"></i> <span data-i18n="Record GPX">Record GPX</span></button>
            <button class="btn btn-ghost tm-marknote" id="tmNoteBtn"><i class="fa-solid fa-flag"></i> <span data-i18n="mark note">mark note</span></button>
            <button class="btn btn-danger" id="tmExit"><i class="fa-solid fa-flag-checkered"></i> <span data-i18n="End the trip">End the trip</span></button>
        </div>
    </div>
</main>

<div id="toast" class="toast" hidden></div>

<script src="../assets/js/roadbook-core.js?v=2026.06.25-10"></script>
<script src="../assets/js/gps-meter.js?v=2026.06.25-10"></script>
<script src="../assets/js/gpx-recorder.js?v=2026.06.25-10"></script>
<script src="../assets/js/i18n.js?v=2026.06.25-10"></script>
<script src="../assets/js/app.js?v=2026.06.25-10"></script>
<script src="../assets/js/status-bar.js?v=2026.06.25-10"></script>
<script src="tripmaster.js?v=2026.06.25-10"></script>
</body>
</html>
