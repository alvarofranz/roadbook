<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0e1116">
    <title>Tripmaster · RDBK.app</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css?v=1.9.4-149">
    <link rel="stylesheet" href="../assets/css/app.css?v=1.9.4-149">
    <style>
        .trip-main { max-width: 560px; padding: 1rem 1.1rem 1.4rem; border-radius: 16px; background: var(--tm-band, transparent); transition: background .35s ease; } /* --tm-band = the speed-alert tint, data-driven */
        .readout .num2 { font-size: 2.1rem; font-weight: 800; font-variant-numeric: tabular-nums; }
        /* odometer rows: value + Reset + ±10 m correctors stacked, all in one line */
        .readout-row { display: flex; align-items: center; gap: .6rem; text-align: left; }
        .readout-row .readout-val { flex: 1; min-width: 0; }
        .readout-row .num { font-size: clamp(1.9rem, 9vw, 3rem); }
        .corr { display: flex; flex-direction: column; gap: .35rem; flex-shrink: 0; }
        .corr .btn { padding: .35rem .6rem; }
        #tmReset { flex-shrink: 0; }
        /* Total + Partial side by side; compact values/controls to fit two columns */
        .tm-odo { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
        .tm-odo .readout { padding: .7rem .6rem; }
        .tm-odo .readout-row { gap: .4rem; }
        .tm-odo .num, .tm-odo .num2 { font-size: clamp(1.3rem, 6vw, 2.1rem); }
        .tm-odo .corr .btn { padding: .25rem .4rem; font-size: .72rem; }
        @media (max-width: 340px) { .tm-odo { grid-template-columns: 1fr; } } /* two columns fit down to small phones — stacking doubles the dashboard height (#250) */
        .mini .spd-unit { font-size: .85rem; color: var(--muted); font-weight: 700; }
        /* CAP needle: the shared .cap-arrow rotation, sized to sit beside the readout;
           parked (invisible but keeping its space) until a heading exists */
        .cap-needle { margin-left: .35rem; font-size: .8em; color: var(--sand); }
        .cap-needle.idle { visibility: hidden; }
        /* the readouts: speed · CAP · max on one row, timer · notes sharing the next, no gap */
        .tm-tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .6rem; }
        .tm-tiles > * { grid-column: span 2; }
        .tm-tiles > .tm-timer, .tm-tiles > .tm-timer + .mini { grid-column: span 3; }
        .tm-timer { position: relative; padding: 0; }
        .mini-tap { width: 100%; height: 100%; padding: inherit; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; padding: .7rem .4rem; border-radius: inherit; }
        .tm-timer:hover { border-color: var(--sand); }
        .tm-timer.running .value { color: var(--sand); }
        .tm-timer-reset { position: absolute; top: .3rem; right: .3rem; padding: .2rem .4rem; }
        /* the actions: Mark note is the big one (it also resets the partial), then record · fullscreen · end */
        .tm-controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; margin-top: .8rem; }
        .tm-controls .tm-marknote { grid-column: 1 / -1; min-height: 64px; font-size: 1rem; }
        .tm-controls .btn { width: 100%; flex-direction: column; gap: .25rem; padding: .6rem .3rem; font-size: .8rem; justify-content: center; }
        .tm-controls .btn i { font-size: 1.2rem; }
        /* desktop and tablet (#721): a dashboard that uses the width — readouts on the left, the
           actions in a column on the right, Mark note the tallest */
        @media (min-width: 900px) {
            .trip-main { max-width: 1080px; padding: 1.4rem 1.6rem 1.6rem; }
            .trip-main .dash { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr); grid-template-areas: "odo ctl" "tiles ctl"; gap: 1rem 1.4rem; align-items: start; }
            .tm-odo { grid-area: odo; }
            .tm-tiles { grid-area: tiles; }
            .tm-controls { grid-area: ctl; grid-template-columns: 1fr; margin-top: 0; }
            .tm-controls .tm-marknote { min-height: 150px; font-size: 1.15rem; }
            .tm-controls .tm-marknote i { font-size: 2rem; }
            .tm-controls .btn { flex-direction: row; justify-content: flex-start; padding: .8rem 1rem; font-size: .9rem; gap: .6rem; }
            .tm-controls .tm-marknote { flex-direction: column; justify-content: center; }
            .tm-odo .num, .tm-odo .num2 { font-size: 3rem; }
            .trip-main .mini .value { font-size: 1.9rem; }
        }
        /* black button background so the controls stand out over the alert-coloured column */
        .trip-main .btn-ghost, .trip-main .btn-danger { background: #000; }
        .trip-main .btn-ghost:hover { background: #111; }
        .mini-button { cursor: pointer; font: inherit; }
        .mini-button:hover { border-color: var(--sand); }
        #tmSpeed { transition: color .2s; color: var(--speed-band, var(--text)); }
        #tmSpeed.over::after { content: "\f071"; font-family: var(--fa-font-solid); font-weight: 900; font-size: .5em; margin-left: .35em; vertical-align: middle; }
        .hold-btn { position: relative; overflow: hidden; }
        .hold-fill { position: absolute; inset: 0; width: 0; background: rgba(255, 90, 69, .4); }
        .hold-btn.holding .hold-fill { width: 100%; transition: width 5s linear; }
        .hold-icon { position: relative; z-index: 1; }
        /* phones: compact the dashboard so the whole run view fits on screen without scrolling (#250) */
        @media (max-width: 480px) {
            .trip-main { padding: .5rem .7rem 1rem; }
            .trip-main .dash { gap: .55rem; padding-top: .4rem; }
            .tm-odo { gap: .55rem; }
            .tm-odo .readout { padding: .45rem .5rem; }
            .tm-odo .num, .tm-odo .num2 { font-size: clamp(1.3rem, 6vw, 2.1rem); }
            /* the ±10 m correctors move to their own row UNDER the number: three controls plus a
               long odometer value never fit side by side in a 2-column readout on a phone */
            .tm-odo .readout-row { flex-wrap: wrap; }
            .tm-odo .corr { order: 2; flex-direction: row; width: 100%; justify-content: center; gap: .5rem; }
            .tm-odo #tmReset { padding: .4rem .55rem; }
            .tm-tiles { gap: .5rem; }
            .trip-main .mini { padding: .5rem .4rem; }
            .trip-main .mini .value { font-size: 1.3rem; }
            .tm-controls { margin-top: .1rem; gap: .5rem; }
            .tm-controls .btn { padding: .5rem .3rem; }
        }
    </style>
</head>
<body class="gps-tool">
<header class="topbar"></header>

<main class="wrap trip-main" id="tmMain">
    <p id="tmNativeHint" class="native-hint" data-i18n="native.better.gps.tripmaster" hidden><i class="fa-solid fa-mobile-screen-button"></i> For continuous GPS odometer and background recording, use the native iOS or Android app.</p>
    <div class="dash">
        <div class="tm-odo">
            <div class="readout primary">
                <div class="readout-caption" data-i18n="Total">Total</div>
                <!-- the ±10 m correctors sit on the right of both readouts (#646) -->
                <div class="readout-row">
                    <div class="readout-val"><span class="num" id="tmTotal">0.00</span> <span class="unit">km</span></div>
                    <div class="corr"><button class="btn btn-ghost" id="tmTotPlus10">+10 m</button><button class="btn btn-ghost" id="tmTotMinus10">−10 m</button></div>
                </div>
            </div>
            <div class="readout">
                <div class="readout-caption" data-i18n="Partial">Partial</div>
                <div class="readout-row">
                    <button class="btn btn-ghost hold-btn" id="tmReset" aria-label="Reset" data-i18n-aria="Reset" title="Reset" data-i18n-title="Reset"><span class="hold-fill"></span><span class="hold-icon"><i class="fa-solid fa-rotate-left"></i></span></button>
                    <div class="readout-val"><span class="num2" id="tmPartial">0.00</span> <span class="unit">km</span></div>
                    <div class="corr"><button class="btn btn-ghost" id="tmPlus10">+10 m</button><button class="btn btn-ghost" id="tmMinus10">−10 m</button></div>
                </div>
            </div>
        </div>
        <!-- the readouts a driver uses; the clock lives in the status bar, once (#721) -->
        <div class="tm-tiles">
            <button class="mini mini-button" id="tmSpeedAlert" type="button" aria-label="Speed — tap to set the alert" data-i18n-aria="Speed — tap to set the alert"><div class="value"><span id="tmSpeed">0</span> <span class="spd-unit">km/h</span></div><div class="key"><i class="fa-solid fa-bell"></i> <span id="tmSpeedKey" data-i18n="Speed">Speed</span></div></button>
            <div class="mini"><div class="value"><span id="tmCap">—</span><i class="fa-solid fa-arrow-up cap-arrow cap-needle" id="tmCapArrow"></i></div><div class="key">CAP °</div></div>
            <div class="mini"><div class="value" id="tmMax">0</div><div class="key" data-i18n="Max km/h">Max km/h</div></div>
            <!-- the stopwatch IS its tile: tap to start / pause; its reset appears once it holds time -->
            <div class="mini tm-timer">
                <button class="mini-tap" id="tmTimerBtn" type="button"><div class="value" id="tmTimer">0:00</div><div class="key"><i class="fa-solid fa-stopwatch" id="tmTimerIcon"></i> <span id="tmTimerKey" data-i18n="Timer">Timer</span></div></button>
                <button class="btn btn-ghost btn-sm tm-timer-reset" id="tmTimerReset" type="button" hidden aria-label="Reset timer" data-i18n-aria="Reset timer" title="Reset timer" data-i18n-title="Reset timer"><i class="fa-solid fa-rotate-left"></i></button>
            </div>
            <div class="mini"><div class="value" id="tmNotes">0</div><div class="key" data-i18n="Notes">Notes</div></div>
        </div>
        <div class="tm-controls">
            <button class="btn btn-primary tm-marknote" id="tmNoteBtn" type="button"><i class="fa-solid fa-location-dot"></i> <span data-i18n="Mark note">Mark note</span></button>
            <button class="btn btn-ghost" id="tmRecBtn" type="button"><i class="fa-solid fa-circle-dot"></i> <span data-i18n="Record GPX">Record GPX</span></button>
            <button class="btn btn-ghost" id="tmFs" type="button"><i class="fa-solid fa-expand"></i> <span data-i18n="Fullscreen">Fullscreen</span></button>
            <!-- ending a session looks the same in every GPS tool: fa-right-from-bracket, "End" (#645) -->
            <button class="btn btn-ghost" id="tmExit" type="button"><i class="fa-solid fa-right-from-bracket icon-danger"></i> <span data-i18n="End">End</span></button>
        </div>
    </div>
</main>

<div id="toast" class="toast" hidden></div>

<script src="../assets/js/roadbook-core.js?v=1.9.4-149"></script>
<script src="../assets/js/gps-meter.js?v=1.9.4-149"></script>
<script src="../assets/js/gpx-recorder.js?v=1.9.4-149"></script>
<script src="../assets/js/i18n.es.js?v=1.9.4-149"></script>
<script src="../assets/js/i18n.it.js?v=1.9.4-149"></script>
<script src="../assets/js/i18n.de.js?v=1.9.4-149"></script>
<script src="../assets/js/i18n.fr.js?v=1.9.4-149"></script>
<script src="../assets/js/i18n.js?v=1.9.4-149"></script>
<script src="../assets/js/app.js?v=1.9.4-149"></script>
<script src="../assets/js/status-bar.js?v=1.9.4-149"></script>
<script src="tripmaster.js?v=1.9.4-149"></script>
</body>
</html>
